# Relaxed markdownlint config — the docs use long lines, inline HTML (admonitions,
# <small>, mermaid), and duplicate headings across chapters by design.
default: true
MD013: false   # line length — prose wraps naturally
MD033: false   # inline HTML — Material admonitions / <small> / details
MD024:         # duplicate headings allowed (same section names across chapters)
  siblings_only: true
MD046: false   # code block style — we mix fenced + admonition-indented
MD041: false   # first line need not be a top-level heading (frontmatter/tags)
