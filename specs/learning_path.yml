# Learning path — the single source of truth for reading order
#
# Five places used to encode this order independently and could drift in silence:
# mkdocs.yml's nav, each domain index's "## Micro-chapters" list, the
# "Continue to the next topic" link ending every -flashcards.md, roadmap.md, and
# the French navigation. tools/check_learning_path.py compares all of them to this
# file, so the order is edited here and nowhere else.
#
# Order is PEDAGOGICAL, not the syllabus order. The syllabus lists topics; it does
# not claim they teach well in that sequence. Three domains were reordered against
# real dependencies:
#   php-web-security  interfaces before attributes (an attribute class implements
#                     one), abstract-classes next to oop, and the four enrichment
#                     chapters placed where they belong instead of appended.
#   http              methods before cookies and caching, which build on them.
#   security          the syllabus taught Authorization and Configuration before
#                     Firewalls and Users - deciding access before establishing who
#                     is being secured. Now: who -> where they come from -> how they
#                     prove it -> what they carry -> how access is decided -> the
#                     declarative rules.
#
# status:
#   OFFICIAL      on the Symfony 8 certification syllabus.
#   ADDITIONAL    genuinely useful for Expert preparation, not on the official list.
#   OUT_OF_SCOPE  explicitly outside the exam (no topic carries it yet).
#
# Coverage statistics must always separate these: counting ADDITIONAL concepts
# towards syllabus coverage would overstate it.
#
# The classification below is SEEDED from specs/TraceabilityMatrix.md's own
# "additional/depth" rows plus http/client-server, which the project owner named
# explicitly. It is not a fresh read of certification.symfony.com - that page has no
# git mirror and is blocked by this environment's egress proxy, so no row here is
# evidence of what the official syllabus says. Re-verify per domain as each lot is
# processed.
#
# There is deliberately no `next:` field: the next topic is the following entry, and
# a stored copy could contradict the order it is meant to describe.

