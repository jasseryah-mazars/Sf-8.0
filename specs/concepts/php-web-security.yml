# Concept coverage matrix — PHP & Web Security
#
# What this is for: "the topic is covered" cannot be inferred from a question
# count. Twenty-eight questions can pile onto three ideas and leave ten
# untouched. This file names the ideas, so coverage becomes a fact a tool can
# check rather than a claim a writer makes about their own work.
#
# Each concept must appear in the lesson, in at least one exam question, and on
# at least one flashcard. tools/check_expert_readiness.py fails a topic when a
# concept is taught but never examined, and reports questions and cards that
# match no concept at all — that second direction is what catches decorative
# content and a keyword set that has gone stale.
#
# How matching works, and its honest limit: a concept is "present" in a file when
# any of its `keywords` appears there. Keywords are chosen to be discriminating —
# API names, language keywords, version markers — which is reliable on a corpus
# this technical, but it is EVIDENCE, NOT PROOF. A question can mention
# `insteadof` without really testing conflict resolution. Confirming that the
# question tests the concept is the reviewer agent's Pass B, not this file's job.
# Treat a green result as "nothing is obviously missing", never as "this is good".
#
# status mirrors specs/learning_path.yml: OFFICIAL concepts count towards syllabus
# coverage, ADDITIONAL ones never do.

