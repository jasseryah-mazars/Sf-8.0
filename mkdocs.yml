site_name: Symfony 8 Expert Certification Prep
site_description: >-
  Community preparation resource aligned with the Symfony 8.0 certification
  syllabus (Advanced & Expert). Coverage is validated through the
  traceability matrix and automated checks. Deep dives, diagrams, exercises,
  certification traps, and last-minute revision.
site_author: Community
# Update site_url + repo_url to your fork before deploying.
site_url: https://jasseryah-mazars.github.io/Sf-8.0/
repo_url: https://github.com/jasseryah-mazars/Sf-8.0
repo_name: Sf-8.0
edit_uri: edit/master/docs/
copyright: >-
  Content licensed under MIT. Symfony is a trademark of Symfony SAS.
  This is an independent community project and is not affiliated with Symfony SAS.

# Authoring templates & internal notes — not part of the published site.
exclude_docs: |
  _meta/

theme:
  name: material
  language: en
  features:
    # navigation.instant removed: incompatible with the i18n language switcher's
    # contextual links (mkdocs-static-i18n).
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tooltips
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
  icon:
    repo: fontawesome/brands/github

plugins:
  - search
  - tags:
      tags_file: tags.md
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          name: English
          default: true
          build: true
        - locale: fr
          name: Français
          build: true
          site_description: >-
            Ressource communautaire de préparation alignée sur le programme
            de la certification Symfony 8.0 (Advanced & Expert). La
            couverture est validée via la matrice de traçabilité et des
            contrôles automatisés. Deep dives, diagrammes, exercices, pièges
            de certification et révision de dernière minute.
          # Partial nav translation (learner-navigation mission): only the
          # top-level structural labels this pass introduced/renamed are
          # translated. Chapter/area titles, tool names (Roadmap, Revision
          # Hub, Exam Simulator, Source Tours...) are deliberately left
          # untranslated — every existing French page in this site already
          # uses those same English proper nouns in its own prose (verified
          # by grep, not assumed), so translating only the nav label would
          # create a NEW mismatch, not fix one. Untranslated entries fall
          # back to their English label automatically (mkdocs-static-i18n's
          # own behavior) — an explicit, bounded partial translation, not a
          # claim of full nav parity. See specs/NavigationExperienceAudit.md
          # Finding 5.
          nav_translations:
            Home: Accueil
            Getting Started: Commencer
            Certification Domains: Domaines de certification
            Practice & Exams: Tests et simulateur
            Resources: Ressources
            Recommended Resources: Ressources recommandées
            Out-of-Syllabus Appendices: Annexes hors syllabus
  - git-revision-date-localized:
      enable_creation_date: false
      fallback_to_build_date: true

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
      # Color `php` fragments that omit <?php (Pygments needs startinline).
      extend_pygments_lang:
        - name: php
          lang: php
          options:
            startinline: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.caret
  - pymdownx.tilde
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/jasseryah-mazars/Sf-8.0
  version:
    provider: mike
  generator: false

extra_css:
  - assets/quiz.css
  - assets/code.css
  - assets/navigation.css

extra_javascript:
  # Loaded FIRST and deliberately not lazily. mkdocs-material only fetches
  # mermaid from unpkg when `mermaid` is undefined, so defining it here means
  # the site never reaches the CDN and always renders with the exact version
  # tools/validate_mermaid.py validated against. Kept in sync by
  # tools/vendor_mermaid.py, which refuses to run on a version mismatch.
  - assets/mermaid.min.js
  - assets/quiz.js
  - assets/a11y.js
  - assets/progress.js

