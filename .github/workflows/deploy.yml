name: Build & Deploy Docs

on:
  push:
    branches:
      - main
      - master
      - claude/symfony8-cert-platform-mgkdkr
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Keep only the newest run per branch. Superseded runs are cancelled cleanly so a
# burst of pushes never leaves a stuck/queued deploy — the latest content always wins.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # needed for git-revision-date plugin

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Completeness & references audit
        run: python tools/audit.py

      - name: Doc/source version-pin check (blocking — Symfony 8.0 exclusively)
        run: python tools/check_doc_version_refs.py

      - name: Validate quiz bank
        run: python tools/validate_quiz.py

      - name: Quiz near-duplicate scan (report only, non-blocking)
        run: python tools/check_quiz_duplicates.py

      - name: Regenerate interactive quiz dataset
        run: python tools/gen_quiz_json.py

      - name: Section-order audit (report only)
        run: python tools/check_section_order.py

      - name: Link inventory (offline, no network)
        run: python tools/check_links.py --offline

      - name: Set up PHP (lint code snippets)
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: none

      - name: Lint PHP snippets
        run: python tools/lint_php.py

      - name: Lint YAML snippets
        run: python tools/lint_yaml.py

      - name: Lint Twig snippets (block-tag pairing)
        run: python tools/lint_twig.py

      - name: Lint XML snippets
        run: python tools/lint_xml.py

      - name: Structural checks (Official References, placeholders, internal links)
        run: python tools/check_placeholders.py

      - name: Build site (strict)
        run: mkdocs build --strict

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/claude/symfony8-cert-platform-mgkdkr'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    # Deploy from main/master (canonical branches) or the current working branch.
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/claude/symfony8-cert-platform-mgkdkr'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
