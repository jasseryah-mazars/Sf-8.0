name: Build & Deploy Docs

on:
  push:
    # master is the project's sole development/integration/publication
    # branch as of this workflow revision (main kept as a defensive
    # fallback in case the repo's default branch is ever renamed to it —
    # ci runs there too, but only master ever deploys, see the `deploy`
    # job below). The old per-session `claude/...` feature branches are
    # intentionally no longer triggers: they merge into master, which is
    # what builds and deploys from here on.
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Keep only the newest run per branch. Superseded runs are cancelled cleanly so a
# burst of pushes never leaves a stuck/queued deploy — the latest content always wins.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # needed for git-revision-date plugin

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Completeness & references audit
        run: python tools/audit.py

      - name: Exclusions consistency check (blocking)
        run: python tools/check_exclusions.py

      - name: Doc/source version-pin check (blocking — Symfony 8.0 exclusively)
        run: python tools/check_doc_version_refs.py

      - name: Validate quiz bank
        run: python tools/validate_quiz.py

      - name: Quiz near-duplicate scan (report only, non-blocking)
        run: python tools/check_quiz_duplicates.py

      - name: Regenerate interactive quiz dataset
        run: python tools/gen_quiz_json.py

      - name: Section-order audit (report only)
        run: python tools/check_section_order.py

      - name: Link inventory (offline, no network)
        run: python tools/check_links.py --offline

      - name: Set up PHP (lint code snippets)
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: none

      - name: Lint PHP snippets
        run: python tools/lint_php.py

      - name: Lint YAML snippets
        run: python tools/lint_yaml.py

      - name: Lint Twig snippets (block-tag pairing)
        run: python tools/lint_twig.py

      - name: Lint XML snippets
        run: python tools/lint_xml.py

      - name: Structural checks (Official References, placeholders, internal links)
        run: python tools/check_placeholders.py

      - name: Editorial structure checks (nav/docs consistency, code fences, empty sections)
        run: python tools/check_editorial_structure.py

      - name: Report freshness check (informational only)
        run: python tools/check_report_freshness.py

      - name: Build site (strict)
        run: mkdocs build --strict

      - name: Upload Pages artifact
        # master only — see the `deploy` job's own comment for why.
        if: github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    # master is this project's sole publication branch (see Objective 2 of
    # the master-consolidation mission this comment was added under). Not
    # main: this repo's actual default/working branch is master, and the
    # github-pages environment's deployment-branch policy is scoped to it
    # accordingly — deploying from anything else would need that policy
    # widened, which is explicitly against project policy (never open Pages
    # deployment to arbitrary branches). If the repo's default branch is
    # ever genuinely renamed to main, update this condition and the Pages
    # environment's branch policy together, deliberately, not by widening
    # this check on its own.
    if: github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
