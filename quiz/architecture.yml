categories:
  - name: "Architecture — Symfony Flex"
    questions:
      - id: "ARCH-FLEX-01"
        type: "single"
        difficulty: "easy"
        subchapter: "architecture/flex"
        concepts: ["flex", "composer-plugin", "recipes"]
        syllabus: "Symfony Architecture → Symfony Flex"
        question: "What kind of tool is Symfony Flex?"
        answers:
          - value: "A Composer plugin that resolves aliases and applies recipes"
            correct: true
          - value: "A runtime kernel event listener"
            correct: false
          - value: "A templating engine"
            correct: false
        explanation: >-
          Flex is a Composer plugin. It runs at Composer install/update time,
          resolving package aliases and applying recipes; it has no role during
          HTTP request handling.
        documentation: "https://symfony.com/doc/current/setup.html"
      - id: "ARCH-FLEX-02"
        type: "single"
        difficulty: "easy"
        subchapter: "architecture/flex"
        concepts: ["symfony.lock", "recipes", "composer.lock"]
        syllabus: "Symfony Architecture → Symfony Flex"
        question: "What does the symfony.lock file track?"
        answers:
          - value: "Which recipes are installed and their versions"
            correct: true
          - value: "The compiled service container"
            correct: false
          - value: "Locked HTTP sessions"
            correct: false
        explanation: >-
          symfony.lock records applied recipes so Flex can detect updates and
          reverse them; it is distinct from composer.lock (package versions).
        documentation: "https://symfony.com/doc/current/setup.html"
      - id: "ARCH-FLEX-03"
        type: "single"
        difficulty: "medium"
        subchapter: "architecture/flex"
        concepts: ["recipes", "bundles", "configurators"]
        syllabus: "Symfony Architecture → Symfony Flex"
        question: "How does a recipe auto-register a bundle?"
        answers:
          - value: "By writing an entry into config/bundles.php"
            correct: true
          - value: "Via an #[AsBundle] attribute"
            correct: false
          - value: "By editing services.yaml"
            correct: false
        explanation: >-
          The bundles configurator adds the bundle class to config/bundles.php,
          which the kernel reads at boot via MicroKernelTrait::registerBundles().
        documentation: "https://symfony.com/doc/current/bundles.html"
      - id: "ARCH-FLEX-04"
        type: "single"
        difficulty: "medium"
        subchapter: "architecture/flex"
        concepts: ["recipes-contrib", "recipes", "opt-in"]
        syllabus: "Symfony Architecture → Symfony Flex"
        question: "Which repository holds the community (opt-in) recipes?"
        answers:
          - value: "symfony/recipes-contrib"
            correct: true
          - value: "symfony/recipes"
            correct: false
          - value: "symfony/flex-recipes"
            correct: false
        explanation: >-
          Curated recipes live in symfony/recipes; community recipes live in
          symfony/recipes-contrib and require enabling extra.symfony.allow-contrib.
        documentation: "https://github.com/symfony/recipes-contrib"
      - id: "ARCH-FLEX-05"
        type: "trap"
        difficulty: "medium"
        subchapter: "architecture/flex"
        concepts: ["symfony.lock", "composer.lock", "version-control"]
        syllabus: "Symfony Architecture → Symfony Flex"
        question: "Which statement about symfony.lock vs composer.lock is correct?"
        answers:
          - value: "symfony.lock records applied recipes; composer.lock records resolved package versions — both are committed"
            correct: true
          - value: "symfony.lock replaces composer.lock and makes it optional"
            correct: false
          - value: "Both files should be git-ignored because Flex regenerates them"
            correct: false
          - value: "symfony.lock stores package versions and composer.lock stores recipes"
            correct: false
        explanation: >-
          The two files are complementary, not interchangeable. composer.lock pins
          resolved package versions (Composer's job); symfony.lock pins which recipe
          versions were applied (Flex's job) so every teammate/CI reproduces the same
          config and Flex can detect/rollback recipe changes. Both must be committed.
          The common trap is thinking one supersedes the other or that they should be
          ignored.
        documentation: "https://symfony.com/doc/current/setup.html"
      - id: "ARCH-FLEX-06"
        type: "internals"
        difficulty: "medium"
        subchapter: "architecture/flex"
        concepts: ["composer-plugin", "composer-events", "compile-vs-runtime"]
        syllabus: "Symfony Architecture → Symfony Flex"
        question: "At which point in a project's lifecycle does Symfony Flex actually run?"
        answers:
          - value: "Only at Composer time — it subscribes to Composer events like post-install-cmd/post-update-cmd and package install/uninstall"
            correct: true
          - value: "On every HTTP request, as a high-priority kernel.request listener"
            correct: false
          - value: "At container compile time, as a Symfony compiler pass"
            correct: false
          - value: "At kernel.terminate, after the response is sent"
            correct: false
        explanation: >-
          Flex is a Composer plugin that hooks Composer's event system; when a package
          is installed/updated/removed it resolves aliases and applies (or reverses)
          the matching recipe's configurators. It writes files (config/, .env,
          bundles.php) but plays no part in the HTTP runtime, the DI compiler, or
          terminate — those read the files Flex produced.
        documentation: "https://github.com/symfony/flex"
      - id: "ARCH-FLEX-07"
        type: "trap"
        difficulty: "easy"
        subchapter: "architecture/flex"
        concepts: ["aliases", "recipes"]
        syllabus: "Symfony Architecture → Symfony Flex"
        question: "In Flex terminology, what is the difference between an alias and a recipe?"
        answers:
          - value: "An alias is a short name that maps to a real package; a recipe is the automation (configurators) applied when that package is installed"
            correct: true
          - value: "They are two words for the same lookup on the recipe server"
            correct: false
          - value: "An alias applies config files; a recipe only renames the package"
            correct: false
        explanation: >-
          `composer require orm` uses the alias `orm`, which resolves to the real
          package `doctrine/orm`; the alias only affects the name written to
          composer.json. The recipe is the separate automation (bundles, copy-from-recipe,
          env, container configurators described in manifest.json) that wires the
          package into your app. Aliases are convenience; recipes are the work.
        documentation: "https://symfony.com/doc/current/setup.html"

  - name: "Architecture — License & Trademark"
    questions:
      - id: "ARCH-LICENSE-01"
        type: "single"
        difficulty: "easy"
        subchapter: "architecture/license"
        concepts: ["mit", "license"]
        syllabus: "Symfony Architecture → License"
        question: "Under which license is Symfony released?"
        answers:
          - value: "MIT"
            correct: true
          - value: "GPLv3"
            correct: false
          - value: "Apache 2.0"
            correct: false
        explanation: >-
          Symfony components are released under the permissive, non-copyleft MIT
          license.
        documentation: "https://github.com/symfony/symfony/blob/8.0/LICENSE"
      - id: "ARCH-LICENSE-02"
        type: "single"
        difficulty: "easy"
        subchapter: "architecture/license"
        concepts: ["mit", "obligation", "attribution"]
        syllabus: "Symfony Architecture → License"
        question: "What is the core obligation of the MIT license?"
        answers:
          - value: "Retain the copyright and permission notice in copies"
            correct: true
          - value: "Publish all your source code"
            correct: false
          - value: "Pay a royalty per deployment"
            correct: false
        explanation: >-
          MIT only requires that the copyright and permission notice be kept in
          all copies or substantial portions; it is not copyleft.
        documentation: "https://opensource.org/license/mit"
      - id: "ARCH-LICENSE-03"
        type: "single"
        difficulty: "medium"
        subchapter: "architecture/license"
        concepts: ["trademark", "mit", "name-logo"]
        syllabus: "Symfony Architecture → License"
        question: "Does the MIT license grant rights to use the Symfony name and logo?"
        answers:
          - value: "No — those are governed by the separate trademark policy"
            correct: true
          - value: "Yes — the license covers name and logo"
            correct: false
          - value: "Only for non-commercial use"
            correct: false
        explanation: >-
          The code license (MIT) and the trademark (name/logo) are separate legal
          instruments. Using the Symfony name/logo follows Symfony SAS's trademark
          policy.
        documentation: "https://symfony.com/trademark"
      - id: "ARCH-LICENSE-04"
        type: "true-false"
        difficulty: "easy"
        subchapter: "architecture/license"
        concepts: ["mit", "copyleft", "closed-source"]
        syllabus: "Symfony Architecture → License"
        question: "True or false: because Symfony is MIT-licensed, you must open-source any application you build on it."
        answers:
          - value: "False"
            correct: true
          - value: "True"
            correct: false
        explanation: >-
          False. MIT is permissive, not copyleft (unlike the GPL). You may ship
          Symfony inside closed-source, proprietary products without releasing your
          own source; the only condition is retaining the copyright/permission notice.
        documentation: "https://opensource.org/license/mit"
      - id: "ARCH-LICENSE-05"
        type: "scenario"
        difficulty: "medium"
        subchapter: "architecture/license"
        concepts: ["trademark", "branding", "mit"]
        syllabus: "Symfony Architecture → License"
        question: "A startup ships a closed-source SaaS built on Symfony and wants to market it as \"SymfonyCloud\". Which part is a problem?"
        answers:
          - value: "The closed-source SaaS is fine under MIT, but naming it \"SymfonyCloud\" risks trademark infringement"
            correct: true
          - value: "Both are forbidden: MIT bans commercial use and the name is trademarked"
            correct: false
          - value: "Neither is a problem: MIT grants full rights to the Symfony name too"
            correct: false
        explanation: >-
          MIT permits commercial, closed-source use, so building the SaaS is fine.
          But the code license says nothing about names/logos: using \"Symfony\" in a
          product name is governed by Symfony SAS's trademark policy, so \"SymfonyCloud\"
          is the risky part. You may say \"built with Symfony\" but not brand as Symfony.
        documentation: "https://symfony.com/trademark"

  - name: "Architecture — Components"
    questions:
      - id: "ARCH-COMPONENTS-01"
        type: "single"
        difficulty: "easy"
        subchapter: "architecture/components"
        concepts: ["component", "library", "decoupling"]
        syllabus: "Symfony Architecture → Components"
        question: "What best describes a Symfony component?"
        answers:
          - value: "A standalone, reusable PHP library shipped as its own Composer package"
            correct: true
          - value: "A configuration file loaded by the kernel"
            correct: false
          - value: "A bundle that can only run inside the framework"
            correct: false
        explanation: >-
          Components are decoupled libraries, each independently versioned and
          usable without the full framework.
        documentation: "https://symfony.com/doc/current/components/index.html"
      - id: "ARCH-COMPONENTS-02"
        type: "single"
        difficulty: "medium"
        subchapter: "architecture/components"
        concepts: ["contracts", "interfaces", "decoupling"]
        syllabus: "Symfony Architecture → Components"
        question: "What do the symfony/*-contracts packages contain?"
        answers:
          - value: "Stable interfaces and traits to depend on"
            correct: true
          - value: "Compiled service containers"
            correct: false
          - value: "Twig templates"
            correct: false
        explanation: >-
          Contracts packages hold interface-only definitions so consumers can
          depend on a stable API decoupled from a concrete implementation.
        documentation: "https://github.com/symfony/contracts"
      - id: "ARCH-COMPONENTS-03"
        type: "true-false"
        difficulty: "easy"
        subchapter: "architecture/components"
        concepts: ["routing", "standalone", "decoupling"]
        syllabus: "Symfony Architecture → Components"
        question: "Can symfony/routing be used without FrameworkBundle?"
        answers:
          - value: "Yes — it is a standalone component"
            correct: true
          - value: "No — it requires the kernel"
            correct: false
          - value: "Only in the dev environment"
            correct: false
        explanation: >-
          Components are decoupled; Routing can be installed and used on its own
          via UrlMatcher/UrlGenerator without the framework.
        documentation: "https://symfony.com/doc/current/components/routing.html"
      - id: "ARCH-COMPONENTS-04"
        type: "trap"
        difficulty: "medium"
        subchapter: "architecture/components"
        concepts: ["component", "contract", "bridge", "bundle"]
        syllabus: "Symfony Architecture → Components"
        question: "Which mapping of term to definition is entirely correct?"
        answers:
          - value: "Contract = interfaces/traits; Component = standalone library; Bridge = glue to a third-party lib; Bundle = framework wiring"
            correct: true
          - value: "Contract = compiled container; Component = a bundle; Bridge = a config file; Bundle = a PSR"
            correct: false
          - value: "Component = interfaces only; Contract = implementation; Bundle = third-party glue; Bridge = framework config"
            correct: false
        explanation: >-
          The four layers are distinct: contracts (e.g. symfony/service-contracts) ship
          only interfaces/traits; components (e.g. symfony/routing) are standalone
          implementations; bridges (e.g. symfony/twig-bridge) glue a component to one
          specific third-party library; bundles (e.g. symfony/framework-bundle) wire
          things into the framework with services and config. Confusing bridge with
          bundle, or contract with component, is the classic exam trap.
        documentation: "https://symfony.com/doc/current/components/index.html"
      - id: "ARCH-COMPONENTS-05"
        type: "code"
        difficulty: "medium"
        subchapter: "architecture/components"
        concepts: ["routing", "standalone", "UrlMatcher"]
        syllabus: "Symfony Architecture → Components"
        question: "Using only the Routing component standalone, what does $matcher->match('/hello/sf') return for a route defined as new Route('/hello/{name}') named 'hello'?"
        answers:
          - value: "['_route' => 'hello', 'name' => 'sf']"
            correct: true
          - value: "A Response object with body 'sf'"
            correct: false
          - value: "true"
            correct: false
          - value: "Nothing — UrlMatcher needs the kernel to resolve routes"
            correct: false
        explanation: >-
          UrlMatcher::match() returns an array of the matched route's parameters,
          including the special _route key with the route name and any placeholder
          values. No framework or kernel is involved — the component works standalone
          with a RouteCollection and a RequestContext. It returns parameters, never a
          Response (that is the framework's job).
        documentation: "https://symfony.com/doc/current/components/routing.html"
      - id: "ARCH-COMPONENTS-06"
        type: "trap"
        difficulty: "medium"
        subchapter: "architecture/components"
        concepts: ["metapackage", "symfony/symfony", "dependencies"]
        syllabus: "Symfony Architecture → Components"
        question: "For a modern application, how should you depend on Symfony code?"
        answers:
          - value: "Require the individual packages you need (e.g. symfony/routing); the symfony/symfony metapackage is discouraged"
            correct: true
          - value: "Always require the symfony/symfony metapackage to get everything at once"
            correct: false
          - value: "Require symfony/framework-bundle only, which contains every component's source"
            correct: false
        explanation: >-
          You should require only the individual component/bundle packages you use so
          the dependency graph stays minimal and each package versions independently.
          The old symfony/symfony monolithic metapackage is discouraged. Type-hinting
          contracts/interfaces further decouples you from concrete implementations.
        documentation: "https://symfony.com/doc/current/components/index.html"

  - name: "Architecture — Bridges"
    questions:
      - id: "ARCH-BRIDGES-01"
        type: "single"
        difficulty: "easy"
        subchapter: "architecture/bridges"
        concepts: ["bridge", "integration", "third-party"]
        syllabus: "Symfony Architecture → Bridges"
        question: "What is a Symfony bridge?"
        answers:
          - value: "An integration layer between a component and a specific third-party library"
            correct: true
          - value: "A configuration file format"
            correct: false
          - value: "A replacement for the service container"
            correct: false
        explanation: >-
          A bridge holds the glue coupling a Symfony component to one specific
          external library, keeping the component itself dependency-free.
        documentation: "https://github.com/symfony/symfony/tree/8.0/src/Symfony/Bridge"
      - id: "ARCH-BRIDGES-02"
        type: "single"
        difficulty: "medium"
        subchapter: "architecture/bridges"
        concepts: ["bridge", "source-layout", "monorepo"]
        syllabus: "Symfony Architecture → Bridges"
        question: "Where do bridges live in the Symfony monorepo?"
        answers:
          - value: "src/Symfony/Bridge/"
            correct: true
          - value: "src/Symfony/Component/"
            correct: false
          - value: "src/Symfony/Bundle/"
            correct: false
        explanation: >-
          Bridges have their own top-level directory, distinct from Component and
          Bundle.
        documentation: "https://github.com/symfony/symfony/tree/8.0/src/Symfony"
      - id: "ARCH-BRIDGES-03"
        type: "single"
        difficulty: "medium"
        subchapter: "architecture/bridges"
        concepts: ["bridge", "bundle", "services"]
        syllabus: "Symfony Architecture → Bridges"
        question: "What typically activates a bridge inside a framework application?"
        answers:
          - value: "A bundle that registers the bridge's classes as services"
            correct: true
          - value: "The bridge auto-registers itself at runtime"
            correct: false
          - value: "A Twig template include"
            correct: false
        explanation: >-
          Bridges provide classes; a bundle wires them into the container and
          exposes configuration.
        documentation: "https://symfony.com/doc/current/bundles.html"
      - id: "ARCH-BRIDGES-04"
        type: "trap"
        difficulty: "medium"
        subchapter: "architecture/bridges"
        concepts: ["bridge", "bundle", "confusion"]
        syllabus: "Symfony Architecture → Bridges"
        question: "Which statement distinguishes a bridge from a bundle correctly?"
        answers:
          - value: "A bridge is a glue library (classes) coupling a component to one third-party lib; a bundle registers services and config in the framework"
            correct: true
          - value: "A bridge configures itself in the framework; a bundle only provides plain classes"
            correct: false
          - value: "They are the same thing under two names"
            correct: false
        explanation: >-
          A bridge is just a Composer library of adapter/glue classes that depends on
          a component plus one specific external library; it does not wire itself into
          any app. A bundle is the framework-integration layer that registers those
          classes as services and exposes configuration. Expecting a bridge to
          configure itself is the trap — that is a bundle's job.
        documentation: "https://github.com/symfony/symfony/tree/8.0/src/Symfony/Bridge"
      - id: "ARCH-BRIDGES-05"
        type: "internals"
        difficulty: "hard"
        subchapter: "architecture/bridges"
        concepts: ["bridge", "optional-dependency", "decoupling"]
        syllabus: "Symfony Architecture → Bridges"
        question: "Why is the external library an optional dependency of the component but a required dependency of the bridge?"
        answers:
          - value: "Keeping it optional on the component preserves the component's minimal, reusable dependency graph; the bridge exists precisely to depend on that library, so it requires it"
            correct: true
          - value: "Because Composer forbids components from having any required dependencies"
            correct: false
          - value: "Because the bridge is loaded at runtime while the component is loaded at compile time"
            correct: false
        explanation: >-
          A component must stay usable by everyone, so it must not hard-require any
          particular third-party library — that coupling is pushed into a separate
          bridge package. The bridge's whole reason to exist is to integrate that
          specific library, so it declares it as a required dependency. This keeps the
          component's graph minimal and the integration independently versioned.
        documentation: "https://github.com/symfony/symfony/tree/8.0/src/Symfony/Bridge"

  - name: "Architecture — Code Organization"
    questions:
      - id: "ARCH-CODEORG-01"
        type: "single"
        difficulty: "easy"
        subchapter: "architecture/code-organization"
        concepts: ["public", "web-root", "front-controller"]
        syllabus: "Symfony Architecture → Code Organization"
        question: "Which directory is the web root of a Symfony application?"
        answers:
          - value: "public/"
            correct: true
          - value: "src/"
            correct: false
          - value: "web/"
            correct: false
        explanation: >-
          public/ contains index.php and static assets and is the only
          web-accessible directory.
        documentation: "https://symfony.com/doc/current/configuration.html"
      - id: "ARCH-CODEORG-02"
        type: "single"
        difficulty: "easy"
        subchapter: "architecture/code-organization"
        concepts: ["bundles.php", "kernel", "registration"]
        syllabus: "Symfony Architecture → Code Organization"
        question: "Where are bundles enabled in a modern Symfony app?"
        answers:
          - value: "config/bundles.php"
            correct: true
          - value: "config/services.yaml"
            correct: false
          - value: "Manually in src/Kernel.php"
            correct: false
        explanation: >-
          config/bundles.php maps each bundle class to the environments where it
          is enabled; the kernel reads it via MicroKernelTrait.
        documentation: "https://symfony.com/doc/current/bundles.html"
      - id: "ARCH-CODEORG-03"
        type: "single"
        difficulty: "medium"
        subchapter: "architecture/code-organization"
        concepts: ["MicroKernelTrait", "kernel", "boilerplate"]
        syllabus: "Symfony Architecture → Code Organization"
        question: "What supplies registerBundles() and registerContainerConfiguration() in a skeleton Kernel?"
        answers:
          - value: "MicroKernelTrait"
            correct: true
          - value: "AbstractController"
            correct: false
          - value: "The FrameworkBundle extension"
            correct: false
        explanation: >-
          App\\Kernel uses MicroKernelTrait, which implements the boilerplate to
          load bundles from config/bundles.php and configuration from config/.
        documentation: "https://symfony.com/doc/current/configuration/micro_kernel_trait.html"
      - id: "ARCH-CODEORG-04"
        type: "config"
        difficulty: "medium"
        subchapter: "architecture/code-organization"
        concepts: ["bundles.php", "environments", "structure"]
        syllabus: "Symfony Architecture → Code Organization"
        question: "In config/bundles.php an entry reads `WebProfilerBundle::class => ['dev' => true, 'test' => true]`. What does this mean?"
        answers:
          - value: "The bundle is enabled only in the dev and test environments, not in prod"
            correct: true
          - value: "The bundle runs in all environments because at least one is true"
            correct: false
          - value: "The bundle is disabled everywhere until you add 'all' => true"
            correct: false
        explanation: >-
          config/bundles.php maps each bundle class to an array of environment => bool.
          The kernel enables the bundle only in the listed environments whose value is
          true. `['all' => true]` means every environment; `['dev' => true, 'test' => true]`
          means dev and test only (typical for debugging/profiling bundles).
        documentation: "https://symfony.com/doc/current/bundles.html"
      - id: "ARCH-CODEORG-05"
        type: "internals"
        difficulty: "medium"
        subchapter: "architecture/code-organization"
        concepts: ["MicroKernelTrait", "container", "compile-vs-runtime"]
        syllabus: "Symfony Architecture → Code Organization"
        question: "In prod, why is public/index.php fast and free of YAML parsing on the hot path?"
        answers:
          - value: "config/ is parsed at compile time into a dumped container in var/cache/<env>/; runtime only loads that compiled container"
            correct: true
          - value: "The kernel re-parses config/packages/*.yaml on every request but caches the result in APCu"
            correct: false
          - value: "index.php inlines all YAML as PHP arrays that are re-evaluated per request"
            correct: false
        explanation: >-
          Configuration is compiled once into a dumped PHP container under
          var/cache/<env>/. In prod the kernel simply loads that compiled container, so
          no YAML parsing happens per request — that is why the front controller stays
          tiny and the hot path is fast. In dev, ConfigCache checks freshness and
          rebuilds when source config changes.
        documentation: "https://symfony.com/doc/current/configuration/micro_kernel_trait.html"
      - id: "ARCH-CODEORG-06"
        type: "trap"
        difficulty: "medium"
        subchapter: "architecture/code-organization"
        concepts: ["getParent", "bundle-inheritance", "removed"]
        syllabus: "Symfony Architecture → Code Organization"
        question: "How does a modern (Symfony 8) bundle inherit and override another bundle's resources?"
        answers:
          - value: "It doesn't — bundle inheritance via getParent() was removed; you override each resource type individually"
            correct: true
          - value: "By implementing getParent() to return the parent bundle's name"
            correct: false
          - value: "By extending the parent bundle class and calling parent::build()"
            correct: false
        explanation: >-
          The getParent() bundle-inheritance mechanism was deprecated in 4.4 and
          removed in 5.0; it does not exist in Symfony 8. Modern apps override each
          resource type on its own (templates via templates/bundles/<Name>/, services
          via decoration/redefinition, config via config/packages/). Mentioning
          getParent() as a current mechanism is a planted trap.
        documentation: "https://symfony.com/doc/current/bundles/override.html"
      - id: "ARCH-CODEORG-07"
        type: "config"
        difficulty: "medium"
        subchapter: "architecture/code-organization"
        concepts: ["services.yaml", "autowire", "resource"]
        syllabus: "Symfony Architecture → Code Organization"
        question: "What does the default `App\\:` service definition with `resource: '../src/'` and `exclude: '../src/{Kernel.php}'` achieve?"
        answers:
          - value: "It auto-registers every class under src/ as a service (with autowire/autoconfigure defaults), excluding Kernel.php"
            correct: true
          - value: "It marks all src/ classes public so they can be fetched from the container"
            correct: false
          - value: "It imports src/ as a Composer autoload path at runtime"
            correct: false
        explanation: >-
          The resource glob discovers classes under src/ and registers each as a
          service whose id is its FQCN, inheriting the _defaults (autowire: true,
          autoconfigure: true). exclude keeps non-service classes (like Kernel.php,
          entities, DTOs) out. Unused private services are then pruned by the compiler.
          It does not make them public.
        documentation: "https://symfony.com/doc/current/service_container.html"

  - name: "Architecture — Request Handling (HttpKernel)"
    questions:
      - id: "ARCH-REQ-01"
        type: "internals"
        difficulty: "medium"
        subchapter: "architecture/request-handling"
        concepts: ["kernel-events", "order", "http-kernel"]
        syllabus: "Symfony Architecture → Request Handling"
        question: "For a controller that returns a Response, in what order do the kernel events fire?"
        answers:
          - value: "kernel.request -> kernel.controller -> kernel.controller_arguments -> kernel.response"
            correct: true
          - value: "kernel.request -> kernel.view -> kernel.controller -> kernel.response"
            correct: false
          - value: "kernel.controller -> kernel.request -> kernel.response -> kernel.terminate"
            correct: false
        explanation: >-
          kernel.view is skipped because a Response was returned; the remaining
          events follow the canonical order, then finish_request and terminate.
        documentation: "https://symfony.com/doc/current/components/http_kernel.html"
      - id: "ARCH-REQ-02"
        type: "single"
        difficulty: "medium"
        subchapter: "architecture/request-handling"
        concepts: ["kernel.view", "ViewEvent", "non-response"]
        syllabus: "Symfony Architecture → Request Handling"
        question: "When is kernel.view dispatched?"
        answers:
          - value: "Only when the controller returns a value that is not a Response"
            correct: true
          - value: "On every request"
            correct: false
          - value: "Only for sub-requests"
            correct: false
        explanation: >-
          If the controller returns a non-Response value, kernel.view listeners
          must convert it into a Response.
        documentation: "https://symfony.com/doc/current/reference/events.html#kernel-view"
      - id: "ARCH-REQ-03"
        type: "internals"
        difficulty: "medium"
        subchapter: "architecture/request-handling"
        concepts: ["kernel.terminate", "post-response", "main-request"]
        syllabus: "Symfony Architecture → Request Handling"
        question: "When is kernel.terminate dispatched?"
        answers:
          - value: "After the response has been sent to the client, for the main request"
            correct: true
          - value: "Before kernel.response"
            correct: false
          - value: "Once for every sub-request"
            correct: false
        explanation: >-
          terminate() runs after send() and is not called for sub-requests; it is
          ideal for slow post-response work.
        documentation: "https://symfony.com/doc/current/reference/events.html#kernel-terminate"
      - id: "ARCH-REQ-04"
        type: "scenario"
        difficulty: "medium"
        subchapter: "architecture/request-handling"
        concepts: ["kernel.request", "setResponse", "short-circuit"]
        syllabus: "Symfony Architecture → Request Handling"
        question: "A listener calls setResponse() on kernel.request. What happens next?"
        answers:
          - value: "The controller is skipped and flow continues at kernel.response"
            correct: true
          - value: "The controller still runs normally"
            correct: false
          - value: "A kernel.view event becomes mandatory"
            correct: false
        explanation: >-
          Setting a response on kernel.request short-circuits controller
          resolution; the response still passes through kernel.response.
        documentation: "https://symfony.com/doc/current/reference/events.html#kernel-request"
      - id: "ARCH-REQ-05"
        type: "internals"
        difficulty: "medium"
        subchapter: "architecture/request-handling"
        concepts: ["MAIN_REQUEST", "SUB_REQUEST", "constants"]
        syllabus: "Symfony Architecture → Request Handling"
        question: "What is the value of HttpKernelInterface::MAIN_REQUEST?"
        answers:
          - value: "1 (and SUB_REQUEST is 2)"
            correct: true
          - value: "0"
            correct: false
          - value: "It is still called MASTER_REQUEST"
            correct: false
        explanation: >-
          MAIN_REQUEST is 1 and SUB_REQUEST is 2; the old MASTER_REQUEST constant
          was removed.
        documentation: "https://symfony.com/doc/current/components/http_kernel.html"
      - id: "ARCH-REQ-06"
        type: "internals"
        difficulty: "hard"
        subchapter: "architecture/request-handling"
        concepts: ["kernel-events", "order", "eight-events"]
        syllabus: "Symfony Architecture → Request Handling"
        question: "What is the full firing order of the linear kernel events when a controller returns a non-Response value that a listener then converts?"
        answers:
          - value: "request → controller → controller_arguments → view → response → finish_request → (after send) terminate"
            correct: true
          - value: "request → controller_arguments → controller → response → view → terminate → finish_request"
            correct: false
          - value: "request → controller → view → controller_arguments → response → terminate"
            correct: false
          - value: "request → controller → response → view → finish_request → terminate"
            correct: false
        explanation: >-
          The canonical order is request, controller, controller_arguments, view (only
          when a non-Response is returned), response, finish_request; then after the
          response is sent, terminate. kernel.exception is the eighth KernelEvents
          constant but fires out of band, only on error. controller_arguments runs
          AFTER argument resolution, and view sits between the controller call and
          response.
        documentation: "https://symfony.com/doc/current/components/http_kernel.html"
      - id: "ARCH-REQ-07"
        type: "internals"
        difficulty: "medium"
        subchapter: "architecture/request-handling"
        concepts: ["ControllerResolver", "ArgumentResolver", "resolution"]
        syllabus: "Symfony Architecture → Request Handling"
        question: "What are the respective jobs of ControllerResolverInterface and ArgumentResolverInterface?"
        answers:
          - value: "ControllerResolver reads the _controller attribute and returns a callable; ArgumentResolver builds the ordered argument array via value resolvers"
            correct: true
          - value: "ControllerResolver builds the argument array; ArgumentResolver picks the route"
            correct: false
          - value: "Both resolve the route; the controller is chosen by the router directly"
            correct: false
        explanation: >-
          ControllerResolverInterface::getController(Request) reads the _controller
          request attribute (set by the router) and returns a PHP callable.
          ArgumentResolverInterface::getArguments() then runs a chain of
          ValueResolverInterface resolvers (request attributes, the Request object,
          #[MapRequestPayload], services, variadics, defaults) to build the ordered
          argument list passed to the controller.
        documentation: "https://symfony.com/doc/current/components/http_kernel.html"
      - id: "ARCH-REQ-08"
        type: "trap"
        difficulty: "hard"
        subchapter: "architecture/request-handling"
        concepts: ["kernel.controller_arguments", "resolution-order", "ControllerArgumentsEvent"]
        syllabus: "Symfony Architecture → Request Handling"
        question: "Relative to argument resolution, when does kernel.controller_arguments fire?"
        answers:
          - value: "After ArgumentResolver has built the argument array — listeners edit an already-resolved array via setArguments()"
            correct: true
          - value: "Before argument resolution, so listeners provide the raw values the resolver will use"
            correct: false
          - value: "During controller execution, once per argument"
            correct: false
        explanation: >-
          kernel.controller_arguments is dispatched AFTER
          ArgumentResolverInterface::getArguments() has produced the final ordered
          array; listeners receive a ControllerArgumentsEvent and may mutate the
          already-built array with setArguments(). Assuming it runs before resolution
          (to feed the resolver) is a common misconception.
        documentation: "https://symfony.com/doc/current/reference/events.html#kernel-controller-arguments"
      - id: "ARCH-REQ-09"
        type: "debug"
        difficulty: "medium"
        subchapter: "architecture/request-handling"
        concepts: ["null-return", "ViewEvent", "ControllerDoesNotReturnResponseException"]
        syllabus: "Symfony Architecture → Request Handling"
        question: "A controller does its work but has no return statement (returns null) and no kernel.view listener handles it. What happens?"
        answers:
          - value: "The kernel dispatches kernel.view; since no response is set, it throws ControllerDoesNotReturnResponseException"
            correct: true
          - value: "The kernel silently sends an empty 200 response"
            correct: false
          - value: "A fatal PHP TypeError is raised before any event fires"
            correct: false
        explanation: >-
          After the controller runs, handleRaw() checks whether the return value is a
          Response; if not, it dispatches kernel.view carrying the value. If no
          listener calls setResponse(), the kernel throws
          ControllerDoesNotReturnResponseException (a LogicException) with the familiar
          \"The controller must return a Response object but it returned null\" message.
          The fix is to return a real Response or register a view listener.
        documentation: "https://symfony.com/doc/current/components/http_kernel.html"
      - id: "ARCH-REQ-10"
        type: "internals"
        difficulty: "medium"
        subchapter: "architecture/request-handling"
        concepts: ["sub-requests", "RequestStack", "finish_request"]
        syllabus: "Symfony Architecture → Request Handling"
        question: "Which statement about sub-requests is correct?"
        answers:
          - value: "They run the same request→...→finish_request flow but never fire kernel.terminate; RequestStack push/pop restores parent state"
            correct: true
          - value: "They fire kernel.terminate once per sub-request, like the main request"
            correct: false
          - value: "They skip kernel.request and start directly at kernel.controller"
            correct: false
        explanation: >-
          A sub-request (HttpKernelInterface::SUB_REQUEST) runs the full linear flow
          from kernel.request through kernel.response and kernel.finish_request, but
          kernel.terminate fires only for the main request after send. handleRaw()
          pushes the sub-request onto the RequestStack before kernel.request and pops
          it after kernel.finish_request, restoring the parent request/locale.
        documentation: "https://symfony.com/doc/current/components/http_kernel.html"
      - id: "ARCH-REQ-11"
        type: "internals"
        difficulty: "hard"
        subchapter: "architecture/request-handling"
        concepts: ["handle", "handleRaw", "catch"]
        syllabus: "Symfony Architecture → Request Handling"
        question: "What is the signature of HttpKernelInterface::handle() and the role of its $catch argument?"
        answers:
          - value: "handle(Request $request, int $type = self::MAIN_REQUEST, bool $catch = true): Response — with $catch=true, exceptions are caught and turned into a response via kernel.exception; with $catch=false they propagate"
            correct: true
          - value: "handle(Request $request): void — it prints the response directly and $catch controls output buffering"
            correct: false
          - value: "handle(string $env, bool $debug): Response — $catch enables the profiler"
            correct: false
        explanation: >-
          The contract is handle(Request, int $type = MAIN_REQUEST, bool $catch = true): Response.
          handle() wraps the private handleRaw() in a try/catch when $catch is true, so
          an escaped exception is routed through handleThrowable()/kernel.exception into
          a Response. With $catch=false (common in sub-requests and tests) the exception
          simply propagates to the caller.
        documentation: "https://symfony.com/doc/current/components/http_kernel.html"
      - id: "ARCH-REQ-12"
        type: "code"
        difficulty: "medium"
        subchapter: "architecture/request-handling"
        concepts: ["AsEventListener", "ResponseEvent", "priority"]
        syllabus: "Symfony Architecture → Request Handling"
        question: "A listener is annotated #[AsEventListener(event: KernelEvents::RESPONSE, priority: -10)] and sets an X-Frame-Options header. When does it run?"
        answers:
          - value: "On every response passing through kernel.response, after listeners with higher priority (since -10 is below the default 0)"
            correct: true
          - value: "Only when the controller returns a non-Response value"
            correct: false
          - value: "Before the controller is called, during kernel.request"
            correct: false
        explanation: >-
          kernel.response fires for every response (whether from the controller, a view
          listener, or a short-circuit). Listeners run high priority first; priority -10
          is below the default 0, so this header listener runs relatively late. The
          #[AsEventListener] attribute is wired by RegisterListenersPass at compile time,
          replacing manual tagging.
        documentation: "https://symfony.com/doc/current/reference/events.html#kernel-response"

  - name: "Architecture — Exception Handling"
    questions:
      - id: "ARCH-EXC-01"
        type: "single"
        difficulty: "easy"
        subchapter: "architecture/exception-handling"
        concepts: ["kernel.exception", "ExceptionEvent"]
        syllabus: "Symfony Architecture → Exception Handling"
        question: "Which event is responsible for turning an exception into a response?"
        answers:
          - value: "kernel.exception"
            correct: true
          - value: "kernel.view"
            correct: false
          - value: "kernel.terminate"
            correct: false
        explanation: >-
          When an exception escapes handleRaw(), HttpKernel dispatches
          kernel.exception; listeners may set the response.
        documentation: "https://symfony.com/doc/current/reference/events.html#kernel-exception"
      - id: "ARCH-EXC-02"
        type: "single"
        difficulty: "medium"
        subchapter: "architecture/exception-handling"
        concepts: ["status-code", "HttpExceptionInterface", "500"]
        syllabus: "Symfony Architecture → Exception Handling"
        question: "What status code results from an uncaught plain \\LogicException?"
        answers:
          - value: "500"
            correct: true
          - value: "404"
            correct: false
          - value: "400"
            correct: false
        explanation: >-
          Only exceptions implementing HttpExceptionInterface carry a status; any
          other exception defaults to 500.
        documentation: "https://symfony.com/doc/current/controller/error_pages.html"
      - id: "ARCH-EXC-03"
        type: "internals"
        difficulty: "medium"
        subchapter: "architecture/exception-handling"
        concepts: ["ErrorListener", "priority", "-128"]
        syllabus: "Symfony Architecture → Exception Handling"
        question: "At what priority is the default ErrorListener registered on kernel.exception?"
        answers:
          - value: "-128, so custom listeners run first"
            correct: true
          - value: "1024, so it always runs first"
            correct: false
          - value: "0"
            correct: false
        explanation: >-
          ErrorListener runs at a low priority (-128) so your own exception
          listeners get the first chance to handle the throwable.
        documentation: "https://symfony.com/doc/current/reference/events.html#kernel-exception"
      - id: "ARCH-EXC-04"
        type: "config"
        difficulty: "medium"
        subchapter: "architecture/exception-handling"
        concepts: ["error-template", "TwigBundle", "override"]
        syllabus: "Symfony Architecture → Exception Handling"
        question: "Where do you override the default 404 error template?"
        answers:
          - value: "templates/bundles/TwigBundle/Exception/error404.html.twig"
            correct: true
          - value: "templates/error/404.twig"
            correct: false
          - value: "Directly in vendor/"
            correct: false
        explanation: >-
          TwigBundle resolves error templates from
          templates/bundles/TwigBundle/Exception/, falling back to error.html.twig.
        documentation: "https://symfony.com/doc/current/controller/error_pages.html"
      - id: "ARCH-EXC-05"
        type: "internals"
        difficulty: "hard"
        subchapter: "architecture/exception-handling"
        concepts: ["ErrorListener", "error-controller", "sub-request"]
        syllabus: "Symfony Architecture → Exception Handling"
        question: "What does the default ErrorListener actually do when it handles a kernel.exception?"
        answers:
          - value: "It logs the exception, forwards to the error controller as a sub-request, and sets the resulting Response on the event"
            correct: true
          - value: "It immediately calls exit() with the HTTP status code"
            correct: false
          - value: "It re-throws the exception so PHP's default handler renders it"
            correct: false
        explanation: >-
          ErrorListener (priority -128) logs the throwable, forwards to the
          error_controller (ErrorController) as a sub-request whose response carries
          the status/headers from HttpExceptionInterface, and sets that response on the
          ExceptionEvent. Because it runs last, any higher-priority listener that
          already set a response wins and ErrorListener does nothing.
        documentation: "https://github.com/symfony/symfony/blob/8.0/src/Symfony/Component/HttpKernel/EventListener/ErrorListener.php"
      - id: "ARCH-EXC-06"
        type: "trap"
        difficulty: "hard"
        subchapter: "architecture/exception-handling"
        concepts: ["AccessDeniedException", "AccessDeniedHttpException", "confusion"]
        syllabus: "Symfony Architecture → Exception Handling"
        question: "How do Security's AccessDeniedException and HttpKernel's AccessDeniedHttpException differ?"
        answers:
          - value: "AccessDeniedHttpException implements HttpExceptionInterface (→ 403 directly); AccessDeniedException is a Security exception the firewall translates to 403 or a redirect to login"
            correct: true
          - value: "They are aliases of the same class in different namespaces"
            correct: false
          - value: "AccessDeniedException already carries a 403 status code via HttpExceptionInterface"
            correct: false
        explanation: >-
          They are different classes. Symfony\\Component\\HttpKernel\\Exception\\AccessDeniedHttpException
          implements HttpExceptionInterface and yields a 403 through the normal error
          flow. Symfony\\Component\\Security\\Core\\Exception\\AccessDeniedException is a
          Security exception that does NOT implement HttpExceptionInterface; the
          firewall's exception listener catches it and turns it into a 403 (or a
          redirect to the login page for unauthenticated users).
        documentation: "https://symfony.com/doc/current/controller/error_pages.html"
      - id: "ARCH-EXC-07"
        type: "debug"
        difficulty: "hard"
        subchapter: "architecture/exception-handling"
        concepts: ["setResponse", "getThrowable", "null-response"]
        syllabus: "Symfony Architecture → Exception Handling"
        question: "A kernel.exception listener inspects getThrowable() and builds a JsonResponse, but the custom page never appears. What is the most likely bug?"
        answers:
          - value: "The listener forgot to call $event->setResponse() on its branch, so the event's response stays null and the default handler wins"
            correct: true
          - value: "The listener has priority -128, which is impossible to register"
            correct: false
          - value: "kernel.exception cannot produce JSON responses, only HTML"
            correct: false
        explanation: >-
          ExceptionEvent::getResponse() returns null until some listener calls
          setResponse(). Reading getThrowable() and constructing a response is not
          enough — you must actually set it on the event. If a branch forgets
          setResponse(), the response stays null, ErrorListener's default page (or a
          500) is used instead, and your custom page never shows.
        documentation: "https://symfony.com/doc/current/reference/events.html#kernel-exception"
      - id: "ARCH-EXC-08"
        type: "internals"
        difficulty: "medium"
        subchapter: "architecture/exception-handling"
        concepts: ["re-throw", "hasResponse", "catch"]
        syllabus: "Symfony Architecture → Exception Handling"
        question: "After kernel.exception is dispatched, what does the kernel do if no listener set a response?"
        answers:
          - value: "handleThrowable() sees hasResponse() is false and re-throws the original throwable (which surfaces as a 500 when catch is true)"
            correct: true
          - value: "It returns an empty Response with status 204"
            correct: false
          - value: "It automatically retries the controller once more"
            correct: false
        explanation: >-
          If ExceptionEvent has no response after dispatch, handleThrowable() re-throws
          the original exception. In practice ErrorListener (priority -128) fills the
          gap, so this null case only bites when you replace or disable it. With
          catch:true the re-thrown error becomes a 500 to the client.
        documentation: "https://github.com/symfony/symfony/blob/8.0/src/Symfony/Component/HttpKernel/HttpKernel.php"
      - id: "ARCH-EXC-09"
        type: "single"
        difficulty: "easy"
        subchapter: "architecture/exception-handling"
        concepts: ["HttpException", "status-codes", "mapping"]
        syllabus: "Symfony Architecture → Exception Handling"
        question: "Which built-in exception produces a 404 response?"
        answers:
          - value: "NotFoundHttpException"
            correct: true
          - value: "AccessDeniedHttpException"
            correct: false
          - value: "BadRequestHttpException"
            correct: false
        explanation: >-
          NotFoundHttpException maps to 404. AccessDeniedHttpException maps to 403 and
          BadRequestHttpException to 400. All implement HttpExceptionInterface, so their
          status code and headers flow through to the produced response; a generic
          HttpException takes any status code from its constructor.
        documentation: "https://symfony.com/doc/current/controller/error_pages.html"

  - name: "Architecture — Event Dispatcher & Kernel Events"
    questions:
      - id: "ARCH-EVENTS-01"
        type: "single"
        difficulty: "easy"
        subchapter: "architecture/events"
        concepts: ["priority", "ordering"]
        syllabus: "Symfony Architecture → Event Dispatcher"
        question: "What does a higher listener priority mean?"
        answers:
          - value: "It runs earlier"
            correct: true
          - value: "It runs later"
            correct: false
          - value: "It cannot be stopped"
            correct: false
        explanation: >-
          Listeners are sorted by priority in descending order, so higher
          priorities run first; the default priority is 0.
        documentation: "https://symfony.com/doc/current/components/event_dispatcher.html"
      - id: "ARCH-EVENTS-02"
        type: "internals"
        difficulty: "medium"
        subchapter: "architecture/events"
        concepts: ["dispatch", "psr-14", "signature"]
        syllabus: "Symfony Architecture → Event Dispatcher"
        question: "What is the dispatch() signature in Symfony 8 (PSR-14)?"
        answers:
          - value: "dispatch(object $event, ?string $eventName = null)"
            correct: true
          - value: "dispatch(string $eventName, Event $event)"
            correct: false
          - value: "dispatch(Event $event, string $eventName) with a required name"
            correct: false
        explanation: >-
          Symfony follows PSR-14: the event object comes first, the name is
          optional (defaults to the event's class name).
        documentation: "https://symfony.com/doc/current/components/event_dispatcher.html"
      - id: "ARCH-EVENTS-03"
        type: "single"
        difficulty: "medium"
        subchapter: "architecture/events"
        concepts: ["subscriber", "getSubscribedEvents", "interface"]
        syllabus: "Symfony Architecture → Event Dispatcher"
        question: "Which method must an event subscriber implement?"
        answers:
          - value: "public static function getSubscribedEvents(): array"
            correct: true
          - value: "public function subscribe(): array"
            correct: false
          - value: "It only needs the #[AsEventSubscriber] attribute"
            correct: false
        explanation: >-
          EventSubscriberInterface defines the static getSubscribedEvents()
          method returning event names mapped to handlers.
        documentation: "https://symfony.com/doc/current/event_dispatcher.html"
      - id: "ARCH-EVENTS-04"
        type: "single"
        difficulty: "medium"
        subchapter: "architecture/events"
        concepts: ["stopPropagation", "listeners"]
        syllabus: "Symfony Architecture → Event Dispatcher"
        question: "What does $event->stopPropagation() do?"
        answers:
          - value: "Prevents the remaining listeners of this event from running"
            correct: true
          - value: "Cancels the whole request"
            correct: false
          - value: "Removes the listener permanently"
            correct: false
        explanation: >-
          It sets a flag the dispatcher checks before each listener; only the
          current event's remaining listeners are skipped.
        documentation: "https://symfony.com/doc/current/components/event_dispatcher.html"
      - id: "ARCH-EVENTS-05"
        type: "internals"
        difficulty: "hard"
        subchapter: "architecture/events"
        concepts: ["sorting", "priority-desc", "memoisation"]
        syllabus: "Symfony Architecture → Event Dispatcher"
        question: "How does EventDispatcher store and order listeners internally?"
        answers:
          - value: "It keeps listeners[eventName][priority][] and sorts by priority descending on first dispatch, memoising the sorted list until a listener is added/removed"
            correct: true
          - value: "It sorts listeners alphabetically by class name on every dispatch"
            correct: false
          - value: "It runs listeners in random order to prevent coupling"
            correct: false
        explanation: >-
          Internally the dispatcher stores listeners keyed by event name then priority.
          On the first dispatch of an event it sorts by priority descending (higher
          first; equal priorities preserve registration order) and caches the result in
          a sorted[] map, invalidated only when listeners change. This memoisation keeps
          repeated dispatches cheap.
        documentation: "https://github.com/symfony/symfony/blob/8.0/src/Symfony/Component/EventDispatcher/EventDispatcher.php"
      - id: "ARCH-EVENTS-06"
        type: "internals"
        difficulty: "hard"
        subchapter: "architecture/events"
        concepts: ["RegisterListenersPass", "compile-time", "lazy"]
        syllabus: "Symfony Architecture → Event Dispatcher"
        question: "How are tagged listeners/subscribers and #[AsEventListener] attributes wired into the dispatcher?"
        answers:
          - value: "RegisterListenersPass wires them at container compile time, and listener services are instantiated lazily only when their event fires"
            correct: true
          - value: "The kernel calls addListener() for each on every kernel.request"
            correct: false
          - value: "They are registered at runtime the first time getSubscribedEvents() is called"
            correct: false
        explanation: >-
          The RegisterListenersPass compiler pass scans services tagged
          kernel.event_listener/kernel.event_subscriber and #[AsEventListener]
          attributes and wires them into the dispatcher at compile time. Listeners are
          registered lazily — the service is only constructed when its event actually
          fires — which keeps boot cheap. You rarely call addListener() at runtime.
        documentation: "https://symfony.com/doc/current/event_dispatcher.html"
      - id: "ARCH-EVENTS-07"
        type: "code"
        difficulty: "medium"
        subchapter: "architecture/events"
        concepts: ["getSubscribedEvents", "return-format", "priority"]
        syllabus: "Symfony Architecture → Event Dispatcher"
        question: "Which are valid return values from getSubscribedEvents() for a single event? (choose all that apply)"
        answers:
          - value: "[KernelEvents::RESPONSE => 'onResponse']"
            correct: true
          - value: "[KernelEvents::RESPONSE => ['onResponse', -10]]"
            correct: true
          - value: "[KernelEvents::RESPONSE => [['onFirst', 10], ['onSecond', -10]]]"
            correct: true
          - value: "['onResponse' => KernelEvents::RESPONSE]"
            correct: false
        explanation: >-
          getSubscribedEvents() maps event NAMES to handlers. The value may be a method
          name string, a [method, priority] pair, or a list of such pairs to register
          several handlers for the same event. Mapping method → event name (reversed) is
          wrong and a frequent mistake.
        documentation: "https://symfony.com/doc/current/event_dispatcher.html"
      - id: "ARCH-EVENTS-08"
        type: "trap"
        difficulty: "hard"
        subchapter: "architecture/events"
        concepts: ["dispatch", "return-value", "mutation"]
        syllabus: "Symfony Architecture → Event Dispatcher"
        question: "What does dispatch(object $event) return, and how do you read a listener's result?"
        answers:
          - value: "It always returns the same event object you passed in; results reach you only by listeners mutating that event (e.g. setResponse), never as a listener return value"
            correct: true
          - value: "It returns whatever the last listener returned"
            correct: false
          - value: "It returns null when no listener set a value"
            correct: false
        explanation: >-
          dispatch() returns the exact event object passed in — even with no listeners,
          or when all left it untouched. Listeners themselves return void; the only way
          data flows back is by mutating the event, which you then read from the
          returned object. Expecting dispatch() to hand back a listener's return value
          is the classic bug.
        documentation: "https://symfony.com/doc/current/components/event_dispatcher.html"
      - id: "ARCH-EVENTS-09"
        type: "internals"
        difficulty: "medium"
        subchapter: "architecture/events"
        concepts: ["default-priority", "registration-order", "ties"]
        syllabus: "Symfony Architecture → Event Dispatcher"
        question: "Two listeners for the same event both use the default priority. In what order do they run?"
        answers:
          - value: "In registration order — the default priority is 0 and equal priorities preserve the order they were added"
            correct: true
          - value: "In reverse registration order (last added runs first)"
            correct: false
          - value: "Alphabetically by service id"
            correct: false
        explanation: >-
          The default priority is 0. Listeners are sorted by priority descending, and
          ties (equal priority) keep their registration order. So two default-priority
          listeners run first-registered-first. To force an order, set explicit
          priorities rather than relying on registration order.
        documentation: "https://symfony.com/doc/current/components/event_dispatcher.html"
      - id: "ARCH-EVENTS-10"
        type: "single"
        difficulty: "easy"
        subchapter: "architecture/events"
        concepts: ["listener", "subscriber", "choice"]
        syllabus: "Symfony Architecture → Event Dispatcher"
        question: "What is the key difference between a listener and a subscriber?"
        answers:
          - value: "A listener is registered against one event; a subscriber declares all the events it handles in getSubscribedEvents()"
            correct: true
          - value: "A subscriber can only handle one event; a listener handles many"
            correct: false
          - value: "Listeners run at runtime while subscribers run at compile time"
            correct: false
        explanation: >-
          A listener is a callable attached to a single event name (via
          #[AsEventListener] or the kernel.event_listener tag). A subscriber implements
          EventSubscriberInterface and declares all its events (and priorities) in the
          static getSubscribedEvents() method — handy when one class handles several
          related events. Both are wired by RegisterListenersPass.
        documentation: "https://symfony.com/doc/current/event_dispatcher.html"

  - name: "Architecture — Official Best Practices"
    questions:
      - id: "ARCH-BP-01"
        type: "single"
        difficulty: "easy"
        subchapter: "architecture/best-practices"
        concepts: ["services", "thin-controllers", "business-logic"]
        syllabus: "Symfony Architecture → Official Best Practices"
        question: "Where should business logic live according to the best practices?"
        answers:
          - value: "In autowired services"
            correct: true
          - value: "In controllers"
            correct: false
          - value: "In Twig templates"
            correct: false
        explanation: >-
          Controllers should be thin and delegate to services, which keeps logic
          reusable and testable.
        documentation: "https://symfony.com/doc/current/best_practices.html"
      - id: "ARCH-BP-02"
        type: "single"
        difficulty: "medium"
        subchapter: "architecture/best-practices"
        concepts: ["service-visibility", "private", "optimisation"]
        syllabus: "Symfony Architecture → Official Best Practices"
        question: "What visibility should application services have by default?"
        answers:
          - value: "Private"
            correct: true
          - value: "Public"
            correct: false
          - value: "Protected"
            correct: false
        explanation: >-
          Private services let the DI compiler inline and remove them, and
          discourage the service-locator anti-pattern.
        documentation: "https://symfony.com/doc/current/service_container.html"
      - id: "ARCH-BP-03"
        type: "single"
        difficulty: "medium"
        subchapter: "architecture/best-practices"
        concepts: ["secrets", "vault", "configuration"]
        syllabus: "Symfony Architecture → Official Best Practices"
        question: "Where do sensitive credentials belong?"
        answers:
          - value: "The Secrets vault"
            correct: true
          - value: "config/services.yaml"
            correct: false
          - value: "Hard-coded parameters"
            correct: false
        explanation: >-
          Secrets should be stored in the encrypted Secrets vault, while
          infrastructure config uses env vars and behaviour uses parameters.
        documentation: "https://symfony.com/doc/current/configuration/secrets.html"
      - id: "ARCH-BP-04"
        type: "config"
        difficulty: "medium"
        subchapter: "architecture/best-practices"
        concepts: ["_defaults", "autowire", "autoconfigure"]
        syllabus: "Symfony Architecture → Official Best Practices"
        question: "What does this services.yaml _defaults block enable: autowire: true, autoconfigure: true, public: false?"
        answers:
          - value: "Constructor deps are injected by type, services are auto-tagged by the interfaces they implement, and services are private by default"
            correct: true
          - value: "All services become public singletons that can be fetched from the container"
            correct: false
          - value: "It disables the compiler so services are resolved at runtime"
            correct: false
        explanation: >-
          autowire resolves constructor arguments by type-hint; autoconfigure auto-tags
          services based on implemented interfaces/attributes (e.g. subscribers get
          kernel.event_subscriber); public: false keeps them private so the compiler can
          inline/prune them and you inject rather than fetch. This is the idiomatic
          Symfony 8 default.
        documentation: "https://symfony.com/doc/current/service_container.html"
      - id: "ARCH-BP-05"
        type: "scenario"
        difficulty: "medium"
        subchapter: "architecture/best-practices"
        concepts: ["env-vars", "parameters", "secrets"]
        syllabus: "Symfony Architecture → Official Best Practices"
        question: "Where should each belong: a database URL, a feature toggle, and a third-party API private key?"
        answers:
          - value: "Database URL → env var; feature toggle → parameter (or env var if it varies per env); API private key → Secrets vault"
            correct: true
          - value: "All three → hard-coded parameters in services.yaml"
            correct: false
          - value: "All three → the Secrets vault, committed to git"
            correct: false
        explanation: >-
          Infrastructure config that varies per environment (database URL) goes in env
          vars; application behaviour (feature toggle) goes in parameters, or an env var
          if it changes per environment; sensitive credentials (API private key) go in
          the encrypted Secrets vault — never committed as plain config.
        documentation: "https://symfony.com/doc/current/configuration/secrets.html"
      - id: "ARCH-BP-06"
        type: "trap"
        difficulty: "medium"
        subchapter: "architecture/best-practices"
        concepts: ["public-services", "optimisation", "anti-pattern"]
        syllabus: "Symfony Architecture → Official Best Practices"
        question: "Why is making application services public \"to be safe\" discouraged?"
        answers:
          - value: "Public services block the DI compiler from inlining/removing them and invite the service-locator anti-pattern; private + injected is preferred"
            correct: true
          - value: "Public services cannot be autowired at all"
            correct: false
          - value: "Public services are slower because they are re-instantiated on every request"
            correct: false
        explanation: >-
          Marking services public prevents the compiler from optimising them away or
          inlining them, and encourages fetching from the container (service location)
          instead of dependency injection. The best practice is private, autowired
          services injected via the constructor. Public visibility is only needed in a
          few edge cases (e.g. legacy get() calls).
        documentation: "https://symfony.com/doc/current/service_container.html"

  - name: "Architecture — Release Management"
    questions:
      - id: "ARCH-REL-01"
        type: "single"
        difficulty: "easy"
        subchapter: "architecture/release-management"
        concepts: ["cadence", "minor", "may-november"]
        syllabus: "Symfony Architecture → Release Management"
        question: "How often does a new Symfony minor version ship?"
        answers:
          - value: "Every six months, in May and November"
            correct: true
          - value: "Every month"
            correct: false
          - value: "Every two years"
            correct: false
        explanation: >-
          Symfony uses a fixed time-based cadence: a minor every May and November,
          a major every two years.
        documentation: "https://symfony.com/releases"
      - id: "ARCH-REL-02"
        type: "single"
        difficulty: "easy"
        subchapter: "architecture/release-management"
        concepts: ["lts", "8.4"]
        syllabus: "Symfony Architecture → Release Management"
        question: "Which Symfony 8.x version is the LTS?"
        answers:
          - value: "8.4"
            correct: true
          - value: "8.0"
            correct: false
          - value: "8.2"
            correct: false
        explanation: >-
          The last minor of each major (X.4) is the LTS; it ships alongside the
          next major (9.0).
        documentation: "https://symfony.com/doc/current/contributing/community/releases.html"
      - id: "ARCH-REL-03"
        type: "single"
        difficulty: "medium"
        subchapter: "architecture/release-management"
        concepts: ["minor", "bc", "semver"]
        syllabus: "Symfony Architecture → Release Management"
        question: "What may a MINOR release NOT do?"
        answers:
          - value: "Break backward compatibility"
            correct: true
          - value: "Add new features"
            correct: false
          - value: "Introduce deprecations"
            correct: false
        explanation: >-
          Minors add features and deprecations but never break BC; breaks are
          reserved for major releases.
        documentation: "https://symfony.com/doc/current/contributing/code/bc.html"
      - id: "ARCH-REL-04"
        type: "single"
        difficulty: "medium"
        subchapter: "architecture/release-management"
        concepts: ["maintenance", "standard", "lts"]
        syllabus: "Symfony Architecture → Release Management"
        question: "What are the maintenance windows for a standard (non-LTS) release?"
        answers:
          - value: "8 months of bug fixes and 14 months of security fixes"
            correct: true
          - value: "3 years of bug fixes and 4 years of security fixes"
            correct: false
          - value: "1 month of everything"
            correct: false
        explanation: >-
          Standard versions get 8 months bug fixes and 14 months security fixes;
          LTS versions get 3 years and 4 years respectively.
        documentation: "https://symfony.com/releases"
      - id: "ARCH-REL-05"
        type: "internals"
        difficulty: "hard"
        subchapter: "architecture/release-management"
        concepts: ["merge-up", "branches", "maintenance"]
        syllabus: "Symfony Architecture → Release Management"
        question: "How are bug fixes propagated across Symfony's maintained branches?"
        answers:
          - value: "Fixes are merged UP from the oldest maintained branch to newer ones, so a patch to 8.0 also lands in 8.1, 8.2, etc."
            correct: true
          - value: "Each branch is patched independently with no relationship between them"
            correct: false
          - value: "Fixes are merged DOWN from the newest branch into older ones"
            correct: false
        explanation: >-
          Symfony uses a merge-up model: a fix is committed to the lowest maintained
          branch that needs it and then merged upward into every newer branch. This
          keeps behaviour consistent across all maintained versions and avoids a fix
          being present in an old branch but missing in a newer one.
        documentation: "https://symfony.com/doc/current/contributing/community/releases.html"
      - id: "ARCH-REL-06"
        type: "trap"
        difficulty: "medium"
        subchapter: "architecture/release-management"
        concepts: ["patch", "minor", "semver"]
        syllabus: "Symfony Architecture → Release Management"
        question: "What is the difference between a PATCH and a MINOR release?"
        answers:
          - value: "A patch (8.0.1 → 8.0.2) contains bug fixes only; a minor (8.0 → 8.1) adds new features and deprecations but is still BC-safe"
            correct: true
          - value: "A patch can add small features; a minor is only for security fixes"
            correct: false
          - value: "Both may break BC as long as deprecations were added"
            correct: false
        explanation: >-
          Patch releases carry bug fixes only — no new features, no deprecations, no BC
          breaks. Minor releases add features and may introduce deprecations, but never
          break BC. Only majors break BC (by removing previously deprecated code).
          Confusing patch (bugs only) with minor (features) is a common trap.
        documentation: "https://symfony.com/doc/current/contributing/code/bc.html"
      - id: "ARCH-REL-07"
        type: "single"
        difficulty: "medium"
        subchapter: "architecture/release-management"
        concepts: ["major", "bc-break", "removals"]
        syllabus: "Symfony Architecture → Release Management"
        question: "What is a MAJOR release uniquely allowed to do?"
        answers:
          - value: "Remove deprecated code and break backward compatibility (only for APIs deprecated in the previous major line)"
            correct: true
          - value: "Add features without any deprecation path"
            correct: false
          - value: "Ship bug fixes only"
            correct: false
        explanation: >-
          A major (e.g. 8.x → 9.0) is the only release level permitted to break BC, and
          only for code that was deprecated during the previous major line. This is what
          lets you upgrade safely within a major and plan the jump across a major once
          you have cleared deprecations.
        documentation: "https://symfony.com/doc/current/contributing/code/bc.html"

  - name: "Architecture — Backward Compatibility Promise"
    questions:
      - id: "ARCH-BC-01"
        type: "single"
        difficulty: "medium"
        subchapter: "architecture/bc-promise"
        concepts: ["bc-break", "major", "deprecation"]
        syllabus: "Symfony Architecture → Backward Compatibility"
        question: "When may Symfony break backward compatibility?"
        answers:
          - value: "Only in a major release, and only after prior deprecation"
            correct: true
          - value: "In any minor release"
            correct: false
          - value: "In patch releases"
            correct: false
        explanation: >-
          BC breaks are reserved for majors and require the affected API to have
          been deprecated in the previous major line.
        documentation: "https://symfony.com/doc/current/contributing/code/bc.html"
      - id: "ARCH-BC-02"
        type: "single"
        difficulty: "medium"
        subchapter: "architecture/bc-promise"
        concepts: ["@internal", "coverage", "markers"]
        syllabus: "Symfony Architecture → Backward Compatibility"
        question: "What does the @internal marker mean for the BC promise?"
        answers:
          - value: "The element is excluded from the BC promise and may change at any time"
            correct: true
          - value: "The element is extra stable"
            correct: false
          - value: "The element is deprecated"
            correct: false
        explanation: >-
          @internal marks implementation details not covered by BC, even if they
          are PHP-public.
        documentation: "https://symfony.com/doc/current/contributing/code/bc.html"
      - id: "ARCH-BC-03"
        type: "single"
        difficulty: "medium"
        subchapter: "architecture/bc-promise"
        concepts: ["final", "decoration", "extension"]
        syllabus: "Symfony Architecture → Backward Compatibility"
        question: "How should you customise a final Symfony class in a BC-safe way?"
        answers:
          - value: "Decorate or compose it"
            correct: true
          - value: "Subclass and override it"
            correct: false
          - value: "Edit it in vendor/"
            correct: false
        explanation: >-
          final classes must not be subclassed; wrap them via decoration so
          Symfony can change internals without breaking you.
        documentation: "https://symfony.com/doc/current/service_container/service_decoration.html"
      - id: "ARCH-BC-04"
        type: "trap"
        difficulty: "medium"
        subchapter: "architecture/bc-promise"
        concepts: ["@experimental", "coverage", "markers"]
        syllabus: "Symfony Architecture → Backward Compatibility"
        question: "Is @experimental code covered by the BC promise?"
        answers:
          - value: "No — experimental features (often whole components in their first release) are explicitly excluded until marked stable"
            correct: true
          - value: "Yes — everything shipped in a stable Symfony release is covered"
            correct: false
          - value: "Only their public methods are covered, not their properties"
            correct: false
        explanation: >-
          @experimental features are excluded from the BC promise until they are
          stabilised; they may change in any release. Building critical paths on
          experimental code is risky. Along with @internal and final, @experimental is
          one of the markers that carve exceptions out of the promise.
        documentation: "https://symfony.com/doc/current/contributing/code/experimental.html"
      - id: "ARCH-BC-05"
        type: "internals"
        difficulty: "hard"
        subchapter: "architecture/bc-promise"
        concepts: ["interface", "using-vs-extending", "viewpoints"]
        syllabus: "Symfony Architecture → Backward Compatibility"
        question: "Symfony adds a new method to one of its own interfaces in a minor release. Is this a BC break?"
        answers:
          - value: "Not for code that only USES the interface, but it can break code that IMPLEMENTS it — so only implement interfaces Symfony marks as safe to implement"
            correct: true
          - value: "Yes, always — adding anything to an interface is forbidden between minors"
            correct: false
          - value: "No, never — interfaces are outside the BC promise entirely"
            correct: false
        explanation: >-
          The promise is written from two viewpoints. For USING code (calling methods,
          reading returns) adding a method is safe. For EXTENDING code (your class
          implementing that interface) a new method is a break, because your class no
          longer satisfies the contract. Symfony reserves the right to add methods to
          its interfaces, so you should only implement interfaces meant for
          implementation.
        documentation: "https://symfony.com/doc/current/contributing/code/bc.html"
      - id: "ARCH-BC-06"
        type: "multiple"
        difficulty: "medium"
        subchapter: "architecture/bc-promise"
        concepts: ["coverage", "@internal", "@experimental"]
        syllabus: "Symfony Architecture → Backward Compatibility"
        question: "Which of the following are covered by the BC promise? (choose all that apply)"
        answers:
          - value: "A public method with no special annotation"
            correct: true
          - value: "A public method marked @internal"
            correct: false
          - value: "A class marked @experimental"
            correct: false
          - value: "The stable public constructor of a non-final, non-internal class"
            correct: true
        explanation: >-
          Stable public API without @internal/@experimental is covered — regardless of
          being a method or constructor. @internal is excluded even though PHP-public,
          and @experimental is excluded until stabilised. The classic misconception is
          equating PHP `public` with \"covered\"; @internal overrides that.
        documentation: "https://symfony.com/doc/current/contributing/code/bc.html"
      - id: "ARCH-BC-07"
        type: "true-false"
        difficulty: "easy"
        subchapter: "architecture/bc-promise"
        concepts: ["@internal", "public", "coverage"]
        syllabus: "Symfony Architecture → Backward Compatibility"
        question: "True or false: a method declared public in PHP but annotated @internal is protected by the BC promise."
        answers:
          - value: "False"
            correct: true
          - value: "True"
            correct: false
        explanation: >-
          False. @internal explicitly removes an element from the BC promise even when
          it is PHP-public. Such methods/classes can change or disappear in any release,
          so you must not depend on them. PHP visibility and BC coverage are independent.
        documentation: "https://symfony.com/doc/current/contributing/code/bc.html"

  - name: "Architecture — Deprecations"
    questions:
      - id: "ARCH-DEP-01"
        type: "internals"
        difficulty: "medium"
        subchapter: "architecture/deprecations"
        concepts: ["trigger_deprecation", "deprecation-contracts"]
        syllabus: "Symfony Architecture → Deprecations"
        question: "Which function emits a Symfony deprecation notice, and from which package?"
        answers:
          - value: "trigger_deprecation() from symfony/deprecation-contracts"
            correct: true
          - value: "deprecate() from symfony/http-kernel"
            correct: false
          - value: "There is no helper; you must call trigger_error() directly"
            correct: false
        explanation: >-
          symfony/deprecation-contracts provides trigger_deprecation($package,
          $version, $message, ...$args), which formats an E_USER_DEPRECATED notice.
        documentation: "https://github.com/symfony/deprecation-contracts"
      - id: "ARCH-DEP-02"
        type: "single"
        difficulty: "easy"
        subchapter: "architecture/deprecations"
        concepts: ["removal", "next-major", "bc"]
        syllabus: "Symfony Architecture → Deprecations"
        question: "When is deprecated code actually removed?"
        answers:
          - value: "In the next major release"
            correct: true
          - value: "In the next patch release"
            correct: false
          - value: "Immediately"
            correct: false
        explanation: >-
          Deprecations survive the whole major line and are only removed in the
          next major, per the BC promise.
        documentation: "https://symfony.com/doc/current/contributing/code/bc.html"
      - id: "ARCH-DEP-03"
        type: "internals"
        difficulty: "medium"
        subchapter: "architecture/deprecations"
        concepts: ["phpunit-bridge", "SYMFONY_DEPRECATIONS_HELPER", "ci"]
        syllabus: "Symfony Architecture → Deprecations"
        question: "Which tool lets you fail the test suite when new deprecations appear?"
        answers:
          - value: "symfony/phpunit-bridge configured via SYMFONY_DEPRECATIONS_HELPER"
            correct: true
          - value: "symfony/console"
            correct: false
          - value: "symfony/flex"
            correct: false
        explanation: >-
          The PHPUnit bridge collects deprecations; SYMFONY_DEPRECATIONS_HELPER
          (e.g. max[total]=0) can make the suite fail on any deprecation.
        documentation: "https://symfony.com/doc/current/components/phpunit_bridge.html"
      - id: "ARCH-DEP-04"
        type: "internals"
        difficulty: "medium"
        subchapter: "architecture/deprecations"
        concepts: ["trigger_deprecation", "signature", "argument-order"]
        syllabus: "Symfony Architecture → Deprecations"
        question: "What is the argument order of trigger_deprecation()?"
        answers:
          - value: "package, version, message, ...args"
            correct: true
          - value: "message, package, version"
            correct: false
          - value: "version, package, message"
            correct: false
        explanation: >-
          The signature is trigger_deprecation(string $package, string $version,
          string $message, mixed ...$args) with sprintf-style formatting.
        documentation: "https://github.com/symfony/deprecation-contracts"
      - id: "ARCH-DEP-05"
        type: "code"
        difficulty: "medium"
        subchapter: "architecture/deprecations"
        concepts: ["trigger_deprecation", "usage", "sprintf"]
        syllabus: "Symfony Architecture → Deprecations"
        question: "Which call correctly deprecates ReportBuilder::generate() (deprecated in your app version 8.1)?"
        answers:
          - value: "trigger_deprecation('app/reports', '8.1', 'Using \"%s::generate()\" is deprecated, use \"build()\".', self::class);"
            correct: true
          - value: "trigger_deprecation('Using generate() is deprecated', 'app/reports', '8.1');"
            correct: false
          - value: "trigger_error('app/reports', '8.1', 'generate() is deprecated');"
            correct: false
        explanation: >-
          The signature is (package, version, message, ...args) with sprintf-style
          formatting for the message. The first option passes the package, the version
          it was deprecated IN, a message with a %s placeholder, and self::class as the
          arg. Putting the message first, or misusing trigger_error with these
          arguments, is wrong.
        documentation: "https://github.com/symfony/deprecation-contracts"
      - id: "ARCH-DEP-06"
        type: "config"
        difficulty: "medium"
        subchapter: "architecture/deprecations"
        concepts: ["deprecated-service", "DI", "setDeprecated"]
        syllabus: "Symfony Architecture → Deprecations"
        question: "How do you mark a service as deprecated in config/services.yaml?"
        answers:
          - value: "Add a `deprecated:` key with package, version and message under the service definition"
            correct: true
          - value: "Set `public: deprecated` on the service"
            correct: false
          - value: "Prefix the service id with an underscore"
            correct: false
        explanation: >-
          A service is deprecated via the `deprecated:` key (package/version/message),
          which maps to Definition::setDeprecated() and triggers a deprecation when the
          service is referenced. Container-level deprecations like this surface during
          cache:clear/compile time, whereas method-call deprecations fire at runtime.
        documentation: "https://symfony.com/doc/current/components/dependency_injection.html"
      - id: "ARCH-DEP-07"
        type: "trap"
        difficulty: "medium"
        subchapter: "architecture/deprecations"
        concepts: ["E_USER_DEPRECATED", "notices", "not-exceptions"]
        syllabus: "Symfony Architecture → Deprecations"
        question: "At what error level are Symfony deprecations emitted, and do they throw?"
        answers:
          - value: "They are E_USER_DEPRECATED notices — they do not throw unless your test suite/CI is configured to fail on them"
            correct: true
          - value: "They throw a DeprecationException that halts execution immediately"
            correct: false
          - value: "They are E_USER_ERROR, so the request always dies with a fatal error"
            correct: false
        explanation: >-
          trigger_deprecation() ultimately calls @trigger_error(..., E_USER_DEPRECATED),
          producing a notice that is logged/collected but does not interrupt execution.
          Only when tooling (e.g. the PHPUnit bridge via SYMFONY_DEPRECATIONS_HELPER) is
          configured to fail on deprecations does a deprecation cause a failure.
        documentation: "https://github.com/symfony/deprecation-contracts"
      - id: "ARCH-DEP-08"
        type: "trap"
        difficulty: "hard"
        subchapter: "architecture/deprecations"
        concepts: ["version", "deprecated-in", "common-mistake"]
        syllabus: "Symfony Architecture → Deprecations"
        question: "Which version string should you pass as the second argument of trigger_deprecation()?"
        answers:
          - value: "The version in which the API was DEPRECATED (e.g. '8.1'), not the current running version"
            correct: true
          - value: "The current installed version at the time the notice fires"
            correct: false
          - value: "The version in which the code will be REMOVED (the next major)"
            correct: false
        explanation: >-
          The version argument records when the deprecation was introduced, producing
          the \"Since <package> <version>: <message>\" format tooling parses. A common
          mistake is passing the current version, or the removal version — both are
          wrong. Use the version the API was deprecated in.
        documentation: "https://github.com/symfony/deprecation-contracts"

  - name: "Architecture — Framework Overloading"
    questions:
      - id: "ARCH-OVL-01"
        type: "config"
        difficulty: "medium"
        subchapter: "architecture/overloading"
        concepts: ["template-override", "twig", "path"]
        syllabus: "Symfony Architecture → Framework Overloading"
        question: "Where do you place a template that overrides a bundle template?"
        answers:
          - value: "templates/bundles/<BundleName>/path.html.twig"
            correct: true
          - value: "templates/override/path.html.twig"
            correct: false
          - value: "Inside vendor/"
            correct: false
        explanation: >-
          Twig resolves overrides from templates/bundles/<BundleName>/, which
          takes precedence over the bundle's own templates.
        documentation: "https://symfony.com/doc/current/bundles/override.html"
      - id: "ARCH-OVL-02"
        type: "single"
        difficulty: "medium"
        subchapter: "architecture/overloading"
        concepts: ["per-resource", "override", "getParent"]
        syllabus: "Symfony Architecture → Framework Overloading"
        question: "What is the current mechanism to override an inherited bundle resource?"
        answers:
          - value: "Per-resource overriding of templates, services, translations and config"
            correct: true
          - value: "getParent() bundle inheritance"
            correct: false
          - value: "Editing the bundle in vendor/"
            correct: false
        explanation: >-
          Bundle inheritance via getParent() was deprecated in 4.4 and removed in
          5.0; modern Symfony overrides each resource type individually.
        documentation: "https://symfony.com/doc/current/bundles/override.html"
      - id: "ARCH-OVL-03"
        type: "single"
        difficulty: "medium"
        subchapter: "architecture/overloading"
        concepts: ["decoration", "AsDecorator", "augment"]
        syllabus: "Symfony Architecture → Framework Overloading"
        question: "How do you augment a bundle service without replacing it?"
        answers:
          - value: "Decorate it with #[AsDecorator] / the decorates: key"
            correct: true
          - value: "Make it public and fetch it"
            correct: false
          - value: "Use getParent()"
            correct: false
        explanation: >-
          Decoration wraps the original service (injected as .inner), letting you
          add behaviour and delegate.
        documentation: "https://symfony.com/doc/current/service_container/service_decoration.html"
      - id: "ARCH-OVL-04"
        type: "config"
        difficulty: "hard"
        subchapter: "architecture/overloading"
        concepts: ["AsDecorator", "AutowireDecorated", "inner"]
        syllabus: "Symfony Architecture → Framework Overloading"
        question: "When you decorate a service with #[AsDecorator(decorates: 'acme.mailer')], how do you access the original?"
        answers:
          - value: "Inject the renamed original (the .inner service) via #[AutowireDecorated] and delegate to it"
            correct: true
          - value: "Instantiate a new copy of the original class with `new`"
            correct: false
          - value: "Fetch it from the container by making acme.mailer public"
            correct: false
        explanation: >-
          Decoration renames the original service to a .inner id and injects it into
          the decorator. The #[AutowireDecorated] attribute (or the special .inner
          reference in YAML) gives you that original instance so you can add behaviour
          and delegate. Re-creating it with `new` or fetching it publicly defeats the
          decoration pattern.
        documentation: "https://symfony.com/doc/current/service_container/service_decoration.html"
      - id: "ARCH-OVL-05"
        type: "trap"
        difficulty: "medium"
        subchapter: "architecture/overloading"
        concepts: ["translations", "priority", "override"]
        syllabus: "Symfony Architecture → Framework Overloading"
        question: "A bundle ships translations/messages.en.yaml and your app defines the same domain/locale in translations/. Whose strings win?"
        answers:
          - value: "The application's translations/ take priority over the bundle's translations"
            correct: true
          - value: "The bundle's translations always win because they load first"
            correct: false
          - value: "They merge alphabetically and the last key alphabetically wins"
            correct: false
        explanation: >-
          The application's translations/ directory has higher priority than any
          bundle's translations. Providing a catalogue with the same domain and locale
          overrides the bundle's strings — the same convention-based precedence used for
          template overrides.
        documentation: "https://symfony.com/doc/current/translation.html"
      - id: "ARCH-OVL-06"
        type: "internals"
        difficulty: "medium"
        subchapter: "architecture/overloading"
        concepts: ["getParent", "removed", "5.0"]
        syllabus: "Symfony Architecture → Framework Overloading"
        question: "What happened to bundle inheritance (getParent()) and the legacy Resources/ folder?"
        answers:
          - value: "getParent() inheritance was deprecated in 4.4 and removed in 5.0; modern bundles use top-level config/, templates/, translations/ instead of Resources/"
            correct: true
          - value: "getParent() is still the recommended way to override bundle resources in Symfony 8"
            correct: false
          - value: "Resources/ is now mandatory and getParent() was reinstated in 8.0"
            correct: false
        explanation: >-
          Bundle inheritance via getParent() is gone (deprecated 4.4, removed 5.0) and
          must not be presented as current. Modern bundles also drop the legacy
          Resources/ layout in favour of top-level config/, templates/ and
          translations/. Overriding is done per resource type instead.
        documentation: "https://symfony.com/doc/current/bundles/override.html"

  - name: "Architecture — Roadmap & Schedule"
    questions:
      - id: "ARCH-ROAD-01"
        type: "single"
        difficulty: "easy"
        subchapter: "architecture/roadmap-schedule"
        concepts: ["minor", "may-november", "cadence"]
        syllabus: "Symfony Architecture → Roadmap & Schedule"
        question: "In which months do Symfony minor releases ship?"
        answers:
          - value: "May and November"
            correct: true
          - value: "January and July"
            correct: false
          - value: "March and September"
            correct: false
        explanation: >-
          The cadence is fixed: a new minor every May and every November.
        documentation: "https://symfony.com/releases"
      - id: "ARCH-ROAD-02"
        type: "single"
        difficulty: "medium"
        subchapter: "architecture/roadmap-schedule"
        concepts: ["lts", "8.4", "9.0"]
        syllabus: "Symfony Architecture → Roadmap & Schedule"
        question: "When does 8.4 (LTS) release relative to 9.0?"
        answers:
          - value: "At the same time (both November 2027)"
            correct: true
          - value: "One year before 9.0"
            correct: false
          - value: "After 9.0"
            correct: false
        explanation: >-
          The LTS (X.4) always ships together with the next major (X+1).0.
        documentation: "https://symfony.com/doc/current/contributing/community/releases.html"
      - id: "ARCH-ROAD-03"
        type: "single"
        difficulty: "easy"
        subchapter: "architecture/roadmap-schedule"
        concepts: ["major", "cadence", "two-years"]
        syllabus: "Symfony Architecture → Roadmap & Schedule"
        question: "How often is a new major (and its LTS) released?"
        answers:
          - value: "Every two years"
            correct: true
          - value: "Every six months"
            correct: false
          - value: "Every year"
            correct: false
        explanation: >-
          Majors, and the accompanying LTS, come every two years.
        documentation: "https://symfony.com/releases"
      - id: "ARCH-ROAD-04"
        type: "single"
        difficulty: "medium"
        subchapter: "architecture/roadmap-schedule"
        concepts: ["timeline", "8.x", "dates"]
        syllabus: "Symfony Architecture → Roadmap & Schedule"
        question: "Which sequence correctly lists the Symfony 8.x release dates?"
        answers:
          - value: "8.0 Nov 2025, 8.1 May 2026, 8.2 Nov 2026, 8.3 May 2027, 8.4 LTS Nov 2027"
            correct: true
          - value: "8.0 Jan 2025, 8.1 Jul 2025, 8.2 Jan 2026, 8.3 Jul 2026, 8.4 Jan 2027"
            correct: false
          - value: "8.0 Nov 2025, 8.1 Nov 2026, 8.2 Nov 2027, 8.3 Nov 2028, 8.4 Nov 2029"
            correct: false
        explanation: >-
          8.0 opened the cycle in Nov 2025; a minor lands every six months (May/Nov):
          8.1 May 2026, 8.2 Nov 2026, 8.3 May 2027, and 8.4 (LTS) Nov 2027 alongside
          9.0. The pattern repeats for every major: X.0 opens, four minors follow, X.4
          is the LTS shipping with (X+1).0.
        documentation: "https://symfony.com/releases"
      - id: "ARCH-ROAD-05"
        type: "trap"
        difficulty: "medium"
        subchapter: "architecture/roadmap-schedule"
        concepts: ["lts", "timing", "misconception"]
        syllabus: "Symfony Architecture → Roadmap & Schedule"
        question: "Which statement about the LTS timing is correct?"
        answers:
          - value: "The LTS (X.4) ships at the same time as the next major (X+1).0, not before it"
            correct: true
          - value: "The LTS ships one year before the next major so people can migrate"
            correct: false
          - value: "8.0 is the long-term support release of the 8.x line"
            correct: false
        explanation: >-
          A frequent misconception is that the LTS precedes the next major. In fact X.4
          (the LTS) and (X+1).0 release together (8.4 and 9.0 both Nov 2027). Another
          trap: 8.0 is a standard release, not the LTS — 8.4 is.
        documentation: "https://symfony.com/doc/current/contributing/community/releases.html"
      - id: "ARCH-ROAD-06"
        type: "scenario"
        difficulty: "medium"
        subchapter: "architecture/roadmap-schedule"
        concepts: ["lts", "support-window", "planning"]
        syllabus: "Symfony Architecture → Roadmap & Schedule"
        question: "A product must run 3+ years without a major upgrade. Which 8.x version should you target and why?"
        answers:
          - value: "8.4 (LTS) — it provides 3 years of bug fixes and 4 years of security fixes, the longest support window in 8.x"
            correct: true
          - value: "8.0 — being the first release it is supported the longest"
            correct: false
          - value: "8.2 — mid-cycle releases get extended support"
            correct: false
        explanation: >-
          Only the LTS (X.4) offers the long maintenance windows (3 years bug fixes, 4
          years security fixes). Standard minors get 8 months bug + 14 months security,
          far short of 3 years. So a long-lived product should pin to 8.4 and plan the
          jump to the next major deliberately.
        documentation: "https://symfony.com/releases"

  - name: "Architecture — Interoperability & PSRs"
    questions:
      - id: "ARCH-PSR-01"
        type: "single"
        difficulty: "easy"
        subchapter: "architecture/psr"
        concepts: ["psr-14", "event-dispatcher"]
        syllabus: "Symfony Architecture → Interoperability & PSRs"
        question: "Which PSR does Symfony's EventDispatcher implement?"
        answers:
          - value: "PSR-14 (Event Dispatcher)"
            correct: true
          - value: "PSR-7 (HTTP Message)"
            correct: false
          - value: "PSR-3 (Logger)"
            correct: false
        explanation: >-
          Symfony's EventDispatcherInterface extends the PSR-14
          Psr\\EventDispatcher\\EventDispatcherInterface.
        documentation: "https://symfony.com/doc/current/components/event_dispatcher.html"
      - id: "ARCH-PSR-02"
        type: "single"
        difficulty: "medium"
        subchapter: "architecture/psr"
        concepts: ["psr-7", "http-foundation", "bridge"]
        syllabus: "Symfony Architecture → Interoperability & PSRs"
        question: "Is HttpFoundation's Request a PSR-7 message?"
        answers:
          - value: "No — a psr-http-message bridge converts between them"
            correct: true
          - value: "Yes, natively"
            correct: false
          - value: "Only in the prod environment"
            correct: false
        explanation: >-
          HttpFoundation predates and differs from PSR-7; the psr-http-message
          bridge converts between HttpFoundation and PSR-7/15/17.
        documentation: "https://symfony.com/doc/current/components/psr7.html"
      - id: "ARCH-PSR-03"
        type: "single"
        difficulty: "easy"
        subchapter: "architecture/psr"
        concepts: ["psr-11", "container"]
        syllabus: "Symfony Architecture → Interoperability & PSRs"
        question: "Which PSR interface does Symfony's service container implement?"
        answers:
          - value: "PSR-11 (Container)"
            correct: true
          - value: "PSR-6 (Cache)"
            correct: false
          - value: "PSR-16 (Simple Cache)"
            correct: false
        explanation: >-
          Symfony's ContainerInterface extends
          Psr\\Container\\ContainerInterface (PSR-11).
        documentation: "https://symfony.com/doc/current/service_container.html"
      - id: "ARCH-PSR-04"
        type: "internals"
        difficulty: "medium"
        subchapter: "architecture/psr"
        concepts: ["psr-3", "logger", "consume"]
        syllabus: "Symfony Architecture → Interoperability & PSRs"
        question: "Which PSR does Symfony primarily consume (rather than implement) so you can inject any implementation?"
        answers:
          - value: "PSR-3 (Logger) via Psr\\Log\\LoggerInterface"
            correct: true
          - value: "PSR-11 (Container)"
            correct: false
          - value: "PSR-20 (Clock)"
            correct: false
        explanation: >-
          Components type-hint Psr\\Log\\LoggerInterface (PSR-3), so any compliant
          logger can be injected. PSR-11, PSR-14, PSR-6 and PSR-20 are implemented
          by Symfony.
        documentation: "https://www.php-fig.org/psr/"
      - id: "ARCH-PSR-05"
        type: "multiple"
        difficulty: "hard"
        subchapter: "architecture/psr"
        concepts: ["implements", "psr-map", "components"]
        syllabus: "Symfony Architecture → Interoperability & PSRs"
        question: "Which PSRs does Symfony IMPLEMENT (i.e. Symfony objects ARE valid PSR objects)? (choose all that apply)"
        answers:
          - value: "PSR-6 (Cache pool)"
            correct: true
          - value: "PSR-11 (Container)"
            correct: true
          - value: "PSR-14 (Event Dispatcher)"
            correct: true
          - value: "PSR-20 (Clock)"
            correct: true
          - value: "PSR-3 (Logger)"
            correct: false
        explanation: >-
          Symfony implements PSR-6 (Cache pool), PSR-11 (Container), PSR-14
          (EventDispatcher), PSR-16 (Simple Cache adapter) and PSR-20 (Clock) — its
          objects can be handed to any library expecting those interfaces. PSR-3
          (Logger) is CONSUMED: Symfony type-hints LoggerInterface so you inject any
          implementation, but it does not ship the logger itself.
        documentation: "https://www.php-fig.org/psr/"
      - id: "ARCH-PSR-06"
        type: "trap"
        difficulty: "medium"
        subchapter: "architecture/psr"
        concepts: ["psr-6", "psr-16", "cache"]
        syllabus: "Symfony Architecture → Interoperability & PSRs"
        question: "What is the difference between PSR-6 and PSR-16 in Symfony's Cache?"
        answers:
          - value: "PSR-6 is the pool/CacheItem model (CacheItemPoolInterface); PSR-16 is the simpler get/set SimpleCache API (Psr16Cache adapter)"
            correct: true
          - value: "PSR-6 is for HTTP caching and PSR-16 is for the container"
            correct: false
          - value: "They are the same interface at different versions"
            correct: false
        explanation: >-
          PSR-6 models caching as a pool of CacheItem objects
          (CacheItemPoolInterface::getItem()/save()); PSR-16 (Simple Cache) is a
          lighter get()/set()/delete() API, exposed by Symfony's Psr16Cache adapter.
          Confusing the pool/item model (PSR-6) with the simple key/value API (PSR-16)
          is a common trap.
        documentation: "https://symfony.com/doc/current/components/cache.html"
      - id: "ARCH-PSR-07"
        type: "single"
        difficulty: "medium"
        subchapter: "architecture/psr"
        concepts: ["psr-20", "clock", "testable-time"]
        syllabus: "Symfony Architecture → Interoperability & PSRs"
        question: "Which PSR does Symfony's Clock component implement, and why inject its interface?"
        answers:
          - value: "PSR-20 via Psr\\Clock\\ClockInterface — injecting it makes time testable instead of calling new \\DateTime() directly"
            correct: true
          - value: "PSR-7 — the clock produces HTTP timestamps"
            correct: false
          - value: "PSR-11 — the clock is fetched from the container by id"
            correct: false
        explanation: >-
          Symfony\\Component\\Clock\\Clock implements Psr\\Clock\\ClockInterface (PSR-20).
          Type-hinting ClockInterface lets you inject a MockClock in tests and control
          time deterministically, instead of hard-coding new \\DateTime()/now() calls
          that are impossible to freeze.
        documentation: "https://symfony.com/doc/current/components/clock.html"
      - id: "ARCH-PSR-08"
        type: "internals"
        difficulty: "medium"
        subchapter: "architecture/psr"
        concepts: ["implements", "consumes", "distinction"]
        syllabus: "Symfony Architecture → Interoperability & PSRs"
        question: "What is the practical difference between Symfony implementing a PSR and consuming a PSR?"
        answers:
          - value: "Implementing means a Symfony object satisfies the PSR (hand it to any PSR consumer); consuming means Symfony type-hints the PSR so you can inject any implementation"
            correct: true
          - value: "Implementing is done at runtime; consuming is done at compile time"
            correct: false
          - value: "There is no difference — both mean Symfony ships the concrete class"
            correct: false
        explanation: >-
          Implements: Symfony's class IS a valid PSR object (e.g. its Container is a
          PSR-11 container), usable by any library expecting that interface. Consumes:
          Symfony depends on the PSR interface as a type-hint (e.g. PSR-3
          LoggerInterface) so you can plug in any compliant implementation. The
          direction of the dependency is what differs.
        documentation: "https://www.php-fig.org/psr/"

  - name: "Architecture — Naming Conventions"
    questions:
      - id: "ARCH-NAMING-01"
        type: "single"
        difficulty: "easy"
        subchapter: "architecture/naming-conventions"
        concepts: ["service-id", "fqcn", "autowiring"]
        syllabus: "Symfony Architecture → Naming Conventions"
        question: "How are application service IDs written in modern Symfony?"
        answers:
          - value: "As the fully-qualified class name (FQCN)"
            correct: true
          - value: "As lowercase dotted strings only"
            correct: false
          - value: "As random UUIDs"
            correct: false
        explanation: >-
          The service id is the FQCN; autowiring matches type-hints to these ids.
        documentation: "https://symfony.com/doc/current/service_container.html"
      - id: "ARCH-NAMING-02"
        type: "single"
        difficulty: "easy"
        subchapter: "architecture/naming-conventions"
        concepts: ["env-vars", "upper-snake", "app-prefix"]
        syllabus: "Symfony Architecture → Naming Conventions"
        question: "What naming case do environment variables use?"
        answers:
          - value: "UPPER_SNAKE_CASE, usually with an APP_ prefix"
            correct: true
          - value: "camelCase"
            correct: false
          - value: "kebab-case"
            correct: false
        explanation: >-
          Env vars use upper snake case (APP_ENV, APP_DEBUG) and are read in config
          via processors such as %env(int:APP_PAGE_SIZE)%.
        documentation: "https://symfony.com/doc/current/configuration.html"
      - id: "ARCH-NAMING-03"
        type: "single"
        difficulty: "medium"
        subchapter: "architecture/naming-conventions"
        concepts: ["routes", "snake_case", "entity_action"]
        syllabus: "Symfony Architecture → Naming Conventions"
        question: "Which is a correctly named route?"
        answers:
          - value: "invoice_show"
            correct: true
          - value: "InvoiceShow"
            correct: false
          - value: "invoice show"
            correct: false
        explanation: >-
          Route names use snake_case, conventionally entity_action.
        documentation: "https://symfony.com/doc/current/routing.html"
      - id: "ARCH-NAMING-04"
        type: "single"
        difficulty: "medium"
        subchapter: "architecture/naming-conventions"
        concepts: ["abstract", "prefix", "affixes"]
        syllabus: "Symfony Architecture → Naming Conventions"
        question: "How is an abstract class conventionally named?"
        answers:
          - value: "With an Abstract prefix, e.g. AbstractController"
            correct: true
          - value: "With an Abstract suffix, e.g. ControllerAbstract"
            correct: false
          - value: "With an _abstract suffix"
            correct: false
        explanation: >-
          Abstract classes take the Abstract prefix; interfaces use the Interface
          suffix and traits use the Trait suffix.
        documentation: "https://symfony.com/doc/current/contributing/code/standards.html"
      - id: "ARCH-NAMING-05"
        type: "debug"
        difficulty: "medium"
        subchapter: "architecture/naming-conventions"
        concepts: ["affixes", "corrections", "conventions"]
        syllabus: "Symfony Architecture → Naming Conventions"
        question: "Which set correctly fixes these names: httpClientInterface, Abstract_Controller, blogShow (route), app-page-size (parameter), app_env (env var)?"
        answers:
          - value: "HttpClientInterface, AbstractController, blog_show, app.page_size, APP_ENV"
            correct: true
          - value: "HTTPClientInterface, ControllerAbstract, BlogShow, app_page_size, appEnv"
            correct: false
          - value: "httpClient, AbstractController, blog-show, app.pageSize, APP-ENV"
            correct: false
        explanation: >-
          Interfaces are PascalCase with the Interface suffix (HttpClientInterface);
          abstract classes take the Abstract prefix in PascalCase (AbstractController);
          routes are snake_case (blog_show); parameters are snake/dot-separated
          lowercase (app.page_size); env vars are UPPER_SNAKE with APP_ prefix (APP_ENV).
        documentation: "https://symfony.com/doc/current/contributing/code/standards.html"
      - id: "ARCH-NAMING-06"
        type: "internals"
        difficulty: "hard"
        subchapter: "architecture/naming-conventions"
        concepts: ["Interface-suffix", "autoconfiguration", "auto-tagging"]
        syllabus: "Symfony Architecture → Naming Conventions"
        question: "Why is the Interface suffix more than cosmetic in Symfony?"
        answers:
          - value: "Autoconfiguration inspects implemented interfaces (e.g. EventSubscriberInterface) to auto-tag services, so correct interface naming/implementation is part of a working contract"
            correct: true
          - value: "The router requires interface names to end in Interface to build URLs"
            correct: false
          - value: "Composer's autoloader only loads classes whose interface ends in Interface"
            correct: false
        explanation: >-
          When autoconfigure is on, Symfony auto-tags services based on the interfaces
          they implement — e.g. implementing EventSubscriberInterface auto-adds the
          kernel.event_subscriber tag, and ServiceSubscriberInterface, and voter/command
          interfaces behave similarly. So the Interface suffix marks a real, functional
          contract that drives wiring, not just style.
        documentation: "https://symfony.com/doc/current/service_container.html"
      - id: "ARCH-NAMING-07"
        type: "trap"
        difficulty: "medium"
        subchapter: "architecture/naming-conventions"
        concepts: ["constants", "config-keys", "case"]
        syllabus: "Symfony Architecture → Naming Conventions"
        question: "Which casing pair is correct for PHP class constants and bundle config keys?"
        answers:
          - value: "Constants are UPPER_SNAKE_CASE (e.g. MAIN_REQUEST); bundle config keys are snake_case (e.g. framework.http_method_override)"
            correct: true
          - value: "Constants are camelCase; config keys are PascalCase"
            correct: false
          - value: "Both use kebab-case"
            correct: false
        explanation: >-
          PHP constants follow UPPER_SNAKE_CASE (HttpKernelInterface::MAIN_REQUEST) and
          enum cases are PascalCase. Bundle configuration keys are snake_case under the
          extension's alias (e.g. framework.http_method_override). Mixing these up —
          camelCase config keys, for instance — is a planted mistake.
        documentation: "https://symfony.com/doc/current/contributing/code/standards.html"
  - name: "Architecture — Multiple Choice Drills"
    questions:
      - id: "ARCH-MC-01"
        type: "multiple"
        difficulty: "medium"
        subchapter: "architecture/flex"
        concepts: ["flex", "recipes", "symfony.lock", "bundles.php"]
        syllabus: "Symfony Architecture → Symfony Flex"
        question: "Which of the following statements are true about Symfony Flex? (select all that apply)"
        answers:
          - value: "Flex is a Composer plugin that resolves package aliases and applies recipes at install/update time"
            correct: true
          - value: "symfony.lock records which recipes are installed and should be committed to version control"
            correct: true
          - value: "Bundles enabled by recipes are registered in config/bundles.php, which the kernel reads at boot"
            correct: true
          - value: "Flex hooks into the kernel at runtime to auto-register bundles on each HTTP request"
            correct: false
          - value: "Installed recipes are recorded in composer.lock together with package versions"
            correct: false
        explanation: >-
          Flex is a Composer plugin that runs only at Composer install/update time,
          resolving aliases and applying recipes; it plays no role during request
          handling, so the runtime option is wrong. Applied recipes are tracked in
          symfony.lock (committed), not in composer.lock which only tracks package
          versions, and recipe configurators write bundle registrations into
          config/bundles.php for the kernel to read at boot.
        documentation: "https://symfony.com/doc/current/setup.html"
      - id: "ARCH-MC-02"
        type: "multiple"
        difficulty: "hard"
        subchapter: "architecture/release-management"
        concepts: ["release-cycle", "LTS", "semver", "maintenance"]
        syllabus: "Symfony Architecture → Release Management"
        question: "Which statements accurately describe the Symfony release process? (select all that apply)"
        answers:
          - value: "Minor versions are released on a time-based schedule in May and November, and a new major arrives every two years"
            correct: true
          - value: "8.4 is the Symfony 8 LTS version and ships alongside 9.0"
            correct: true
          - value: "A minor version may break backward compatibility as long as the change was deprecated first"
            correct: false
          - value: "Standard (non-LTS) versions receive 3 years of bug fixes"
            correct: false
          - value: "The LTS of each branch is always the X.0 release of the major"
            correct: false
        explanation: >-
          Symfony follows a time-based schedule: minors in May and November and a new
          major every two years, with the last minor of a branch (X.4, e.g. 8.4) being
          the LTS that ships alongside the next major. BC breaks happen only in major
          versions, never in minors even after deprecation, and standard versions get
          8 months of bug fixes / 14 months of security fixes — the 3-year bug-fix
          window belongs to LTS releases only.
        documentation: "https://symfony.com/doc/current/contributing/community/releases.html"
      - id: "ARCH-MC-03"
        type: "multiple"
        difficulty: "medium"
        subchapter: "architecture/bc-promise"
        concepts: ["bc-promise", "internal", "experimental", "deprecations"]
        syllabus: "Symfony Architecture → Backward Compatibility"
        question: "Which statements are true about Symfony's backward compatibility promise? (select all that apply)"
        answers:
          - value: "Public API that is not marked @internal or @experimental stays stable within a major version"
            correct: true
          - value: "Existing behavior is removed only in the next major version, and only after being deprecated first"
            correct: true
          - value: "Classes marked @internal are covered by the promise as long as their methods are public"
            correct: false
          - value: "Extending framework classes through inheritance is the recommended way to customize Symfony"
            correct: false
        explanation: >-
          The BC promise guarantees that public, non-@internal, non-@experimental API
          remains stable within a major, and removals happen only in the next major
          after a deprecation phase. @internal and @experimental annotations carve
          exceptions out of the promise regardless of method visibility, and the
          recommended extension mechanisms are events, decoration and dependency
          injection rather than inheriting framework classes.
        documentation: "https://symfony.com/doc/current/contributing/code/bc.html"
      - id: "ARCH-MC-04"
        type: "multiple"
        difficulty: "hard"
        subchapter: "architecture/request-handling"
        concepts: ["kernel-events", "kernel.view", "kernel.terminate", "resolvers"]
        syllabus: "Symfony Architecture → Request Handling"
        question: "Which statements about HttpKernel's request handling and its events are correct? (select all that apply)"
        answers:
          - value: "kernel.view is dispatched only when the controller returns something other than a Response"
            correct: true
          - value: "kernel.terminate is dispatched after the response has been sent to the client"
            correct: true
          - value: "When handle() is called with catch: true, exceptions are caught and kernel.exception is dispatched"
            correct: true
          - value: "kernel.response is dispatched before kernel.controller so listeners can veto the controller"
            correct: false
          - value: "The controller callable itself is resolved by the ArgumentResolverInterface"
            correct: false
        explanation: >-
          kernel.view fires only for non-Response controller return values, and
          kernel.terminate runs after the response was already sent, which makes it
          suitable for heavy post-response work; with catch: true, HttpKernel catches
          throwables and dispatches kernel.exception. The event order puts
          kernel.controller before kernel.response, and the controller callable is
          resolved by ControllerResolverInterface — ArgumentResolverInterface only
          resolves the controller's arguments.
        documentation: "https://symfony.com/doc/current/components/http_kernel.html"
      - id: "ARCH-MC-05"
        type: "multiple"
        difficulty: "medium"
        subchapter: "architecture/psr"
        concepts: ["psr-11", "psr-20", "psr-3", "psr-7", "bridge"]
        syllabus: "Symfony Architecture → Interoperability & PSRs"
        question: "Which statements about Symfony's relationship to the PSR standards are true? (select all that apply)"
        answers:
          - value: "The service container implements PSR-11 and the Clock component implements PSR-20"
            correct: true
          - value: "Components type-hint the PSR-3 Psr\\Log\\LoggerInterface, so any PSR-3 logger can be injected"
            correct: true
          - value: "The psr-http-message bridge converts between HttpFoundation objects and PSR-7 messages"
            correct: true
          - value: "HttpFoundation's Request and Response natively implement the PSR-7 interfaces"
            correct: false
          - value: "Symfony's autoloading follows PSR-0"
            correct: false
        explanation: >-
          Symfony implements PSR-6, PSR-11, PSR-14, PSR-16 and PSR-20 (the container
          is a PSR-11 ContainerInterface and Clock is PSR-20), and it consumes PSR-3
          by type-hinting LoggerInterface so any compliant logger works. HttpFoundation
          predates and does not implement PSR-7 — the psr-http-message bridge converts
          between the two object models — and autoloading follows PSR-4, not PSR-0.
        documentation: "https://symfony.com/doc/current/components/psr7.html"
      - id: "ARCH-MC-06"
        type: "multiple"
        difficulty: "medium"
        subchapter: "architecture/events"
        concepts: ["event-dispatcher", "priorities", "psr-14", "stopPropagation"]
        syllabus: "Symfony Architecture → Event Dispatcher"
        question: "Which statements about the EventDispatcher component are correct? (select all that apply)"
        answers:
          - value: "Listeners for an event are invoked in descending priority order (highest priority first)"
            correct: true
          - value: "stopPropagation() prevents only the remaining listeners of the current event from running"
            correct: true
          - value: "Event subscribers must be registered manually with addListener() for every event they handle"
            correct: false
          - value: "dispatch() takes the event name as the first argument and the event object as the second"
            correct: false
        explanation: >-
          The dispatcher sorts listeners by priority in descending order, and
          stopPropagation() halts only the not-yet-called listeners of the event
          currently being dispatched — other events are unaffected. Subscribers
          declare all their events in getSubscribedEvents() and are wired
          automatically (autoconfiguration tags them), and dispatch() follows the
          PSR-14 signature: the event object first, then an optional event name.
        documentation: "https://symfony.com/doc/current/components/event_dispatcher.html"
      - id: "ARCH-MC-07"
        type: "multiple"
        difficulty: "hard"
        subchapter: "architecture/overloading"
        concepts: ["template-override", "service-decoration", "translations", "getParent"]
        syllabus: "Symfony Architecture → Framework Overloading"
        question: "Which are valid ways to override parts of Symfony or a third-party bundle in an application? (select all that apply)"
        answers:
          - value: "Override a bundle template by placing a file with the same path under templates/bundles/<BundleName>/"
            correct: true
          - value: "Override a service by decorating it or replacing its definition, e.g. via a compiler pass"
            correct: true
          - value: "Override translations by defining the same key in the application's translations/ directory, which wins over the bundle's"
            correct: true
          - value: "Create a child bundle and point getParent() at the bundle you want to override"
            correct: false
          - value: "Copy the entire bundle into src/ so your copy shadows the vendor code"
            correct: false
        explanation: >-
          Per-resource overriding is the supported model: templates placed under
          templates/bundles/<BundleName>/ shadow the bundle's own, application
          translations take precedence over bundle translations, and services can be
          redefined, decorated or altered through a compiler pass. Bundle inheritance
          via getParent() has been removed, and copying whole bundles into src/ is
          not an override mechanism at all.
        documentation: "https://symfony.com/doc/current/bundles/override.html"
