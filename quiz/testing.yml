      - id: "TEST-MC-07"
        type: "multiple"
        difficulty: "medium"
        subchapter: "testing/phpunit-bridge"
        out_of_scope: true
        concepts: ["SymfonyExtension", "time-sensitive", "dns-sensitive", "env-var"]
        syllabus: "Automated Tests → PHPUnit bridge"
        question: "Which statements about the Symfony PHPUnit bridge are true? (select all that apply)"
        answers:
          - value: "Its features are wired by registering Symfony\\Bridge\\PhpUnit\\SymfonyExtension in the PHPUnit configuration"
            correct: true
          - value: "Clock and DNS mocking are opt-in per test via the time-sensitive and dns-sensitive groups"
            correct: true
          - value: "SYMFONY_DEPRECATIONS_HELPER is an environment/server variable, not a PHPUnit CLI flag"
            correct: true
          - value: "Clock mocking is applied automatically to every test once the bridge is installed"
            correct: false
          - value: "Deprecation reporting is tuned with the phpunit --deprecations-helper command-line option"
            correct: false
        explanation: >-
          Deprecation collection and clock/DNS mocking only work once the
          SymfonyExtension is registered in the PHPUnit configuration, and the
          mocking is opt-in per group (time-sensitive / dns-sensitive) rather than
          applied globally. Reporting is tuned through the SYMFONY_DEPRECATIONS_HELPER
          env/server variable; no equivalent PHPUnit CLI flag exists.
        documentation: "https://symfony.com/doc/8.0/components/phpunit_bridge.html"
