categories:
  - name: "PHP API (up to 8.4)"
    questions:
      - id: "PHP-API-01"
        question: "What does the backed-enum method `Suit::tryFrom('X')` return when 'X' is not a valid case?"
        type: "single"
        difficulty: "easy"
        subchapter: "php-web-security/php-api"
        concepts: ["enum", "backed-enum", "tryFrom"]
        syllabus: "PHP → PHP API (up to 8.4)"
        answers:
          - { value: "null", correct: true }
          - { value: "Throws \\ValueError", correct: false }
          - { value: "false", correct: false }
          - { value: "The first case", correct: false }
        explanation: >-
          tryFrom() returns null for an unknown value; only from() throws a
          \ValueError. "false" is wrong because backed enums never coerce to a
          bool, and "first case" is wrong because there is no implicit default.
          Internally both call the same lookup but from() escalates a miss to an
          exception while tryFrom() swallows it. Misconception: developers assume
          the two are interchangeable — use tryFrom() for untrusted input.
        documentation: "https://www.php.net/manual/en/language.enumerations.backed.php"

      - id: "PHP-API-02"
        question: "Which statement about the `match` expression is correct?"
        type: "single"
        difficulty: "medium"
        subchapter: "php-web-security/php-api"
        concepts: ["match", "strict-comparison", "UnhandledMatchError"]
        syllabus: "PHP → PHP API (up to 8.4)"
        answers:
          - { value: "It compares with === and throws \\UnhandledMatchError when nothing matches and there is no default", correct: true }
          - { value: "It falls through arms like switch", correct: false }
          - { value: "It uses loose == comparison", correct: false }
          - { value: "It cannot return a value", correct: false }
        explanation: >-
          match is strict (===), returns a value, has no fall-through, and errors
          with \UnhandledMatchError when unmatched without a default arm. The
          fall-through and loose-comparison options describe switch, not match.
          "Cannot return a value" is false — match is an expression, unlike the
          switch statement. Misconception: treating match like a typed switch;
          the strict comparison means '1' does not match 1.
        documentation: "https://www.php.net/manual/en/control-structures.match.php"

      - id: "PHP-API-03"
        question: "In PHP 8.4, what does `public private(set) int $n;` mean?"
        type: "single"
        difficulty: "medium"
        subchapter: "php-web-security/php-api"
        concepts: ["asymmetric-visibility", "php84", "visibility"]
        syllabus: "PHP → PHP API (up to 8.4)"
        answers:
          - { value: "n can be read from anywhere but written only inside the class", correct: true }
          - { value: "n is readonly", correct: false }
          - { value: "n is invisible outside the class", correct: false }
          - { value: "n is static", correct: false }
        explanation: >-
          Asymmetric visibility (8.4) sets a stricter write scope than read scope;
          here read is public, write is private. It is not readonly: readonly
          blocks writes even internally after the first initialisation, whereas
          private(set) still allows repeated internal writes. It remains publicly
          readable, so "invisible outside" is wrong, and it says nothing about
          static. Misconception: equating private(set) with readonly.
        documentation: "https://www.php.net/manual/en/language.oop5.visibility.php"

      - id: "PHP-API-04"
        question: "Which is a syntactically valid DNF type declaration?"
        type: "single"
        difficulty: "medium"
        subchapter: "php-web-security/php-api"
        concepts: ["dnf-types", "union", "intersection"]
        syllabus: "PHP → PHP API (up to 8.4)"
        answers:
          - { value: "(Countable&Traversable)|null", correct: true }
          - { value: "Countable|Traversable&null", correct: false }
          - { value: "?Countable&Traversable", correct: false }
          - { value: "Countable&?Traversable", correct: false }
        explanation: >-
          Disjunctive Normal Form requires each intersection group to be
          parenthesised and then OR-ed together. A bare `A|B&C` mixes the two
          without parentheses and is a parse error. `?` (nullable sugar) cannot be
          combined with an intersection, so both `?Countable&Traversable` and
          `Countable&?Traversable` are invalid. Misconception: that you can sprinkle
          `?` anywhere; in DNF you write `|null` explicitly outside the group.
        documentation: "https://www.php.net/manual/en/language.types.declarations.php"

      - id: "PHP-API-05"
        question: "What does `json_validate($string)` return?"
        type: "single"
        difficulty: "easy"
        subchapter: "php-web-security/php-api"
        concepts: ["json_validate", "php83"]
        syllabus: "PHP → PHP API (up to 8.4)"
        answers:
          - { value: "A bool indicating whether the string is valid JSON", correct: true }
          - { value: "The decoded associative array", correct: false }
          - { value: "A stdClass object", correct: false }
          - { value: "null on success", correct: false }
        explanation: >-
          json_validate() (8.3) only reports validity as a bool, using less memory
          than json_decode() for large payloads because it never materialises the
          structure. It never returns the decoded array or object — that is
          json_decode()'s job — and it does not return null on success.
          Misconception: expecting a decoded value; if you need the data, still call
          json_decode() afterwards.
        documentation: "https://www.php.net/manual/en/function.json-validate.php"

      - id: "PHP-API-06"
        question: "True or False: a `readonly` property may declare a default value in its definition."
        type: "true-false"
        difficulty: "easy"
        subchapter: "php-web-security/php-api"
        concepts: ["readonly", "php81", "value-object"]
        syllabus: "PHP → PHP API (up to 8.4)"
        answers:
          - { value: "False", correct: true }
          - { value: "True", correct: false }
        explanation: >-
          A readonly property must be typed and cannot have a default; it is
          initialised exactly once from within the declaring class scope. A default
          would count as an initialisation the class could never override in the
          constructor, so PHP forbids it. Misconception: treating readonly like a
          normal typed property that merely blocks external writes — it also
          rejects defaults and cannot be static or untyped.
        documentation: "https://www.php.net/manual/en/language.oop5.properties.php"

      - id: "PHP-API-07"
        question: "Given `public float $fahrenheit { get => $this->celsius * 9/5 + 32; }` with `$celsius = 100.0`, what is `$obj->fahrenheit`?"
        type: "code"
        difficulty: "hard"
        subchapter: "php-web-security/php-api"
        concepts: ["property-hooks", "php84", "virtual-property"]
        syllabus: "PHP → PHP API (up to 8.4)"
        answers:
          - { value: "212.0 — a virtual property computed by the get hook", correct: true }
          - { value: "100.0 — the backing celsius value", correct: false }
          - { value: "A TypeError, because fahrenheit has no backing store", correct: false }
          - { value: "null, because no value was assigned", correct: false }
        explanation: >-
          Property hooks (8.4) let a get hook compute a value on read; here it
          returns 100*9/5+32 = 212.0. There is no backing field for fahrenheit
          (it is virtual) yet reading it is valid — the hook supplies the value, so
          neither null nor a TypeError occurs. It returns the computed number, not
          the raw celsius. Misconception: assuming a hooked property still needs a
          stored value; a purely virtual property derives it each read.
        documentation: "https://www.php.net/manual/en/language.oop5.property-hooks.php"

      - id: "PHP-API-08"
        question: "How does the nullsafe operator `$a?->b()?->c` behave when `$a` is null?"
        type: "trap"
        difficulty: "medium"
        subchapter: "php-web-security/php-api"
        concepts: ["nullsafe", "php80", "short-circuit"]
        syllabus: "PHP → PHP API (up to 8.4)"
        answers:
          - { value: "The whole chain short-circuits and the expression evaluates to null", correct: true }
          - { value: "It behaves like ?? and returns a default", correct: false }
          - { value: "It throws an Error on the null access", correct: false }
          - { value: "It can be used as an assignment target (lvalue)", correct: false }
        explanation: >-
          `?->` short-circuits the rest of the chain to null the moment an operand
          is null, so b() and c are never evaluated. It is not `??`: it does not
          supply a fallback value, it just stops. It does not throw, and it cannot
          appear on the left of an assignment. Misconception: confusing `?->`
          (null-safe method/property access) with `??` (null coalescing) — they
          solve different problems.
        documentation: "https://www.php.net/manual/en/language.oop5.basic.php"

      - id: "PHP-API-09"
        question: "Which PHP release introduced property hooks and asymmetric visibility?"
        type: "single"
        difficulty: "easy"
        subchapter: "php-web-security/php-api"
        concepts: ["php84", "versioning", "property-hooks"]
        syllabus: "PHP → PHP API (up to 8.4)"
        answers:
          - { value: "PHP 8.4", correct: true }
          - { value: "PHP 8.1", correct: false }
          - { value: "PHP 8.2", correct: false }
          - { value: "PHP 8.3", correct: false }
        explanation: >-
          Both headline features arrived in 8.4. 8.1 added enums, readonly
          properties and first-class callables; 8.2 added readonly classes and DNF
          types; 8.3 added typed class constants, #[\\Override] and json_validate().
          The exam probes which version added what. Misconception: dating property
          hooks to 8.1 alongside readonly — they are three years apart.
        documentation: "https://www.php.net/manual/en/migration84.new-features.php"

      - id: "PHP-API-10"
        question: "Which statements about enums are correct? (choose two)"
        type: "multiple"
        difficulty: "medium"
        subchapter: "php-web-security/php-api"
        concepts: ["enum", "singleton", "backed-enum"]
        syllabus: "PHP → PHP API (up to 8.4)"
        answers:
          - { value: "Enum cases are singletons, so === identity comparison always works", correct: true }
          - { value: "Enums cannot hold non-constant instance state", correct: true }
          - { value: "Every enum is a backed enum with a ->value", correct: false }
          - { value: "Enums may declare public mutable properties", correct: false }
        explanation: >-
          Cases are singletons so `Suit::Hearts === Suit::Hearts` holds, and enums
          cannot carry per-instance mutable state (only constants, methods and
          interfaces). Not every enum is backed — pure enums have cases with no
          scalar `->value`; only backed enums expose one. Because they are stateless
          singletons they cannot declare mutable properties. Misconception: adding
          object-like state to an enum.
        documentation: "https://www.php.net/manual/en/language.enumerations.php"

      - id: "PHP-API-11"
        question: "What happens at runtime when `Suit::from('Z')` is called and 'Z' is not a valid backing value?"
        type: "code"
        difficulty: "hard"
        subchapter: "php-web-security/php-api"
        concepts: ["enum", "from", "ValueError"]
        syllabus: "PHP → PHP API (up to 8.4)"
        answers:
          - { value: "It throws \\ValueError", correct: true }
          - { value: "It returns null", correct: false }
          - { value: "It returns the first case", correct: false }
          - { value: "It emits a warning and returns false", correct: false }
        explanation: >-
          from() is the strict lookup: an unknown value throws \\ValueError. That is
          the mirror image of tryFrom(), which returns null. It never falls back to
          the first case nor warns-and-returns-false. Best practice: wrap from() in
          try/catch for untrusted input, or use tryFrom(). Misconception: assuming
          from() degrades gracefully like tryFrom() — it deliberately fails loud.
        documentation: "https://www.php.net/manual/en/language.enumerations.backed.php"

      - id: "PHP-API-12"
        question: "You expose a public method and callers use named arguments. Why is renaming a parameter now risky?"
        type: "scenario"
        difficulty: "medium"
        subchapter: "php-web-security/php-api"
        concepts: ["named-arguments", "bc-break", "api-design"]
        syllabus: "PHP → PHP API (up to 8.4)"
        answers:
          - { value: "The parameter name becomes part of the public API, so renaming it is a BC break", correct: true }
          - { value: "Named arguments are positional, so the name is irrelevant", correct: false }
          - { value: "PHP forbids renaming any parameter after release", correct: false }
          - { value: "Named arguments only work on constructors, so methods are safe", correct: false }
        explanation: >-
          With named arguments (8.0) callers write `foo(limit: 10)`, so the
          parameter identifier is part of your contract; renaming it breaks every
          named call. Named arguments are the opposite of positional. PHP does not
          forbid renaming — it simply becomes a semantic BC break. They work on any
          function/method, not just constructors. Misconception: thinking parameter
          names are private implementation detail.
        documentation: "https://www.php.net/manual/en/functions.arguments.php"

  - name: "Object-Oriented Programming"
    questions:
      - id: "PHP-OOP-01"
        question: "Inside a parent factory method, how do `new static()` and `new self()` differ?"
        type: "single"
        difficulty: "medium"
        subchapter: "php-web-security/oop"
        concepts: ["late-static-binding", "static", "self"]
        syllabus: "PHP → Object-Oriented Programming"
        answers:
          - { value: "static respects the called subclass (late static binding); self is fixed to the defining class", correct: true }
          - { value: "They are identical", correct: false }
          - { value: "self respects the subclass", correct: false }
          - { value: "Both resolve only at compile time", correct: false }
        explanation: >-
          Late static binding makes static:: resolve to the runtime (called) class,
          so `new static()` returns a subclass instance where `new self()` always
          returns the defining class. They are not identical, self does not track
          the subclass, and only self is resolved at compile time (static is
          resolved at runtime). Misconception: using self in an inheritable named
          constructor and wondering why subclasses get the parent type.
        documentation: "https://www.php.net/manual/en/language.oop5.late-static-bindings.php"

      - id: "PHP-OOP-02"
        question: "After `$b = clone $a;` where `$a->list` is an object, what is `$b->list`?"
        type: "single"
        difficulty: "medium"
        subchapter: "php-web-security/oop"
        concepts: ["clone", "shallow-copy", "__clone"]
        syllabus: "PHP → Object-Oriented Programming"
        answers:
          - { value: "The same object as $a->list unless __clone() copies it", correct: true }
          - { value: "Always an independent deep copy", correct: false }
          - { value: "null", correct: false }
          - { value: "A fatal error", correct: false }
        explanation: >-
          clone performs a shallow copy; object-typed properties remain shared
          references until __clone() explicitly deep-copies them. It is never an
          automatic deep copy, it is not nulled, and cloning does not error.
          Misconception: assuming clone recursively duplicates nested objects —
          you must implement __clone() to avoid shared mutable state between copies.
        documentation: "https://www.php.net/manual/en/language.oop5.cloning.php"

      - id: "PHP-OOP-03"
        question: "When is the magic method `__get()` invoked?"
        type: "single"
        difficulty: "easy"
        subchapter: "php-web-security/oop"
        concepts: ["magic-methods", "__get", "overloading"]
        syllabus: "PHP → Object-Oriented Programming"
        answers:
          - { value: "Only when reading an inaccessible or undefined property", correct: true }
          - { value: "On every property read", correct: false }
          - { value: "On property writes", correct: false }
          - { value: "On isset() calls", correct: false }
        explanation: >-
          __get() fires only for inaccessible/undefined properties; accessible ones
          are read directly, so it is not called on every read. Writes trigger
          __set(), and isset() on an inaccessible property triggers __isset(), not
          __get(). Misconception: using __get() as a universal accessor — it never
          runs for a normal public property that exists.
        documentation: "https://www.php.net/manual/en/language.oop5.overloading.php"

      - id: "PHP-OOP-04"
        question: "Which cannot be used as a promoted constructor parameter?"
        type: "single"
        difficulty: "medium"
        subchapter: "php-web-security/oop"
        concepts: ["constructor-promotion", "callable", "property-types"]
        syllabus: "PHP → Object-Oriented Programming"
        answers:
          - { value: "private callable $fn", correct: true }
          - { value: "public readonly int $x", correct: false }
          - { value: "private ?string $s = null", correct: false }
          - { value: "protected array $items = []", correct: false }
        explanation: >-
          callable is not a valid property type, so it cannot be a promoted
          property (a promoted parameter also declares a property). readonly,
          nullable and array typed parameters with defaults are all valid promotions.
          Misconception: thinking any parameter type can be promoted — use
          \\Closure instead of callable when you need to store it as a property.
        documentation: "https://www.php.net/manual/en/language.oop5.decon.php"

      - id: "PHP-OOP-05"
        question: "`class A { static function f() { return new static(); } } class B extends A {}` — what is `B::f() instanceof B`?"
        type: "code"
        difficulty: "hard"
        subchapter: "php-web-security/oop"
        concepts: ["late-static-binding", "static", "factory"]
        syllabus: "PHP → Object-Oriented Programming"
        answers:
          - { value: "true — new static() resolves to the called class B", correct: true }
          - { value: "false — it returns an instance of A", correct: false }
          - { value: "A fatal error because f() is inherited", correct: false }
          - { value: "false — static methods cannot be inherited", correct: false }
        explanation: >-
          `new static()` uses late static binding, so calling B::f() constructs a B,
          making the check true. Had f() used `new self()` it would return an A and
          the check would be false. Inherited static methods are perfectly legal, so
          there is no error, and static methods are inherited. Misconception:
          believing the defining class (A) always wins; the runtime call target
          drives static::.
        documentation: "https://www.php.net/manual/en/language.oop5.late-static-bindings.php"

      - id: "PHP-OOP-06"
        question: "True or False: `__toString()` is invoked when you `var_dump()` an object."
        type: "true-false"
        difficulty: "easy"
        subchapter: "php-web-security/oop"
        concepts: ["magic-methods", "__toString", "__debugInfo"]
        syllabus: "PHP → Object-Oriented Programming"
        answers:
          - { value: "False", correct: true }
          - { value: "True", correct: false }
        explanation: >-
          var_dump() consults __debugInfo() (if defined), not __toString().
          __toString() fires only when the object is used in a string context (echo,
          concatenation, string casts) and implies the Stringable interface.
          Misconception: assuming any "display" operation calls __toString() — dump
          and print_r inspect structure, they do not stringify the object.
        documentation: "https://www.php.net/manual/en/language.oop5.magic.php"

      - id: "PHP-OOP-07"
        question: "Which magic method handles `isset($obj->missing)` when `missing` is inaccessible?"
        type: "internals"
        difficulty: "medium"
        subchapter: "php-web-security/oop"
        concepts: ["magic-methods", "__isset", "overloading"]
        syllabus: "PHP → Object-Oriented Programming"
        answers:
          - { value: "__isset()", correct: true }
          - { value: "__get()", correct: false }
          - { value: "__call()", correct: false }
          - { value: "__invoke()", correct: false }
        explanation: >-
          isset()/empty() on an inaccessible or undefined property route through
          __isset(); the engine does not call __get() for the existence check.
          __call() handles inaccessible method calls and __invoke() handles using an
          object as a function. Misconception: expecting __get() to fire for isset()
          — that would force materialising the value, which is why a dedicated
          __isset() hook exists.
        documentation: "https://www.php.net/manual/en/language.oop5.overloading.php"

      - id: "PHP-OOP-08"
        question: "True or False: a child class can directly access `private` members declared on its parent."
        type: "true-false"
        difficulty: "easy"
        subchapter: "php-web-security/oop"
        concepts: ["visibility", "private", "inheritance"]
        syllabus: "PHP → Object-Oriented Programming"
        answers:
          - { value: "False", correct: true }
          - { value: "True", correct: false }
        explanation: >-
          private restricts access to the declaring class only; a subclass cannot
          see a parent's private members. Use protected to expose members to
          subclasses. Misconception: treating private and protected as
          interchangeable — protected = class + subclasses, private = declaring
          class only, even within the same hierarchy.
        documentation: "https://www.php.net/manual/en/language.oop5.visibility.php"

      - id: "PHP-OOP-09"
        question: "A named constructor `Model::create()` uses `return new self();`. Subclass calls `User::create()` but gets a Model, not a User. What is the fix?"
        type: "debug"
        difficulty: "hard"
        subchapter: "php-web-security/oop"
        concepts: ["late-static-binding", "self", "debugging"]
        syllabus: "PHP → Object-Oriented Programming"
        answers:
          - { value: "Replace `new self()` with `new static()` to honour late static binding", correct: true }
          - { value: "Declare the method final so subclasses inherit correctly", correct: false }
          - { value: "Add a return type of self", correct: false }
          - { value: "Override create() in every subclass", correct: false }
        explanation: >-
          self is bound at compile time to the defining class (Model), so it always
          builds a Model. new static() resolves to the runtime call target (User),
          fixing the factory. final only prevents overriding and would not change
          the instantiated type; a `self` return type would actually worsen it by
          declaring the wrong type; overriding in every subclass is boilerplate the
          LSB approach avoids. Misconception: that return types influence which class
          is instantiated.
        documentation: "https://www.php.net/manual/en/language.oop5.late-static-bindings.php"

      - id: "PHP-OOP-10"
        question: "Which features does constructor property promotion support?"
        type: "single"
        difficulty: "easy"
        subchapter: "php-web-security/oop"
        concepts: ["constructor-promotion", "readonly", "visibility"]
        syllabus: "PHP → Object-Oriented Programming"
        answers:
          - { value: "Visibility, readonly, types, defaults and attributes", correct: true }
          - { value: "Only public untyped parameters", correct: false }
          - { value: "Promotion in any method, not just __construct", correct: false }
          - { value: "callable-typed properties", correct: false }
        explanation: >-
          A promoted parameter both declares and assigns the property and may carry
          visibility, readonly, a type, a default and attributes. It works only in
          __construct (not arbitrary methods), requires a valid property type
          (callable is not one), and untyped/public-only is not a limitation.
          Misconception: thinking promotion is a stripped-down shortcut — it is the
          full property declaration inline.
        documentation: "https://www.php.net/manual/en/language.oop5.decon.php"

  - name: "Namespaces & Autoloading"
    questions:
      - id: "PHP-NS-01"
        question: "Inside `namespace App;`, an unqualified function call `count($x)` resolves to…"
        type: "single"
        difficulty: "medium"
        subchapter: "php-web-security/namespaces"
        concepts: ["name-resolution", "global-fallback", "functions"]
        syllabus: "PHP → Namespaces"
        answers:
          - { value: "App\\count if it exists, otherwise the global \\count", correct: true }
          - { value: "Always App\\count", correct: false }
          - { value: "A fatal error", correct: false }
          - { value: "\\count only, never App\\count", correct: false }
        explanation: >-
          Unqualified function and constant calls try the current namespace first,
          then fall back to the global namespace — so a local App\\count would win,
          else \\count runs. It is never "always App\\count" nor a fatal error, and
          the global-only option ignores the local-first rule. This fallback is
          exactly why \\count() micro-optimises the lookup. Misconception: assuming
          the fallback also applies to class names — it does not.
        documentation: "https://www.php.net/manual/en/language.namespaces.rules.php"

      - id: "PHP-NS-02"
        question: "What does the statement `use App\\Service\\Mailer;` do?"
        type: "single"
        difficulty: "easy"
        subchapter: "php-web-security/namespaces"
        concepts: ["use", "alias", "compile-time"]
        syllabus: "PHP → Namespaces"
        answers:
          - { value: "Creates a compile-time alias so `Mailer` refers to the FQCN", correct: true }
          - { value: "Loads the class file immediately", correct: false }
          - { value: "Instantiates the class", correct: false }
          - { value: "Registers an autoloader", correct: false }
        explanation: >-
          use is a pure compile-time alias; it neither loads a file, instantiates,
          nor registers a loader. The file is only required later by the autoloader
          when the class is first referenced at runtime. Misconception: believing
          use triggers I/O — it is resolved entirely by the compiler and costs
          nothing at runtime.
        documentation: "https://www.php.net/manual/en/language.namespaces.importing.php"

      - id: "PHP-NS-03"
        question: "Under PSR-4 rule mapping prefix `App\\` to `src/`, where does `App\\Foo\\Bar` live?"
        type: "single"
        difficulty: "medium"
        subchapter: "php-web-security/namespaces"
        concepts: ["psr-4", "autoloading", "path-mapping"]
        syllabus: "PHP → Namespaces"
        answers:
          - { value: "src/Foo/Bar.php", correct: true }
          - { value: "src/App/Foo/Bar.php", correct: false }
          - { value: "src/foo/bar.php", correct: false }
          - { value: "App/Foo/Bar.php", correct: false }
        explanation: >-
          PSR-4 strips the mapped prefix (App\\), replaces \\ with /, and appends
          .php, giving src/Foo/Bar.php. The App segment is not repeated under src/,
          the mapping is case-sensitive on Linux (so lowercase is wrong), and the
          src/ base directory is mandatory. Misconception: keeping the prefix in the
          path — the prefix maps to the base dir and disappears from it.
        documentation: "https://www.php-fig.org/psr/psr-4/"

      - id: "PHP-NS-04"
        question: "Inside `namespace App;`, which correctly references the global DateTimeImmutable class?"
        type: "single"
        difficulty: "easy"
        subchapter: "php-web-security/namespaces"
        concepts: ["name-resolution", "classes", "global-namespace"]
        syllabus: "PHP → Namespaces"
        answers:
          - { value: "new \\DateTimeImmutable()", correct: true }
          - { value: "new DateTimeImmutable()", correct: false }
          - { value: "new App\\DateTimeImmutable()", correct: false }
          - { value: "new global\\DateTimeImmutable()", correct: false }
        explanation: >-
          Class names do not fall back to the global namespace, so an unqualified
          `new DateTimeImmutable()` looks for App\\DateTimeImmutable and fails; you
          need a leading backslash or a use import. App\\DateTimeImmutable does not
          exist, and `global\\` is not valid syntax. Misconception: assuming the
          function/constant global fallback also covers classes — it never does.
        documentation: "https://www.php.net/manual/en/language.namespaces.rules.php"

      - id: "PHP-NS-05"
        question: "A composer.json maps the PSR-4 prefix `App\\` to `src/`. Where is `App\\Repository\\UserRepository` autoloaded from?"
        type: "config"
        difficulty: "medium"
        subchapter: "php-web-security/namespaces"
        concepts: ["psr-4", "composer", "autoload"]
        syllabus: "PHP → Namespaces"
        answers:
          - { value: "src/Repository/UserRepository.php", correct: true }
          - { value: "src/App/Repository/UserRepository.php", correct: false }
          - { value: "vendor/App/Repository/UserRepository.php", correct: false }
          - { value: "app/Repository/UserRepository.php", correct: false }
        explanation: >-
          Composer strips the App\\ prefix (mapped to src/), converts remaining
          separators to directories and appends .php, yielding
          src/Repository/UserRepository.php. The prefix is not duplicated under
          src/, application code is not under vendor/ (that is for third-party
          packages), and the base dir is src/ not app/. Misconception: expecting the
          namespace root folder to appear inside the base directory.
        documentation: "https://getcomposer.org/doc/04-schema.md#psr-4"

      - id: "PHP-NS-06"
        question: "True or False: `use App\\Foo;` also imports the sub-namespace class `App\\Foo\\Bar`."
        type: "true-false"
        difficulty: "medium"
        subchapter: "php-web-security/namespaces"
        concepts: ["use", "import", "sub-namespace"]
        syllabus: "PHP → Namespaces"
        answers:
          - { value: "False", correct: true }
          - { value: "True", correct: false }
        explanation: >-
          A use statement imports exactly one name (here Foo). To use Bar you write
          `use App\\Foo\\Bar;` or reference it as `Foo\\Bar` after importing Foo.
          Imports are not recursive over sub-namespaces. Misconception: thinking use
          brings in a whole namespace tree — it aliases a single symbol; grouped
          imports `use App\\Foo\\{Bar, Baz};` list each explicitly.
        documentation: "https://www.php.net/manual/en/language.namespaces.importing.php"

      - id: "PHP-NS-07"
        question: "What does `composer dump-autoload --optimize` produce for production?"
        type: "internals"
        difficulty: "easy"
        subchapter: "php-web-security/namespaces"
        concepts: ["composer", "classmap", "optimize"]
        syllabus: "PHP → Namespaces"
        answers:
          - { value: "A static classmap so no per-class filesystem stat is needed", correct: true }
          - { value: "A minified copy of every class file", correct: false }
          - { value: "A pre-instantiated container of all services", correct: false }
          - { value: "A stripped autoloader that disables PSR-4", correct: false }
        explanation: >-
          --optimize converts PSR-4 rules into an explicit class-to-file map, so
          the loader looks up a path in an array instead of probing the filesystem —
          faster in production. It does not minify sources, does not build a service
          container (that is Symfony's job), and PSR-4 still works as a fallback for
          classes not in the map (unless --classmap-authoritative). Misconception:
          confusing autoload optimisation with application caching.
        documentation: "https://getcomposer.org/doc/articles/autoloader-optimization.md"

      - id: "PHP-NS-08"
        question: "Inside `namespace App;` you write `new DateTime()` with no import. What happens?"
        type: "debug"
        difficulty: "hard"
        subchapter: "php-web-security/namespaces"
        concepts: ["name-resolution", "classes", "fatal-error"]
        syllabus: "PHP → Namespaces"
        answers:
          - { value: "A fatal Error: class App\\DateTime not found", correct: true }
          - { value: "It transparently uses the global \\DateTime", correct: false }
          - { value: "It emits a deprecation but works", correct: false }
          - { value: "It is a parse error", correct: false }
        explanation: >-
          Unqualified class names resolve only against the current namespace and use
          imports — there is no global fallback for classes — so PHP looks for
          App\\DateTime and throws a not-found Error. It does not silently use the
          global class, there is no deprecation path, and it parses fine (the error
          is at resolution/runtime). Fix with `new \\DateTime()` or
          `use DateTime;`. Misconception: expecting the function-style global
          fallback for classes.
        documentation: "https://www.php.net/manual/en/language.namespaces.rules.php"

      - id: "PHP-NS-09"
        question: "What does `use function App\\Support\\slugify;` at the top of a file do?"
        type: "code"
        difficulty: "medium"
        subchapter: "php-web-security/namespaces"
        concepts: ["use-function", "import", "name-resolution"]
        syllabus: "PHP → Namespaces"
        answers:
          - { value: "Aliases the namespaced function so you can call slugify() unqualified", correct: true }
          - { value: "Imports a class named slugify", correct: false }
          - { value: "Defines a new function slugify", correct: false }
          - { value: "Is invalid — only classes can be imported", correct: false }
        explanation: >-
          `use function` imports a namespaced function so it can be called
          unqualified; likewise `use const` imports constants. It does not import a
          class (that is a plain use), it does not define anything, and function
          imports are entirely valid. Misconception: believing use only works for
          classes — the function and const forms exist precisely because of the
          global fallback rules.
        documentation: "https://www.php.net/manual/en/language.namespaces.importing.php"

  - name: "Interfaces & Type Declarations"
    questions:
      - id: "PHP-IFACE-01"
        question: "A child overrides a method whose parent return type is `Animal`. Which return type is legal?"
        type: "single"
        difficulty: "medium"
        subchapter: "php-web-security/interfaces"
        concepts: ["covariance", "return-type", "lsp"]
        syllabus: "PHP → Interfaces"
        answers:
          - { value: "Cat, a subclass of Animal (covariant return)", correct: true }
          - { value: "object (wider than Animal)", correct: false }
          - { value: "mixed", correct: false }
          - { value: "A union that adds an unrelated type", correct: false }
        explanation: >-
          Return types are covariant, so a child may return a more specific
          (narrower) type such as Cat, but never a wider one. object and mixed are
          both wider than Animal and would break substitutability, and adding an
          unrelated union member also widens the return. Misconception: reversing
          the rule — parameters (not returns) are the ones that may widen.
        documentation: "https://www.php.net/manual/en/language.oop5.variance.php"

      - id: "PHP-IFACE-02"
        question: "Intersection types such as `A&B` may combine…"
        type: "single"
        difficulty: "medium"
        subchapter: "php-web-security/interfaces"
        concepts: ["intersection-types", "object-types", "declarations"]
        syllabus: "PHP → Interfaces"
        answers:
          - { value: "Only class or interface types", correct: true }
          - { value: "Any mix of scalars and classes", correct: false }
          - { value: "Only scalar types", correct: false }
          - { value: "Only enums", correct: false }
        explanation: >-
          Intersection types require object (class/interface) types, because a value
          must satisfy all members simultaneously — a scalar cannot be two class
          types at once. Scalars and enum-only restrictions are therefore wrong.
          Misconception: writing `int&string`, which is meaningless and a compile
          error; use unions for alternatives among scalars.
        documentation: "https://www.php.net/manual/en/language.types.declarations.php"

      - id: "PHP-IFACE-03"
        question: "What does `'text' instanceof SomeClass` evaluate to?"
        type: "single"
        difficulty: "easy"
        subchapter: "php-web-security/interfaces"
        concepts: ["instanceof", "type-check", "non-object"]
        syllabus: "PHP → Interfaces"
        answers:
          - { value: "false", correct: true }
          - { value: "A TypeError", correct: false }
          - { value: "true", correct: false }
          - { value: "null", correct: false }
        explanation: >-
          instanceof on a non-object simply returns false; it never throws and never
          returns null or true for a string. This makes it safe to use as a guard
          without first checking is_object(). Misconception: assuming instanceof
          errors on scalars — it is deliberately total, returning false for anything
          that is not an instance.
        documentation: "https://www.php.net/manual/en/language.operators.type.php"

      - id: "PHP-IFACE-04"
        question: "Can a single class implement two interfaces that declare the same method signature?"
        type: "single"
        difficulty: "medium"
        subchapter: "php-web-security/interfaces"
        concepts: ["interfaces", "multiple-implementation", "signatures"]
        syllabus: "PHP → Interfaces"
        answers:
          - { value: "Yes, one compatible implementation satisfies both", correct: true }
          - { value: "No, it is always a conflict", correct: false }
          - { value: "Only using insteadof", correct: false }
          - { value: "Only for static methods", correct: false }
        explanation: >-
          Identical or compatible signatures are not a conflict; a single method
          body fulfils both contracts. It is not always a conflict, insteadof is a
          trait mechanism (not for interfaces), and it applies to instance methods
          too. Misconception: importing the trait-collision rules into interfaces —
          interfaces only demand a compatible signature, they carry no bodies to
          clash.
        documentation: "https://www.php.net/manual/en/language.oop5.interfaces.php"

      - id: "PHP-IFACE-05"
        question: "A parent method is `handle(Cat $c)`. Which override signature is legal under contravariance?"
        type: "trap"
        difficulty: "hard"
        subchapter: "php-web-security/interfaces"
        concepts: ["contravariance", "parameter-type", "lsp"]
        syllabus: "PHP → Interfaces"
        answers:
          - { value: "handle(Animal $c) — widening the parameter is allowed", correct: true }
          - { value: "handle(Kitten $c) — narrowing the parameter", correct: false }
          - { value: "handle(string $c) — an unrelated type", correct: false }
          - { value: "handle() — dropping the parameter", correct: false }
        explanation: >-
          Parameter types are contravariant: a child may accept a wider (more
          general) type such as Animal, preserving substitutability. Narrowing to
          Kitten would reject values the parent accepted (illegal), an unrelated type
          breaks the contract, and dropping a required parameter changes arity.
          Misconception: applying the covariant (narrowing) rule to parameters —
          returns narrow, parameters widen.
        documentation: "https://www.php.net/manual/en/language.oop5.variance.php"

      - id: "PHP-IFACE-06"
        question: "True or False: an interface may declare (non-constant) properties."
        type: "true-false"
        difficulty: "easy"
        subchapter: "php-web-security/interfaces"
        concepts: ["interfaces", "properties", "constants"]
        syllabus: "PHP → Interfaces"
        answers:
          - { value: "False", correct: true }
          - { value: "True", correct: false }
        explanation: >-
          Interfaces are pure contracts: they may declare method signatures and
          constants (typed since 8.3) but never properties, because they carry no
          state. If you need shared state, use an abstract class. Misconception:
          treating an interface like an abstract class — only abstract classes hold
          properties and a constructor.
        documentation: "https://www.php.net/manual/en/language.oop5.interfaces.php"

      - id: "PHP-IFACE-07"
        question: "A parent declares `serialize(): string`. Is overriding it with `serialize(): never` legal?"
        type: "internals"
        difficulty: "hard"
        subchapter: "php-web-security/interfaces"
        concepts: ["never", "bottom-type", "covariance"]
        syllabus: "PHP → Interfaces"
        answers:
          - { value: "Yes — never is the bottom type and is a valid covariant return", correct: true }
          - { value: "No — never is unrelated to string", correct: false }
          - { value: "No — never can only be used on void methods", correct: false }
          - { value: "Only if the parent also returns never", correct: false }
        explanation: >-
          never is the bottom type: a method that always throws or exits satisfies
          any return contract, so `: never` is a valid covariant narrowing of
          `: string`. never is not unrelated (it is a subtype of every type), it is
          not restricted to void methods, and the parent need not also return never.
          Misconception: thinking never only marks infinite loops/exit; it is a
          genuine type in the variance lattice.
        documentation: "https://www.php.net/manual/en/language.types.declarations.php"

      - id: "PHP-IFACE-08"
        question: "What does the type declaration `(Countable&Traversable)|null` require of an argument?"
        type: "code"
        difficulty: "medium"
        subchapter: "php-web-security/interfaces"
        concepts: ["dnf-types", "intersection", "union"]
        syllabus: "PHP → Interfaces"
        answers:
          - { value: "An object implementing both Countable and Traversable, or null", correct: true }
          - { value: "An object implementing either Countable or Traversable", correct: false }
          - { value: "Any countable scalar or null", correct: false }
          - { value: "Only null", correct: false }
        explanation: >-
          A DNF type groups the intersection: the value must implement both
          interfaces (the & group) OR be null. "Either/or" describes a plain union,
          which this is not inside the parentheses. Scalars cannot satisfy an
          interface intersection, and it clearly accepts non-null objects too.
          Misconception: reading the | as applying to each interface individually
          rather than to the whole parenthesised group.
        documentation: "https://www.php.net/manual/en/language.types.declarations.php"

      - id: "PHP-IFACE-09"
        question: "Which statements about interfaces are correct? (choose two)"
        type: "multiple"
        difficulty: "medium"
        subchapter: "php-web-security/interfaces"
        concepts: ["interfaces", "multiple-inheritance", "typed-constants"]
        syllabus: "PHP → Interfaces"
        answers:
          - { value: "An interface may extend several parent interfaces", correct: true }
          - { value: "Interface constants may be typed since PHP 8.3", correct: true }
          - { value: "An interface may provide a default method body", correct: false }
          - { value: "A class may implement only one interface", correct: false }
        explanation: >-
          Interfaces support multiple `extends` (multiple inheritance of type) and,
          since 8.3, typed constants. They never carry method bodies (that is a
          trait/abstract class feature — PHP has no default interface methods), and a
          class may implement many interfaces. Misconception: importing "default
          methods" from other languages — PHP interfaces are body-less.
        documentation: "https://www.php.net/manual/en/language.oop5.interfaces.php"

      - id: "PHP-IFACE-10"
        question: "An interface declares `const string VERSION`. An implementing class overrides it with `const int VERSION = 8;`. What happens?"
        type: "trap"
        difficulty: "hard"
        subchapter: "php-web-security/interfaces"
        concepts: ["typed-constants", "php83", "override"]
        syllabus: "PHP → Interfaces"
        answers:
          - { value: "A fatal error — the overriding constant must keep a compatible (string) type", correct: true }
          - { value: "It works; constant types are advisory only", correct: false }
          - { value: "It works; the int is coerced to a string", correct: false }
          - { value: "A deprecation notice, then it works", correct: false }
        explanation: >-
          Typed class constants (8.3) enforce the declared type on overrides, so
          redeclaring a string constant as int is a fatal type error. Types are not
          advisory, there is no silent coercion of the constant value, and it is a
          hard error, not a deprecation. Misconception: assuming interface constants
          can be freely overridden — untyped ones can vary in value, but a typed
          constant pins the type.
        documentation: "https://www.php.net/manual/en/language.oop5.constants.php"

  - name: "Anonymous Functions & Closures"
    questions:
      - id: "PHP-CLOSURE-01"
        question: "When does `function () use ($x) {}` capture the value of `$x`?"
        type: "single"
        difficulty: "easy"
        subchapter: "php-web-security/closures"
        concepts: ["closures", "use", "capture-by-value"]
        syllabus: "PHP → Anonymous functions & closures"
        answers:
          - { value: "At definition time, by value", correct: true }
          - { value: "At call time", correct: false }
          - { value: "Always by reference", correct: false }
          - { value: "It reads the live variable", correct: false }
        explanation: >-
          use captures by value at the moment the closure is defined, taking a
          snapshot; it is not captured at call time and does not track the live
          variable. To share and observe later mutations, capture by reference with
          `use (&$x)`. Misconception: expecting a closure to see a variable's value
          as it is when the closure runs — the value is frozen at definition.
        documentation: "https://www.php.net/manual/en/functions.anonymous.php"

      - id: "PHP-CLOSURE-02"
        question: "Which statement about arrow functions (fn) is true?"
        type: "single"
        difficulty: "medium"
        subchapter: "php-web-security/closures"
        concepts: ["arrow-functions", "auto-capture", "by-value"]
        syllabus: "PHP → Anonymous functions & closures"
        answers:
          - { value: "They auto-capture the enclosing scope by value", correct: true }
          - { value: "They require an explicit use list", correct: false }
          - { value: "They can capture by reference", correct: false }
          - { value: "They may contain multiple statements", correct: false }
        explanation: >-
          Arrow functions auto-capture used outer variables by value and consist of
          a single expression. They have no use list (that is what "auto" means),
          cannot capture by reference, and cannot hold multiple statements — use a
          full closure for that. Misconception: expecting fn to behave like a full
          closure with `use (&...)`; it is deliberately restricted.
        documentation: "https://www.php.net/manual/en/functions.arrow.php"

      - id: "PHP-CLOSURE-03"
        question: "What does `Closure::bind($c, $obj, Foo::class)` return?"
        type: "single"
        difficulty: "medium"
        subchapter: "php-web-security/closures"
        concepts: ["closure-bind", "scope", "this"]
        syllabus: "PHP → Anonymous functions & closures"
        answers:
          - { value: "A new closure bound to $obj with Foo's scope", correct: true }
          - { value: "void; it mutates $c in place", correct: false }
          - { value: "The result of invoking $c", correct: false }
          - { value: "A callable string", correct: false }
        explanation: >-
          Closure::bind is static and returns a new closure; the original $c is
          unchanged (closures are immutable in their binding). The scope argument
          (Foo::class) grants access to Foo's private/protected members. It does not
          invoke the closure or produce a string. Misconception: thinking bind
          mutates the closure in place — always assign the returned closure.
        documentation: "https://www.php.net/manual/en/closure.bind.php"

      - id: "PHP-CLOSURE-04"
        question: "What does the expression `trim(...)` produce?"
        type: "single"
        difficulty: "easy"
        subchapter: "php-web-security/closures"
        concepts: ["first-class-callable", "closure", "php81"]
        syllabus: "PHP → Anonymous functions & closures"
        answers:
          - { value: "A Closure wrapping the trim function", correct: true }
          - { value: "The string 'trim'", correct: false }
          - { value: "The trimmed result", correct: false }
          - { value: "A parse error in PHP 8.4", correct: false }
        explanation: >-
          First-class callable syntax (8.1+) turns any callable into a Closure, so
          trim(...) yields a Closure object. It is not the string 'trim', it does not
          call trim (no argument is passed), and it is valid syntax in 8.4. It is the
          type-safe modern replacement for 'trim' or Closure::fromCallable('trim').
          Misconception: reading `(...)` as an immediate call.
        documentation: "https://www.php.net/manual/en/functions.first_class_callable_syntax.php"

      - id: "PHP-CLOSURE-05"
        question: "`$base=10; $v=fn($n)=>$n+$base; $r=function($n)use(&$base){return $n+$base;}; $base=100;` — what are `$v(1)` and `$r(1)`?"
        type: "code"
        difficulty: "medium"
        subchapter: "php-web-security/closures"
        concepts: ["capture-by-value", "capture-by-reference", "arrow-functions"]
        syllabus: "PHP → Anonymous functions & closures"
        answers:
          - { value: "11 and 101", correct: true }
          - { value: "101 and 101", correct: false }
          - { value: "11 and 11", correct: false }
          - { value: "101 and 11", correct: false }
        explanation: >-
          The arrow function captured $base by value at definition (10), so
          $v(1)=11 regardless of the later reassignment. The full closure captured
          by reference (&$base), so it sees $base=100 and returns 101. Both-101
          ignores the by-value snapshot; both-11 ignores the reference; the last
          option swaps them. Misconception: assuming fn tracks later mutations —
          only `use (&$x)` does.
        documentation: "https://www.php.net/manual/en/functions.arrow.php"

      - id: "PHP-CLOSURE-06"
        question: "A closure reads `$this->secret` (a private property). What determines whether that access succeeds?"
        type: "trap"
        difficulty: "medium"
        subchapter: "php-web-security/closures"
        concepts: ["closure-scope", "binding", "private-access"]
        syllabus: "PHP → Anonymous functions & closures"
        answers:
          - { value: "The closure's bound scope, set at creation or via bindTo/bind", correct: true }
          - { value: "The location where the closure is invoked", correct: false }
          - { value: "Whether the property is declared readonly", correct: false }
          - { value: "The visibility of the calling function", correct: false }
        explanation: >-
          A closure's access to private/protected members depends on its scope,
          fixed when it is created (inside a method) or reassigned via
          bindTo/bind/call — not on where it is later called. readonly governs
          writes, not read access, and the caller's own visibility is irrelevant.
          Misconception: thinking private access is decided at the call site — it is
          the closure's scope that matters.
        documentation: "https://www.php.net/manual/en/closure.bindto.php"

      - id: "PHP-CLOSURE-07"
        question: "How do `Closure::bind`, `$c->bindTo` and `$c->call` differ?"
        type: "internals"
        difficulty: "hard"
        subchapter: "php-web-security/closures"
        concepts: ["closure-bind", "bindTo", "call"]
        syllabus: "PHP → Anonymous functions & closures"
        answers:
          - { value: "bind (static) and bindTo (instance) return a new bound closure; call binds and invokes in one step", correct: true }
          - { value: "All three invoke the closure immediately", correct: false }
          - { value: "All three mutate the original closure in place", correct: false }
          - { value: "call returns a new closure without invoking it", correct: false }
        explanation: >-
          bind is the static form and bindTo the instance form; both return a fresh
          bound closure without calling it. call binds a new $this and scope and
          invokes immediately, returning the result. Only call runs the closure, none
          mutate the original (closures are immutable in their binding), and call
          does not return an un-invoked closure. Misconception: expecting bindTo to
          also execute — it only rebinds.
        documentation: "https://www.php.net/manual/en/closure.call.php"

      - id: "PHP-CLOSURE-08"
        question: "True or False: an arrow function can capture an outer variable by reference."
        type: "true-false"
        difficulty: "easy"
        subchapter: "php-web-security/closures"
        concepts: ["arrow-functions", "capture", "by-reference"]
        syllabus: "PHP → Anonymous functions & closures"
        answers:
          - { value: "False", correct: true }
          - { value: "True", correct: false }
        explanation: >-
          Arrow functions always auto-capture by value and have no mechanism for
          by-reference capture (no use list, no `&`). If you need a reference, use a
          full closure with `use (&$x)`. Misconception: assuming fn is just shorter
          syntax with the same power — it is intentionally limited to by-value,
          single-expression bodies.
        documentation: "https://www.php.net/manual/en/functions.arrow.php"

      - id: "PHP-CLOSURE-09"
        question: "`$reader = fn () => $this->secret; $bound = Closure::bind($reader, new Box(), Box::class); echo $bound();` where Box has `private $secret='hidden'`. Output?"
        type: "code"
        difficulty: "hard"
        subchapter: "php-web-security/closures"
        concepts: ["closure-bind", "scope", "private-access"]
        syllabus: "PHP → Anonymous functions & closures"
        answers:
          - { value: "hidden", correct: true }
          - { value: "An Error: cannot access private property", correct: false }
          - { value: "null", correct: false }
          - { value: "An empty string", correct: false }
        explanation: >-
          Passing Box::class as the scope grants the rebound closure access to Box's
          private property, so it prints "hidden". Without the scope argument the
          private read would fail — but here it is supplied, so no Error, no null,
          no empty string. Misconception: thinking $this alone grants access; you
          must also pass the scope to unlock private/protected members.
        documentation: "https://www.php.net/manual/en/closure.bind.php"

      - id: "PHP-CLOSURE-10"
        question: "A closure captures `use ($id)` when $id='A', then $id is set to 'B' before the closure runs. What does it see?"
        type: "scenario"
        difficulty: "medium"
        subchapter: "php-web-security/closures"
        concepts: ["capture-by-value", "use", "closures"]
        syllabus: "PHP → Anonymous functions & closures"
        answers:
          - { value: "'A' — the value snapshotted at definition time", correct: true }
          - { value: "'B' — the current value at call time", correct: false }
          - { value: "null — captured variables are reset", correct: false }
          - { value: "It throws because $id changed", correct: false }
        explanation: >-
          `use ($id)` captures by value when the closure is defined, so it keeps 'A'
          even though $id later becomes 'B'. To observe the update you would capture
          by reference `use (&$id)`. Captured variables are not reset to null, and
          reassigning the outer variable never throws. Misconception: treating use
          like a live binding rather than a snapshot.
        documentation: "https://www.php.net/manual/en/functions.anonymous.php"

  - name: "Abstract Classes"
    questions:
      - id: "PHP-ABSTRACT-01"
        question: "A concrete class inherits an abstract method but does not implement it. What happens?"
        type: "single"
        difficulty: "easy"
        subchapter: "php-web-security/abstract-classes"
        concepts: ["abstract-method", "compile-error", "inheritance"]
        syllabus: "PHP → Abstract classes"
        answers:
          - { value: "Fatal error unless the class itself is declared abstract", correct: true }
          - { value: "It silently returns null", correct: false }
          - { value: "It runs normally", correct: false }
          - { value: "A deprecation notice", correct: false }
        explanation: >-
          Any unimplemented abstract method forces the class to be abstract too;
          otherwise PHP raises a fatal error. It never silently returns null or runs
          normally, and it is a hard error not a deprecation. Misconception: assuming
          an unimplemented abstract method is merely optional — a concrete class must
          implement every inherited abstract method.
        documentation: "https://www.php.net/manual/en/language.oop5.abstract.php"

      - id: "PHP-ABSTRACT-02"
        question: "Which feature can an abstract class have that an interface cannot?"
        type: "single"
        difficulty: "medium"
        subchapter: "php-web-security/abstract-classes"
        concepts: ["abstract-class", "interface", "state"]
        syllabus: "PHP → Abstract classes"
        answers:
          - { value: "Properties and a constructor", correct: true }
          - { value: "Multiple parents", correct: false }
          - { value: "Public method signatures", correct: false }
          - { value: "Constants", correct: false }
        explanation: >-
          Abstract classes can hold state (properties) and a constructor; interfaces
          are pure contracts and can hold neither. Neither supports multiple parents
          (only interfaces allow multiple extends of interfaces), both can declare
          public method signatures, and both can hold constants. Misconception:
          thinking abstract classes are just interfaces with bodies — they add state
          and construction.
        documentation: "https://www.php.net/manual/en/language.oop5.interfaces.php"

      - id: "PHP-ABSTRACT-03"
        question: "How many abstract classes can a class extend?"
        type: "single"
        difficulty: "easy"
        subchapter: "php-web-security/abstract-classes"
        concepts: ["inheritance", "single-inheritance", "abstract-class"]
        syllabus: "PHP → Abstract classes"
        answers:
          - { value: "Exactly one", correct: true }
          - { value: "Any number", correct: false }
          - { value: "Zero", correct: false }
          - { value: "Two", correct: false }
        explanation: >-
          PHP has single class inheritance, so a class extends exactly one class
          (abstract or not). Interfaces provide multiple type inheritance instead.
          "Zero" is wrong for a class that does extend one, and "two" contradicts
          single inheritance. Misconception: hoping abstract classes offer
          multiple inheritance — they do not; compose or use interfaces/traits.
        documentation: "https://www.php.net/manual/en/language.oop5.inheritance.php"

      - id: "PHP-ABSTRACT-04"
        question: "`abstract class A {} new A();` — what does this produce?"
        type: "debug"
        difficulty: "medium"
        subchapter: "php-web-security/abstract-classes"
        concepts: ["abstract-class", "instantiation", "fatal-error"]
        syllabus: "PHP → Abstract classes"
        answers:
          - { value: "A fatal Error: Cannot instantiate abstract class A", correct: true }
          - { value: "An empty instance of A", correct: false }
          - { value: "null", correct: false }
          - { value: "A parse error", correct: false }
        explanation: >-
          Abstract classes cannot be instantiated directly; `new A()` throws a fatal
          Error at runtime. It does not create an instance or return null, and it
          parses fine (the failure is at instantiation). Instantiate a concrete
          subclass instead. Misconception: thinking an abstract class with no
          abstract methods can still be new-ed — the abstract keyword alone blocks it.
        documentation: "https://www.php.net/manual/en/language.oop5.abstract.php"

      - id: "PHP-ABSTRACT-05"
        question: "In the template method pattern, why is the public skeleton method often marked `final`?"
        type: "internals"
        difficulty: "hard"
        subchapter: "php-web-security/abstract-classes"
        concepts: ["template-method", "final", "abstract-hook"]
        syllabus: "PHP → Abstract classes"
        answers:
          - { value: "To stop subclasses overriding the algorithm skeleton, restricting them to the abstract hooks", correct: true }
          - { value: "To allow subclasses to replace the whole algorithm", correct: false }
          - { value: "Because abstract methods must be final", correct: false }
          - { value: "To make the class instantiable", correct: false }
        explanation: >-
          The template method fixes the invariant algorithm and defers only the
          variable steps to abstract hooks; marking it final protects those
          invariants from being overridden. It does the opposite of allowing full
          replacement; abstract methods cannot be final (they must be overridden);
          and final has nothing to do with instantiability. Misconception: leaving
          the skeleton overridable, which lets subclasses break the pattern.
        documentation: "https://www.php.net/manual/en/language.oop5.abstract.php"

      - id: "PHP-ABSTRACT-06"
        question: "True or False: declaring `abstract public function run(): void {}` (with a body) is valid."
        type: "true-false"
        difficulty: "easy"
        subchapter: "php-web-security/abstract-classes"
        concepts: ["abstract-method", "parse-error", "body"]
        syllabus: "PHP → Abstract classes"
        answers:
          - { value: "False", correct: true }
          - { value: "True", correct: false }
        explanation: >-
          An abstract method declares a signature only and must not have a body;
          adding `{}` is a parse error. If you want a default body, drop abstract and
          make it a concrete (optionally overridable) method. Misconception:
          confusing an abstract method (no body, must be implemented) with a concrete
          method that happens to be empty.
        documentation: "https://www.php.net/manual/en/language.oop5.abstract.php"

      - id: "PHP-ABSTRACT-07"
        question: "`abstract class Exporter { abstract protected function format(array $d): string; final public function export(array $d): string { return 'BEGIN'.$this->format($d).'END'; } }` — what role does export() play?"
        type: "code"
        difficulty: "medium"
        subchapter: "php-web-security/abstract-classes"
        concepts: ["template-method", "abstract-hook", "final"]
        syllabus: "PHP → Abstract classes"
        answers:
          - { value: "It is the template method: a fixed skeleton calling the abstract hook format()", correct: true }
          - { value: "It is an abstract hook subclasses must implement", correct: false }
          - { value: "It is a static factory", correct: false }
          - { value: "It is invalid because it calls an abstract method", correct: false }
        explanation: >-
          export() is a concrete, final template method that defines the fixed
          wrapping and defers the variable step to the abstract format() hook — a
          textbook template method. It is not itself abstract (it has a body), not a
          factory, and calling an abstract method from a concrete one is perfectly
          legal because concrete subclasses supply format(). Misconception: thinking
          you cannot call an abstract method internally.
        documentation: "https://www.php.net/manual/en/language.oop5.abstract.php"

      - id: "PHP-ABSTRACT-08"
        question: "You need several unrelated classes to share only a contract (no state, and some already extend other classes). Which do you choose?"
        type: "scenario"
        difficulty: "medium"
        subchapter: "php-web-security/abstract-classes"
        concepts: ["interface", "abstract-class", "design"]
        syllabus: "PHP → Abstract classes"
        answers:
          - { value: "An interface — it needs no state and allows multiple type inheritance", correct: true }
          - { value: "An abstract class — it is always preferable", correct: false }
          - { value: "A trait — it can be type-hinted", correct: false }
          - { value: "A final class they all extend", correct: false }
        explanation: >-
          An interface fits: no shared state is needed and classes can implement many
          interfaces even while extending another class. An abstract class would
          consume the single inheritance slot some classes already use. A trait is
          not a type (cannot be type-hinted). A final class cannot be extended at all.
          Misconception: reaching for an abstract class by default when only a
          contract is required.
        documentation: "https://www.php.net/manual/en/language.oop5.interfaces.php"

      - id: "PHP-ABSTRACT-09"
        question: "Which statements about abstract classes are correct? (choose two)"
        type: "multiple"
        difficulty: "hard"
        subchapter: "php-web-security/abstract-classes"
        concepts: ["abstract-class", "variance", "constructor"]
        syllabus: "PHP → Abstract classes"
        answers:
          - { value: "A single abstract method forces the whole class to be abstract", correct: true }
          - { value: "An overriding method must obey variance rules (covariant return, contravariant params)", correct: true }
          - { value: "An abstract class cannot define a constructor", correct: false }
          - { value: "An abstract class can be instantiated if it has no abstract methods", correct: false }
        explanation: >-
          One abstract method makes the class abstract, and implementations of an
          abstract method must respect variance just like interface/parent overrides.
          Abstract classes can define constructors (called via parent::__construct in
          subclasses), and the abstract keyword blocks instantiation regardless of
          whether abstract methods exist. Misconception: thinking a body-less-method
          count or constructor presence changes instantiability.
        documentation: "https://www.php.net/manual/en/language.oop5.abstract.php"

  - name: "Traits"
    questions:
      - id: "PHP-TRAIT-01"
        question: "A class, its parent, and a used trait all define `run()`. Which implementation is used?"
        type: "single"
        difficulty: "medium"
        subchapter: "php-web-security/traits"
        concepts: ["traits", "precedence", "inheritance"]
        syllabus: "PHP → Traits"
        answers:
          - { value: "The class's own run()", correct: true }
          - { value: "The trait's run()", correct: false }
          - { value: "The parent's run()", correct: false }
          - { value: "It is a fatal error", correct: false }
        explanation: >-
          Precedence is class method > trait method > inherited parent method, so the
          class's own run() wins. The trait would only win over the inherited parent
          (not over the class itself), the parent is lowest priority, and this is not
          an error because there is a clear winner. Misconception: assuming a trait
          overrides everything — it overrides the parent but not the using class's own
          method.
        documentation: "https://www.php.net/manual/en/language.oop5.traits.php"

      - id: "PHP-TRAIT-02"
        question: "Two used traits define the same method and you add no resolution. Result?"
        type: "single"
        difficulty: "medium"
        subchapter: "php-web-security/traits"
        concepts: ["traits", "conflict", "fatal-error"]
        syllabus: "PHP → Traits"
        answers:
          - { value: "Fatal error", correct: true }
          - { value: "The first trait wins", correct: false }
          - { value: "The last trait wins", correct: false }
          - { value: "Both run in sequence", correct: false }
        explanation: >-
          Unresolved trait method collisions are a fatal error; PHP does not pick
          first or last, and it never chains both. Resolve with `insteadof` (choose
          one) and optionally `as` (alias the other). Misconception: expecting a
          silent ordering rule like some languages — PHP forces explicit resolution.
        documentation: "https://www.php.net/manual/en/language.oop5.traits.php"

      - id: "PHP-TRAIT-03"
        question: "A `static` property declared in a trait, used by classes X and Y, is…"
        type: "single"
        difficulty: "hard"
        subchapter: "php-web-security/traits"
        concepts: ["traits", "static-property", "per-class"]
        syllabus: "PHP → Traits"
        answers:
          - { value: "Separate per using class (X and Y have independent copies)", correct: true }
          - { value: "Shared across X and Y", correct: false }
          - { value: "Illegal", correct: false }
          - { value: "Automatically read-only", correct: false }
        explanation: >-
          Traits are copied into each using class at compile time, so a static
          property becomes a distinct static of X and of Y — not shared across them.
          Static trait members are legal and not implicitly read-only. Misconception:
          treating the trait as a single shared owner of the static state; the trait
          is a template, not a runtime container.
        documentation: "https://www.php.net/manual/en/language.oop5.traits.php"

      - id: "PHP-TRAIT-04"
        question: "What does `LoggerTrait::log as protected writeLog;` do?"
        type: "single"
        difficulty: "medium"
        subchapter: "php-web-security/traits"
        concepts: ["traits", "as", "alias-visibility"]
        syllabus: "PHP → Traits"
        answers:
          - { value: "Aliases the method to writeLog with protected visibility", correct: true }
          - { value: "Deletes the log method", correct: false }
          - { value: "Makes log abstract", correct: false }
          - { value: "Makes log static", correct: false }
        explanation: >-
          The `as` operator can rename a trait method and change its visibility at
          once, creating protected writeLog. The original log remains available (it
          is not deleted), and as never changes a method to abstract or static.
          Misconception: thinking `as` replaces the original — it adds an alias; use
          `insteadof` to exclude a colliding version.
        documentation: "https://www.php.net/manual/en/language.oop5.traits.php"

      - id: "PHP-TRAIT-05"
        question: "Traits A and B both define `init()`. You want A's version kept and B's exposed as `initLegacy()`. Which resolution is correct?"
        type: "code"
        difficulty: "hard"
        subchapter: "php-web-security/traits"
        concepts: ["traits", "insteadof", "as"]
        syllabus: "PHP → Traits"
        answers:
          - { value: "use A, B { A::init insteadof B; B::init as initLegacy; }", correct: true }
          - { value: "use A, B { B::init insteadof A; A::init as initLegacy; }", correct: false }
          - { value: "use A, B { A::init as initLegacy insteadof B; }", correct: false }
          - { value: "use A, B { init insteadof A, B; }", correct: false }
        explanation: >-
          insteadof selects A::init as the surviving init(), and as aliases the
          excluded B::init to initLegacy — exactly matching the requirement. The
          second option keeps B (wrong version). The third has invalid syntax mixing
          as and insteadof in one clause. The fourth lacks the trait qualifiers
          insteadof requires. Misconception: believing as alone resolves a collision
          — you still need insteadof to pick the winner.
        documentation: "https://www.php.net/manual/en/language.oop5.traits.php"

      - id: "PHP-TRAIT-06"
        question: "Why can you not write a type hint `function f(MyTrait $x)`?"
        type: "trap"
        difficulty: "medium"
        subchapter: "php-web-security/traits"
        concepts: ["traits", "not-a-type", "type-hint"]
        syllabus: "PHP → Traits"
        answers:
          - { value: "A trait is not a type; it is copied into classes and cannot be type-hinted or used with instanceof", correct: true }
          - { value: "Traits can only be hinted with the trait keyword", correct: false }
          - { value: "Only abstract traits can be type-hinted", correct: false }
          - { value: "You can, but only for static methods", correct: false }
        explanation: >-
          Traits provide horizontal code reuse but are not types, so they cannot
          appear in a type declaration or instanceof check. There is no trait
          hinting keyword, no "abstract trait" exception, and no static-only allowance.
          Pair a trait with an interface when callers need a type. Misconception:
          treating a trait like an interface — only the interface is the contract/type.
        documentation: "https://www.php.net/manual/en/language.oop5.traits.php"

      - id: "PHP-TRAIT-07"
        question: "What does declaring an `abstract` method inside a trait accomplish?"
        type: "internals"
        difficulty: "medium"
        subchapter: "php-web-security/traits"
        concepts: ["traits", "abstract-method", "contract"]
        syllabus: "PHP → Traits"
        answers:
          - { value: "It forces the using class to implement that method", correct: true }
          - { value: "It makes the trait instantiable", correct: false }
          - { value: "It has no effect; traits ignore abstract", correct: false }
          - { value: "It provides a default empty body", correct: false }
        explanation: >-
          An abstract trait method imposes a contract on the using class, which must
          provide an implementation — like an interface method but copied in. Traits
          are never instantiable, abstract is fully honoured inside traits, and an
          abstract method has no body. Misconception: assuming traits can only supply
          concrete methods — they can also demand methods from the host class.
        documentation: "https://www.php.net/manual/en/language.oop5.traits.php"

      - id: "PHP-TRAIT-08"
        question: "True or False: a trait can be instantiated directly with `new`."
        type: "true-false"
        difficulty: "easy"
        subchapter: "php-web-security/traits"
        concepts: ["traits", "instantiation", "compile-time"]
        syllabus: "PHP → Traits"
        answers:
          - { value: "False", correct: true }
          - { value: "True", correct: false }
        explanation: >-
          A trait is a compile-time code-reuse template, not a class or a type, so it
          cannot be instantiated; only a class that `use`s the trait can be. This is
          why traits are neither types nor objects. Misconception: viewing a trait as
          a lightweight class — it has no independent existence at runtime.
        documentation: "https://www.php.net/manual/en/language.oop5.traits.php"

      - id: "PHP-TRAIT-09"
        question: "What does `FileLogger::log as protected;` (no new name) do?"
        type: "config"
        difficulty: "medium"
        subchapter: "php-web-security/traits"
        concepts: ["traits", "as", "visibility"]
        syllabus: "PHP → Traits"
        answers:
          - { value: "Changes the visibility of log() to protected without renaming it", correct: true }
          - { value: "Creates an anonymous alias of log()", correct: false }
          - { value: "Removes log() from the class", correct: false }
          - { value: "Makes log() abstract", correct: false }
        explanation: >-
          `as` can be used purely to change visibility when no new name follows, so
          log() becomes protected but keeps its name. It is not an anonymous alias,
          does not remove the method, and does not make it abstract. Misconception:
          thinking as always renames — the alias name is optional, leaving only a
          visibility change.
        documentation: "https://www.php.net/manual/en/language.oop5.traits.php"

      - id: "PHP-TRAIT-10"
        question: "A class defines `save()`, and a trait it uses also defines `save()`. A developer expects the trait's version to run but gets the class's. Why?"
        type: "debug"
        difficulty: "hard"
        subchapter: "php-web-security/traits"
        concepts: ["traits", "precedence", "override"]
        syllabus: "PHP → Traits"
        answers:
          - { value: "The class's own method takes precedence over any trait method", correct: true }
          - { value: "It is undefined behaviour", correct: false }
          - { value: "The trait method should have won; this is a bug", correct: false }
          - { value: "A fatal error should have occurred", correct: false }
        explanation: >-
          Trait precedence is class > trait > inherited parent, so the class's own
          save() always overrides the trait's. This is defined, expected behaviour,
          not a bug or error. To use the trait's version, alias it with `as` (e.g.
          `Trait::save as saveViaTrait;`). Misconception: assuming a trait method
          overrides the host class's own method — it only overrides inherited ones.
        documentation: "https://www.php.net/manual/en/language.oop5.traits.php"

  - name: "Exception & Error Handling"
    questions:
      - id: "PHP-EXC-01"
        question: "Which catch clause catches BOTH a TypeError and a RuntimeException?"
        type: "single"
        difficulty: "medium"
        subchapter: "php-web-security/exceptions"
        concepts: ["throwable", "hierarchy", "catch"]
        syllabus: "PHP → Exception & error handling"
        answers:
          - { value: "catch (\\Throwable $e)", correct: true }
          - { value: "catch (\\Exception $e)", correct: false }
          - { value: "catch (\\Error $e)", correct: false }
          - { value: "catch (\\LogicException $e)", correct: false }
        explanation: >-
          Throwable is the only common ancestor of both Error (TypeError) and
          Exception (RuntimeException). catch(\\Exception) misses the TypeError,
          catch(\\Error) misses the RuntimeException, and LogicException catches
          neither. Misconception: assuming \\Exception is the root of everything — it
          is not; \\Throwable is.
        documentation: "https://www.php.net/manual/en/class.throwable.php"

      - id: "PHP-EXC-02"
        question: "A `return` inside a `finally` block…"
        type: "single"
        difficulty: "hard"
        subchapter: "php-web-security/exceptions"
        concepts: ["finally", "return", "control-flow"]
        syllabus: "PHP → Exception & error handling"
        answers:
          - { value: "Overrides any return or throw from the try block", correct: true }
          - { value: "Is a syntax error", correct: false }
          - { value: "Is ignored", correct: false }
          - { value: "Runs before the try block", correct: false }
        explanation: >-
          finally always runs last, and a return there wins — it overrides both a
          return and a pending throw from try, which is why it can silently swallow
          exceptions and is discouraged. It is valid syntax, never ignored, and
          finally runs after try, not before. Misconception: thinking finally is just
          cleanup that cannot alter the result — a return in it changes the outcome.
        documentation: "https://www.php.net/manual/en/language.exceptions.php"

      - id: "PHP-EXC-03"
        question: "What can `set_error_handler()` intercept?"
        type: "single"
        difficulty: "medium"
        subchapter: "php-web-security/exceptions"
        concepts: ["error-handler", "error-levels", "warnings"]
        syllabus: "PHP → Exception & error handling"
        answers:
          - { value: "Traditional warnings, notices and deprecations", correct: true }
          - { value: "Uncaught exceptions", correct: false }
          - { value: "Fatal E_ERROR conditions", correct: false }
          - { value: "Parse errors", correct: false }
        explanation: >-
          It handles traditional (non-fatal) engine errors like warnings/notices/
          deprecations, often converting them to ErrorException. Uncaught exceptions
          go to set_exception_handler, and fatal E_ERROR/parse errors are caught via
          register_shutdown_function + error_get_last, not the error handler.
          Misconception: expecting one handler for both errors and exceptions — they
          are separate mechanisms.
        documentation: "https://www.php.net/manual/en/function.set-error-handler.php"

      - id: "PHP-EXC-04"
        question: "Under `declare(strict_types=1)`, passing a string to an int parameter throws…"
        type: "single"
        difficulty: "medium"
        subchapter: "php-web-security/exceptions"
        concepts: ["strict-types", "TypeError", "error"]
        syllabus: "PHP → Exception & error handling"
        answers:
          - { value: "TypeError (a subclass of Error)", correct: true }
          - { value: "InvalidArgumentException", correct: false }
          - { value: "Only a warning", correct: false }
          - { value: "ValueError", correct: false }
        explanation: >-
          Strict typing rejects the wrong scalar type with a TypeError, which extends
          Error (not Exception). It is not InvalidArgumentException (an application
          Exception you throw yourself), not a mere warning, and not ValueError
          (which signals a correctly-typed but out-of-range value). Misconception:
          expecting catch(\\Exception) to catch it — it is an Error, so use
          \\Throwable.
        documentation: "https://www.php.net/manual/en/language.types.declarations.php"

      - id: "PHP-EXC-05"
        question: "True or False: `catch (\\Exception $e)` will catch a `TypeError`."
        type: "true-false"
        difficulty: "easy"
        subchapter: "php-web-security/exceptions"
        concepts: ["throwable", "error", "exception"]
        syllabus: "PHP → Exception & error handling"
        answers:
          - { value: "False", correct: true }
          - { value: "True", correct: false }
        explanation: >-
          TypeError extends Error, and Error is a separate branch from Exception
          under Throwable, so catch(\\Exception) never catches it. To catch both
          branches use catch(\\Throwable). Misconception: believing Exception is the
          universal base type — Throwable is the interface both Error and Exception
          implement.
        documentation: "https://www.php.net/manual/en/class.throwable.php"

      - id: "PHP-EXC-06"
        question: "`try { intdiv(1, 0); } catch (\\Exception $e) { echo 'caught'; }` — what happens?"
        type: "code"
        difficulty: "medium"
        subchapter: "php-web-security/exceptions"
        concepts: ["DivisionByZeroError", "error", "catch"]
        syllabus: "PHP → Exception & error handling"
        answers:
          - { value: "The DivisionByZeroError is uncaught and the script fails", correct: true }
          - { value: "It prints 'caught'", correct: false }
          - { value: "It returns 0 silently", correct: false }
          - { value: "It prints a warning and continues", correct: false }
        explanation: >-
          intdiv(1, 0) throws DivisionByZeroError, which extends ArithmeticError →
          Error, not Exception — so the catch(\\Exception) block does not match and
          the error propagates uncaught. It does not print 'caught', does not return
          0, and modern PHP throws rather than warning. Fix by catching
          \\DivisionByZeroError or \\Throwable. Misconception: assuming division
          errors are Exceptions.
        documentation: "https://www.php.net/manual/en/class.divisionbyzeroerror.php"

      - id: "PHP-EXC-07"
        question: "In the Throwable hierarchy, which chain is correct?"
        type: "internals"
        difficulty: "hard"
        subchapter: "php-web-security/exceptions"
        concepts: ["throwable", "hierarchy", "DivisionByZeroError"]
        syllabus: "PHP → Exception & error handling"
        answers:
          - { value: "DivisionByZeroError → ArithmeticError → Error → Throwable", correct: true }
          - { value: "DivisionByZeroError → RuntimeException → Exception → Throwable", correct: false }
          - { value: "TypeError → Exception → Throwable", correct: false }
          - { value: "ValueError → LogicException → Throwable", correct: false }
        explanation: >-
          DivisionByZeroError extends ArithmeticError, which extends Error, which
          implements Throwable. The engine-fault classes (TypeError, ValueError,
          ArithmeticError) live under Error, never under Exception — so the other
          chains, which route them through Exception/RuntimeException/LogicException,
          are wrong. Misconception: mixing the Error and Exception branches; they
          share only the Throwable interface.
        documentation: "https://www.php.net/manual/en/class.throwable.php"

      - id: "PHP-EXC-08"
        question: "Does the `@` error-suppression operator stop a thrown exception from propagating?"
        type: "trap"
        difficulty: "medium"
        subchapter: "php-web-security/exceptions"
        concepts: ["error-suppression", "exceptions", "at-operator"]
        syllabus: "PHP → Exception & error handling"
        answers:
          - { value: "No — @ only mutes traditional errors/warnings, not thrown exceptions", correct: true }
          - { value: "Yes — @ swallows any exception silently", correct: false }
          - { value: "Yes, but only for Error subclasses", correct: false }
          - { value: "Only inside a try block", correct: false }
        explanation: >-
          @ suppresses the reporting of traditional errors (warnings/notices); a
          thrown exception still propagates and must be caught with try/catch. It
          does not swallow exceptions, does not special-case Error subclasses, and its
          behaviour is not tied to try blocks. Misconception: using @ as a catch-all
          — it only affects the legacy error-reporting path.
        documentation: "https://www.php.net/manual/en/language.operators.errorcontrol.php"

      - id: "PHP-EXC-09"
        question: "Which of these are `Error` subclasses rather than `Exception` subclasses? (choose two)"
        type: "multiple"
        difficulty: "medium"
        subchapter: "php-web-security/exceptions"
        concepts: ["error", "exception", "hierarchy"]
        syllabus: "PHP → Exception & error handling"
        answers:
          - { value: "TypeError", correct: true }
          - { value: "ValueError", correct: true }
          - { value: "RuntimeException", correct: false }
          - { value: "JsonException", correct: false }
        explanation: >-
          TypeError and ValueError extend Error (engine-level faults).
          RuntimeException and JsonException extend Exception (application-level
          conditions). The two branches meet only at the Throwable interface.
          Misconception: grouping ValueError with the application exceptions because
          it sounds like a validation issue — it is an Error thrown by the engine for
          out-of-range values.
        documentation: "https://www.php.net/manual/en/reserved.exceptions.php"

      - id: "PHP-EXC-10"
        question: "You catch a JsonException and rethrow with `throw new RuntimeException('Bad', previous: $e);`. Why pass `previous`?"
        type: "scenario"
        difficulty: "medium"
        subchapter: "php-web-security/exceptions"
        concepts: ["chaining", "previous", "getPrevious"]
        syllabus: "PHP → Exception & error handling"
        answers:
          - { value: "To preserve the root cause and its stack trace, retrievable via getPrevious()", correct: true }
          - { value: "It is required syntax for rethrowing", correct: false }
          - { value: "It suppresses the original exception", correct: false }
          - { value: "It merges the two messages automatically", correct: false }
        explanation: >-
          Passing the original as previous chains the exceptions, keeping the root
          cause and its trace accessible through getPrevious() — vital for debugging.
          It is optional, not required syntax; it does not suppress the original
          (it retains it) nor auto-merge messages. Misconception: discarding the
          caught exception when wrapping, which loses the original diagnostic trail.
        documentation: "https://www.php.net/manual/en/exception.getprevious.php"

  - name: "PHP Extensions"
    questions:
      - id: "PHP-EXT-01"
        question: "Which call reliably reports whether an extension is loaded?"
        type: "single"
        difficulty: "easy"
        subchapter: "php-web-security/extensions"
        concepts: ["extension_loaded", "detection", "runtime"]
        syllabus: "PHP → PHP extensions"
        answers:
          - { value: "extension_loaded('intl')", correct: true }
          - { value: "include 'intl'", correct: false }
          - { value: "require_extension('intl')", correct: false }
          - { value: "ini_get('intl')", correct: false }
        explanation: >-
          extension_loaded() returns a bool indicating whether the named module is
          loaded. include expects a file path (not a module), require_extension() is
          not a real function, and ini_get() reads an INI directive, not module
          presence. Misconception: guessing at helper names — the canonical runtime
          check is extension_loaded(), with function_exists()/class_exists() for
          specific symbols.
        documentation: "https://www.php.net/manual/en/function.extension-loaded.php"

      - id: "PHP-EXT-02"
        question: "For a UTF-8 string, `strlen('é')` returns…"
        type: "single"
        difficulty: "medium"
        subchapter: "php-web-security/extensions"
        concepts: ["mbstring", "strlen", "utf-8"]
        syllabus: "PHP → PHP extensions"
        answers:
          - { value: "2 (it counts bytes)", correct: true }
          - { value: "1", correct: false }
          - { value: "0", correct: false }
          - { value: "4", correct: false }
        explanation: >-
          strlen counts bytes, and 'é' is two bytes in UTF-8, so it returns 2. It is
          not 1 (that would be the character count via mb_strlen), not 0, and not 4.
          Use mb_strlen($s, 'UTF-8') for a character count. Misconception: assuming
          strlen is character-aware — it is byte-based, which breaks length checks on
          non-ASCII input.
        documentation: "https://www.php.net/manual/en/book.mbstring.php"

      - id: "PHP-EXT-03"
        question: "What does the opcache extension cache?"
        type: "single"
        difficulty: "easy"
        subchapter: "php-web-security/extensions"
        concepts: ["opcache", "bytecode", "performance"]
        syllabus: "PHP → PHP extensions"
        answers:
          - { value: "Compiled PHP bytecode in shared memory", correct: true }
          - { value: "Database query results", correct: false }
          - { value: "HTTP responses", correct: false }
          - { value: "Rendered Twig templates", correct: false }
        explanation: >-
          OPcache stores precompiled script bytecode in shared memory to skip
          recompilation on every request — the biggest production speedup. It is not
          an application data cache: query results, HTTP responses and rendered
          templates are cached by other layers. Misconception: treating OPcache as a
          general cache; it caches only opcodes, not your data.
        documentation: "https://www.php.net/manual/en/book.opcache.php"

      - id: "PHP-EXT-04"
        question: "How do you make `composer install` fail on a host lacking the intl extension?"
        type: "single"
        difficulty: "medium"
        subchapter: "php-web-security/extensions"
        concepts: ["composer", "platform-requirement", "ext"]
        syllabus: "PHP → PHP extensions"
        answers:
          - { value: "Add \"ext-intl\": \"*\" to the require section", correct: true }
          - { value: "Add it to the autoload section", correct: false }
          - { value: "Set an environment variable", correct: false }
          - { value: "Nothing; Composer detects it automatically", correct: false }
        explanation: >-
          ext-* platform requirements in require are verified at install time and
          fail fast when the extension is missing. autoload is for class maps, not
          platform gating; an env var does not enforce it; and Composer does not
          auto-require extensions your code happens to use. Misconception: expecting
          Composer to infer extension needs — you must declare them explicitly.
        documentation: "https://getcomposer.org/doc/articles/composer-platform-dependencies.md"

      - id: "PHP-EXT-05"
        question: "What is the classic gotcha with `ctype_digit(123)` (passing an integer)?"
        type: "trap"
        difficulty: "hard"
        subchapter: "php-web-security/extensions"
        concepts: ["ctype", "integer-as-ascii", "validation"]
        syllabus: "PHP → PHP extensions"
        answers:
          - { value: "Small integers are interpreted as ASCII codes, not their digits, giving surprising results", correct: true }
          - { value: "It always returns true for any integer", correct: false }
          - { value: "It throws a TypeError on integers", correct: false }
          - { value: "It converts the integer to a string first", correct: false }
        explanation: >-
          ctype functions treat an int argument in the range -128..255 as an ASCII
          character code, so ctype_digit(123) checks character code 123 ('{'), not
          the digits "123" — a false negative. It does not always return true, does
          not throw, and does not stringify (that is exactly the assumption that
          bites you). Pass strings: ctype_digit('123') is true. Misconception:
          assuming numeric arguments are auto-cast to their textual form.
        documentation: "https://www.php.net/manual/en/function.ctype-digit.php"

      - id: "PHP-EXT-06"
        question: "In composer.json, what does a `require` block listing `ext-mbstring`, `ext-intl`, `ext-ctype` enforce?"
        type: "config"
        difficulty: "medium"
        subchapter: "php-web-security/extensions"
        concepts: ["composer", "ext", "platform"]
        syllabus: "PHP → PHP extensions"
        answers:
          - { value: "install/update fails on any host missing those extensions", correct: true }
          - { value: "Composer downloads and installs the C extensions", correct: false }
          - { value: "The extensions are enabled only in dev", correct: false }
          - { value: "It disables Symfony polyfills", correct: false }
        explanation: >-
          Listing ext-* under require makes them platform requirements checked at
          install/update time, failing fast if absent. Composer cannot download or
          compile C extensions (they must exist on the host); the requirement is not
          dev-only; and it does not disable polyfills (polyfills are separate
          packages). Misconception: expecting Composer to provide the extension —
          ext-* only gates, it does not install.
        documentation: "https://getcomposer.org/doc/articles/composer-platform-dependencies.md"

      - id: "PHP-EXT-07"
        question: "What do `strlen('café')` and `mb_strlen('café', 'UTF-8')` return respectively?"
        type: "code"
        difficulty: "medium"
        subchapter: "php-web-security/extensions"
        concepts: ["mbstring", "strlen", "utf-8"]
        syllabus: "PHP → PHP extensions"
        answers:
          - { value: "5 and 4", correct: true }
          - { value: "4 and 4", correct: false }
          - { value: "4 and 5", correct: false }
          - { value: "5 and 5", correct: false }
        explanation: >-
          strlen counts bytes: 'é' is 2 bytes in UTF-8, so 'café' is 5 bytes.
          mb_strlen counts characters, giving 4. The other options assume both count
          the same way, which is the exact trap. Use mb_* for user-facing length
          checks. Misconception: believing strlen and mb_strlen are interchangeable
          on non-ASCII text.
        documentation: "https://www.php.net/manual/en/function.mb-strlen.php"

      - id: "PHP-EXT-08"
        question: "True or False: OPcache can be used as a cache for application data such as query results."
        type: "true-false"
        difficulty: "easy"
        subchapter: "php-web-security/extensions"
        concepts: ["opcache", "bytecode", "misconception"]
        syllabus: "PHP → PHP extensions"
        answers:
          - { value: "False", correct: true }
          - { value: "True", correct: false }
        explanation: >-
          OPcache caches only compiled bytecode (opcodes) in shared memory; it is not
          an application data store. For query results or computed values use a cache
          layer (APCu, Redis, Symfony Cache). Misconception: conflating the bytecode
          cache with a key/value data cache because both are "caches".
        documentation: "https://www.php.net/manual/en/book.opcache.php"

      - id: "PHP-EXT-09"
        question: "You deploy a code change to a server running `opcache.validate_timestamps=0` but forget to reset OPcache. What do requests serve?"
        type: "trap"
        difficulty: "hard"
        subchapter: "php-web-security/extensions"
        concepts: ["opcache", "validate_timestamps", "stale-bytecode"]
        syllabus: "PHP → PHP extensions"
        answers:
          - { value: "The stale, previously-cached bytecode — OPcache never notices the file changed", correct: true }
          - { value: "PHP automatically detects the mtime change and recompiles anyway", correct: false }
          - { value: "A fatal error, since validate_timestamps=0 requires a matching file hash", correct: false }
          - { value: "The new code, but only for the first request after the change", correct: false }
        explanation: >-
          With validate_timestamps=0, OPcache trusts its cached bytecode unconditionally
          and never stats the source file to check for changes — that stat-per-request
          is exactly what the setting removes for performance. Forgetting to reset/clear
          OPcache (or restart PHP-FPM) after a deploy means every request keeps serving
          the OLD compiled code indefinitely, silently, with no error. This is precisely
          why the setting is only safe for immutable deploys that reset OPcache as part
          of the release step (see the Deployment chapter's own question on why the
          setting exists in the first place).
        documentation: "https://www.php.net/manual/en/opcache.configuration.php"

  - name: "SPL"
    questions:
      - id: "PHP-SPL-01"
        question: "Which methods must a class implement to satisfy the Iterator interface?"
        type: "single"
        difficulty: "easy"
        subchapter: "php-web-security/spl"
        concepts: ["iterator", "interface", "foreach"]
        syllabus: "PHP → SPL"
        answers:
          - { value: "current, key, next, rewind, valid", correct: true }
          - { value: "getIterator only", correct: false }
          - { value: "count and offsetGet", correct: false }
          - { value: "next and prev", correct: false }
        explanation: >-
          Iterator defines exactly those five methods. getIterator() belongs to
          IteratorAggregate; count/offsetGet belong to Countable/ArrayAccess; and
          there is no prev() in the contract. Misconception: mixing Iterator with
          IteratorAggregate — the latter needs only getIterator(), which usually
          returns a generator.
        documentation: "https://www.php.net/manual/en/class.iterator.php"

      - id: "PHP-SPL-02"
        question: "Which statement about a generator is true?"
        type: "single"
        difficulty: "medium"
        subchapter: "php-web-security/spl"
        concepts: ["generator", "lazy", "single-use"]
        syllabus: "PHP → SPL"
        answers:
          - { value: "It is a single-use Iterator that produces values lazily", correct: true }
          - { value: "It builds the full array before returning", correct: false }
          - { value: "It can be rewound freely after iteration", correct: false }
          - { value: "It implements ArrayAccess", correct: false }
        explanation: >-
          A generator yields values lazily one at a time and is a built-in Iterator,
          but it is single-use: once consumed it cannot be rewound. It never
          materialises the whole sequence (that is its memory advantage) and does not
          implement ArrayAccess. Misconception: iterating a generator twice and
          expecting values the second time — it is exhausted.
        documentation: "https://www.php.net/manual/en/language.generators.php"

      - id: "PHP-SPL-03"
        question: "Which SPL structure maps data keyed by an object instance?"
        type: "single"
        difficulty: "easy"
        subchapter: "php-web-security/spl"
        concepts: ["SplObjectStorage", "object-identity", "map"]
        syllabus: "PHP → SPL"
        answers:
          - { value: "SplObjectStorage", correct: true }
          - { value: "SplStack", correct: false }
          - { value: "SplFixedArray", correct: false }
          - { value: "SplQueue", correct: false }
        explanation: >-
          SplObjectStorage keys by object identity (spl_object_id) and can attach
          arbitrary data per object. SplStack (LIFO), SplQueue (FIFO) and
          SplFixedArray (integer-indexed) are not object-keyed maps. It is ideal for
          "have I seen this instance?" without polluting the object. Misconception:
          trying to use an object as a plain array key, which is illegal.
        documentation: "https://www.php.net/manual/en/class.splobjectstorage.php"

      - id: "PHP-SPL-04"
        question: "Enabling `$obj[$key]` array-style access on an object requires implementing…"
        type: "single"
        difficulty: "easy"
        subchapter: "php-web-security/spl"
        concepts: ["ArrayAccess", "offset-methods", "interface"]
        syllabus: "PHP → SPL"
        answers:
          - { value: "ArrayAccess", correct: true }
          - { value: "Countable", correct: false }
          - { value: "Iterator", correct: false }
          - { value: "Stringable", correct: false }
        explanation: >-
          ArrayAccess provides offsetGet/offsetSet/offsetExists/offsetUnset for
          bracket syntax. Countable enables count(), Iterator enables foreach, and
          Stringable enables string casting — none give bracket access. Misconception:
          assuming one collection interface covers all behaviours; each native
          behaviour has its own interface.
        documentation: "https://www.php.net/manual/en/class.arrayaccess.php"

      - id: "PHP-SPL-05"
        question: "For SplPriorityQueue, the ordering among elements of equal priority is…"
        type: "single"
        difficulty: "medium"
        subchapter: "php-web-security/spl"
        concepts: ["SplPriorityQueue", "stability", "ordering"]
        syllabus: "PHP → SPL"
        answers:
          - { value: "Unspecified / not stable", correct: true }
          - { value: "Guaranteed FIFO", correct: false }
          - { value: "Always LIFO", correct: false }
          - { value: "Alphabetical", correct: false }
        explanation: >-
          Equal-priority ordering in SplPriorityQueue is implementation-defined and
          not stable, so you cannot rely on FIFO, LIFO or alphabetical order among
          ties. If insertion order matters for equal priorities, encode it into the
          priority yourself. Misconception: assuming a heap preserves insertion order
          for equal keys — heaps are not stable sorts.
        documentation: "https://www.php.net/manual/en/class.splpriorityqueue.php"

      - id: "PHP-SPL-06"
        question: "Why can you not implement `Traversable` directly, and what does `IteratorAggregate::getIterator()` return?"
        type: "internals"
        difficulty: "hard"
        subchapter: "php-web-security/spl"
        concepts: ["Traversable", "IteratorAggregate", "marker-interface"]
        syllabus: "PHP → SPL"
        answers:
          - { value: "Traversable is an internal marker interface; getIterator() must return a Traversable (e.g. an Iterator or generator)", correct: true }
          - { value: "Traversable requires five methods; getIterator() returns an array", correct: false }
          - { value: "Traversable is abstract; getIterator() returns void", correct: false }
          - { value: "You can implement Traversable; getIterator() returns a Countable", correct: false }
        explanation: >-
          Traversable is an engine-internal marker (the base of Iterator and
          IteratorAggregate) that userland cannot implement directly — you implement
          one of its children. getIterator() must return a Traversable, commonly an
          Iterator or a generator (via yield). It does not return a plain array,
          void, or a Countable. Misconception: trying to `implements Traversable`
          directly, which is a fatal error.
        documentation: "https://www.php.net/manual/en/class.traversable.php"

      - id: "PHP-SPL-07"
        question: "A generator is iterated once in a foreach, then a second foreach runs over the same generator. What does the second loop yield?"
        type: "code"
        difficulty: "medium"
        subchapter: "php-web-security/spl"
        concepts: ["generator", "single-use", "rewind"]
        syllabus: "PHP → SPL"
        answers:
          - { value: "Nothing — the generator is already consumed and cannot rewind", correct: true }
          - { value: "The same values again from the start", correct: false }
          - { value: "The values in reverse order", correct: false }
          - { value: "It throws because generators cannot be re-iterated", correct: false }
        explanation: >-
          A generator is single-use; after the first iteration it is exhausted and a
          second foreach yields nothing (attempting to rewind an already-started
          generator would itself error, but simply continuing produces no values).
          It does not restart or reverse. Wrap the source in an IteratorAggregate that
          returns a fresh generator each time if you need re-iteration. Misconception:
          treating a generator like an array you can loop repeatedly.
        documentation: "https://www.php.net/manual/en/language.generators.php"

      - id: "PHP-SPL-08"
        question: "Calling `count($obj)` on a plain object that does not implement Countable results in…"
        type: "trap"
        difficulty: "hard"
        subchapter: "php-web-security/spl"
        concepts: ["Countable", "count", "TypeError"]
        syllabus: "PHP → SPL"
        answers:
          - { value: "A TypeError — count() requires an array or a Countable", correct: true }
          - { value: "The number of public properties", correct: false }
          - { value: "1, treating the object as a single item", correct: false }
          - { value: "0", correct: false }
        explanation: >-
          Since PHP 8.0, count() on a non-countable throws a TypeError; older versions
          only warned and returned 1. It does not count properties, does not return 1,
          and does not return 0. Implement Countable (a count() method) to make count()
          work on your object. Misconception: relying on the legacy "returns 1"
          behaviour, which is now a hard error.
        documentation: "https://www.php.net/manual/en/class.countable.php"

      - id: "PHP-SPL-09"
        question: "True or False: a plain PHP array can use an object as a key."
        type: "true-false"
        difficulty: "easy"
        subchapter: "php-web-security/spl"
        concepts: ["array", "object-key", "SplObjectStorage"]
        syllabus: "PHP → SPL"
        answers:
          - { value: "False", correct: true }
          - { value: "True", correct: false }
        explanation: >-
          Array keys may only be integers or strings, so objects cannot be array keys
          — attempting it raises an error. Use SplObjectStorage (or a WeakMap) when you
          need to key data by an object instance. Misconception: expecting PHP to hash
          objects into array keys like some languages; it does not.
        documentation: "https://www.php.net/manual/en/language.types.array.php"

      - id: "PHP-SPL-10"
        question: "Match the SPL structures to their discipline. Which pairings are correct? (choose two)"
        type: "multiple"
        difficulty: "medium"
        subchapter: "php-web-security/spl"
        concepts: ["SplStack", "SplQueue", "data-structures"]
        syllabus: "PHP → SPL"
        answers:
          - { value: "SplStack is LIFO", correct: true }
          - { value: "SplQueue is FIFO", correct: true }
          - { value: "SplFixedArray grows dynamically like an array", correct: false }
          - { value: "SplMinHeap returns the largest element first", correct: false }
        explanation: >-
          SplStack is last-in-first-out and SplQueue is first-in-first-out (both
          built on SplDoublyLinkedList). SplFixedArray has a fixed size (it does not
          grow dynamically) and uses less memory for dense integer-indexed data.
          SplMinHeap returns the smallest element first (SplMaxHeap returns the
          largest). Misconception: assuming a fixed array auto-resizes or confusing
          min/max heap ordering.
        documentation: "https://www.php.net/manual/en/spl.datastructures.php"

      - id: "PHP-SPL-11"
        question: "You want a collection usable in `foreach` without hand-writing five Iterator methods. What is the idiomatic approach?"
        type: "scenario"
        difficulty: "hard"
        subchapter: "php-web-security/spl"
        concepts: ["IteratorAggregate", "generator", "yield-from"]
        syllabus: "PHP → SPL"
        answers:
          - { value: "Implement IteratorAggregate and `yield from $this->items;` in getIterator()", correct: true }
          - { value: "Implement Iterator and all five methods anyway", correct: false }
          - { value: "Implement ArrayAccess only", correct: false }
          - { value: "Extend SplStack", correct: false }
        explanation: >-
          IteratorAggregate needs only getIterator(); returning a generator with
          `yield from` delegates iteration in one line, since a generator is itself an
          Iterator. Implementing Iterator directly is exactly the five-method chore
          you want to avoid; ArrayAccess gives bracket access, not foreach; and
          extending SplStack changes the type/semantics unnecessarily. Misconception:
          thinking foreach support always requires the full Iterator contract.
        documentation: "https://www.php.net/manual/en/class.iteratoraggregate.php"

  - name: "Web Security Fundamentals"
    questions:
      - id: "PHP-SEC-01"
        question: "What is Twig's default defence against XSS?"
        type: "single"
        difficulty: "easy"
        subchapter: "php-web-security/web-security"
        concepts: ["xss", "twig", "auto-escaping"]
        syllabus: "Web Security → Fundamentals"
        answers:
          - { value: "Context-aware auto-escaping of output variables", correct: true }
          - { value: "Stripping all HTML tags", correct: false }
          - { value: "Sending a CSP header", correct: false }
          - { value: "Encrypting the output", correct: false }
        explanation: >-
          Twig HTML-escapes variables by default (context-aware), so injected markup
          renders as inert text. It does not strip tags (it encodes them), does not
          send CSP (a separate, complementary defence), and does not encrypt output.
          The |raw filter opts out and reintroduces the risk. Misconception: thinking
          escaping removes content — it encodes it so the browser treats it as data.
        documentation: "https://symfony.com/doc/8.0/templates.html"

      - id: "PHP-SEC-02"
        question: "Which technique best prevents SQL injection?"
        type: "single"
        difficulty: "medium"
        subchapter: "php-web-security/web-security"
        concepts: ["sql-injection", "prepared-statements", "binding"]
        syllabus: "Web Security → Fundamentals"
        answers:
          - { value: "Prepared statements with bound parameters", correct: true }
          - { value: "Escaping quotes with addslashes", correct: false }
          - { value: "Relying on a WAF alone", correct: false }
          - { value: "HTML-escaping the input", correct: false }
        explanation: >-
          Binding sends the data separately from the SQL text, so input can never
          alter the query structure. addslashes is fragile and charset-dependent, a
          WAF is defence-in-depth not a fix, and HTML-escaping addresses XSS, not SQL.
          Symfony apps use PDO/DBAL with bound parameters. Misconception: believing
          escaping input is equivalent to parameterisation — only binding structurally
          separates code from data.
        documentation: "https://symfony.com/doc/8.0/security.html"

      - id: "PHP-SEC-03"
        question: "Session fixation is primarily mitigated by…"
        type: "single"
        difficulty: "medium"
        subchapter: "php-web-security/web-security"
        concepts: ["session-fixation", "session-id", "regeneration"]
        syllabus: "Web Security → Fundamentals"
        answers:
          - { value: "Regenerating the session id on login", correct: true }
          - { value: "Using longer session ids", correct: false }
          - { value: "Deleting cookies only on logout", correct: false }
          - { value: "Base64-encoding the session id", correct: false }
        explanation: >-
          Migrating to a new session id at authentication invalidates any
          attacker-planted id — Symfony does this automatically on login. Longer ids
          help against guessing (not fixation), logout-only deletion leaves the login
          window open, and encoding an id changes nothing about the attack.
          Misconception: conflating fixation (attacker sets the id pre-login) with
          hijacking (attacker steals the cookie) — they need different defences.
        documentation: "https://symfony.com/doc/8.0/security.html"

      - id: "PHP-SEC-04"
        question: "Which response header defends against clickjacking?"
        type: "single"
        difficulty: "medium"
        subchapter: "php-web-security/web-security"
        concepts: ["clickjacking", "x-frame-options", "csp"]
        syllabus: "Web Security → Fundamentals"
        answers:
          - { value: "X-Frame-Options: DENY (or CSP frame-ancestors)", correct: true }
          - { value: "X-Content-Type-Options", correct: false }
          - { value: "Referrer-Policy", correct: false }
          - { value: "Accept-Language", correct: false }
        explanation: >-
          X-Frame-Options: DENY (or CSP frame-ancestors 'none') forbids the page from
          being framed, defeating invisible-iframe clickjacking. X-Content-Type-Options
          stops MIME sniffing, Referrer-Policy limits referer leakage, and
          Accept-Language is a request header. Misconception: assuming any security
          header helps against any attack — each header targets a specific threat.
        documentation: "https://symfony.com/doc/8.0/security.html"

      - id: "PHP-SEC-05"
        question: "What is the correct way to store user passwords?"
        type: "single"
        difficulty: "easy"
        subchapter: "php-web-security/web-security"
        concepts: ["password-hash", "bcrypt", "argon2id"]
        syllabus: "Web Security → Fundamentals"
        answers:
          - { value: "password_hash() with bcrypt or argon2id", correct: true }
          - { value: "SHA-256 with a single static salt", correct: false }
          - { value: "MD5", correct: false }
          - { value: "Reversible encryption", correct: false }
        explanation: >-
          Adaptive, salted hashing (bcrypt/argon2id via password_hash()) resists
          brute-force; the per-hash salt is embedded and checked with
          password_verify(). A static salt plus fast SHA-256 is brute-forceable, MD5
          is broken, and reversible encryption defeats the point (a breach reveals
          plaintext). Misconception: adding your own salt to password_hash() — it
          generates and embeds one for you.
        documentation: "https://www.php.net/manual/en/function.password-hash.php"

      - id: "PHP-SEC-06"
        question: "Why is HTML auto-escaping insufficient when a value is placed inside a `<script>` block or a URL attribute?"
        type: "trap"
        difficulty: "hard"
        subchapter: "php-web-security/web-security"
        concepts: ["xss", "escaping-context", "twig"]
        syllabus: "Web Security → Fundamentals"
        answers:
          - { value: "Each context needs its own encoding (js/url); HTML escaping does not neutralise script or URL payloads", correct: true }
          - { value: "HTML escaping is always sufficient everywhere", correct: false }
          - { value: "Because Twig disables escaping inside script tags", correct: false }
          - { value: "Because URLs cannot contain user data at all", correct: false }
        explanation: >-
          XSS defence must be context-aware: a value safe as HTML text can still break
          out inside JavaScript or a URL, so you need the js or url escaping strategy
          there. HTML escaping is not universally sufficient, Twig does not silently
          disable escaping in script tags, and URLs routinely carry user data (which
          must be url-encoded). Misconception: treating one escaping strategy as a
          cure-all across all output contexts.
        documentation: "https://symfony.com/doc/8.0/templates.html"

      - id: "PHP-SEC-07"
        question: "In Twig, `{{ comment }}` renders the value `<script>alert(1)</script>`. What is output and why is it safe?"
        type: "code"
        difficulty: "medium"
        subchapter: "php-web-security/web-security"
        concepts: ["xss", "twig", "auto-escaping"]
        syllabus: "Web Security → Fundamentals"
        answers:
          - { value: "&lt;script&gt;alert(1)&lt;/script&gt; — escaped to inert text, so the script never runs", correct: true }
          - { value: "An executing alert(1) dialog", correct: false }
          - { value: "An empty string, because Twig strips the tag", correct: false }
          - { value: "A Twig error about unsafe content", correct: false }
        explanation: >-
          Twig auto-escapes to HTML entities, so the browser shows the literal text
          and executes nothing. It does not run the script (that would require |raw),
          does not strip the tag (it encodes it), and does not error on the content.
          Only |raw on this value would reintroduce the XSS. Misconception: assuming
          the tag is removed rather than entity-encoded.
        documentation: "https://symfony.com/doc/8.0/templates.html"

      - id: "PHP-SEC-08"
        question: "In framework.yaml, which session cookie settings harden against hijacking and CSRF?"
        type: "config"
        difficulty: "medium"
        subchapter: "php-web-security/web-security"
        concepts: ["session-cookie", "samesite", "httponly"]
        syllabus: "Web Security → Fundamentals"
        answers:
          - { value: "cookie_secure: auto, cookie_httponly: true, cookie_samesite: lax", correct: true }
          - { value: "cookie_secure: false, cookie_httponly: false, cookie_samesite: none", correct: false }
          - { value: "cookie_lifetime: 0 only", correct: false }
          - { value: "cookie_domain: '*' only", correct: false }
        explanation: >-
          Secure (auto = on when HTTPS) keeps the cookie off plain HTTP, HttpOnly
          blocks JS access (anti-theft via XSS), and SameSite=lax curbs CSRF by not
          sending the cookie on cross-site navigations. The second option disables
          every protection; lifetime and domain settings alone do not harden against
          these attacks. Misconception: thinking SameSite=None (without Secure) is a
          safe default — it widens exposure.
        documentation: "https://symfony.com/doc/8.0/session.html"

      - id: "PHP-SEC-09"
        question: "How do the `HttpOnly` and `Secure` cookie flags differ?"
        type: "internals"
        difficulty: "hard"
        subchapter: "php-web-security/web-security"
        concepts: ["httponly", "secure", "cookies"]
        syllabus: "Web Security → Fundamentals"
        answers:
          - { value: "HttpOnly blocks JavaScript access to the cookie; Secure restricts it to HTTPS connections", correct: true }
          - { value: "They are synonyms for the same protection", correct: false }
          - { value: "Secure blocks JS access; HttpOnly forces HTTPS", correct: false }
          - { value: "Both only affect the cookie's lifetime", correct: false }
        explanation: >-
          HttpOnly hides the cookie from document.cookie (mitigating theft via XSS);
          Secure ensures the cookie is only sent over TLS (mitigating network
          sniffing). They solve different problems, are not synonyms, and the third
          option swaps their meanings. Neither affects lifetime (that is Max-Age/
          Expires). Misconception: assuming one flag covers both JS access and
          transport security.
        documentation: "https://symfony.com/doc/8.0/session.html"

      - id: "PHP-SEC-10"
        question: "True or False: a CSRF token is an authentication mechanism."
        type: "true-false"
        difficulty: "easy"
        subchapter: "php-web-security/web-security"
        concepts: ["csrf", "token", "state-change"]
        syllabus: "Web Security → Fundamentals"
        answers:
          - { value: "False", correct: true }
          - { value: "True", correct: false }
        explanation: >-
          A CSRF token proves a state-changing request originated from your own
          form/session, not that a particular user is authenticated — those are
          separate concerns. Authentication establishes identity; the CSRF token
          defends already-authenticated sessions from forged cross-site requests.
          Misconception: treating CSRF tokens as login/identity checks rather than
          request-origin proof for state-changing actions.
        documentation: "https://symfony.com/doc/8.0/security/csrf.html"

      - id: "PHP-SEC-11"
        question: "Which pairings of threat and Symfony/PHP defence are correct? (choose two)"
        type: "multiple"
        difficulty: "medium"
        subchapter: "php-web-security/web-security"
        concepts: ["xss", "sql-injection", "threat-mapping"]
        syllabus: "Web Security → Fundamentals"
        answers:
          - { value: "XSS is mitigated by Twig context-aware auto-escaping", correct: true }
          - { value: "SQL injection is mitigated by prepared statements with bound parameters", correct: true }
          - { value: "CSRF is mitigated by HTML-escaping output", correct: false }
          - { value: "Clickjacking is mitigated by password hashing", correct: false }
        explanation: >-
          XSS→output escaping and SQLi→parameter binding are the canonical pairings.
          CSRF is mitigated by tokens plus SameSite cookies (not output escaping, which
          addresses XSS), and clickjacking is mitigated by X-Frame-Options/CSP (password
          hashing protects stored credentials, an unrelated concern). Misconception:
          assuming one defence generalises across threats — each attack has its own
          countermeasure.
        documentation: "https://symfony.com/doc/8.0/security.html"

      - id: "PHP-SEC-12"
        question: "A developer verifies passwords with `if ($hash == $storedHash)`. What is wrong and what is the fix?"
        type: "debug"
        difficulty: "hard"
        subchapter: "php-web-security/web-security"
        concepts: ["password-verify", "timing-attack", "hash_equals"]
        syllabus: "Web Security → Fundamentals"
        answers:
          - { value: "== is non-constant-time (timing attack) and re-hashes wrongly; use password_verify()/hash_equals()", correct: true }
          - { value: "Nothing is wrong; == is fine for hashes", correct: false }
          - { value: "It should use === for a strict comparison and is then secure", correct: false }
          - { value: "It should md5() both sides first", correct: false }
        explanation: >-
          Comparing hashes with == (or ===) leaks timing information and does not
          re-derive the hash from the candidate password; you must call
          password_verify($plain, $storedHash), which is constant-time and handles the
          embedded salt. hash_equals() is the constant-time primitive for comparing
          known strings. === does not fix the timing leak, and md5 is broken.
          Misconception: treating password checking as a plain string comparison.
        documentation: "https://www.php.net/manual/en/function.password-verify.php"
  - name: "PHP & Web Security — Multiple Choice Drills"
    questions:
      - id: "PHP-MC-01"
        type: "multiple"
        difficulty: "medium"
        subchapter: "php-web-security/closures"
        concepts: ["use-capture", "arrow-functions", "closure-bind"]
        syllabus: "PHP → Anonymous functions & closures"
        question: "Which of the following statements are true about PHP anonymous functions and closures? (select all that apply)"
        answers:
          - value: "function () use ($x) {} captures $x by value at definition time; use (&$x) captures by reference"
            correct: true
          - value: "Arrow functions (fn) auto-capture the enclosing scope by value and cannot capture by reference"
            correct: true
          - value: "Closure::bind() mutates the closure it receives and returns void"
            correct: false
          - value: "An arrow function body may contain multiple statements separated by semicolons"
            correct: false
        explanation: >-
          A use clause copies the variable when the closure is defined (add & for a
          live reference), and fn auto-captures by value only — it has no use list and
          no by-reference form. Closure::bind() is static and returns a new closure,
          leaving the original untouched, and an arrow function is limited to a single
          expression.
        documentation: "https://www.php.net/manual/en/functions.anonymous.php"
      - id: "PHP-MC-02"
        type: "multiple"
        difficulty: "medium"
        subchapter: "php-web-security/traits"
        concepts: ["precedence", "conflict-resolution", "static-state"]
        syllabus: "PHP → Traits"
        question: "Which of the following statements are true about PHP traits? (select all that apply)"
        answers:
          - value: "Method precedence is: the class's own method beats a trait method, which beats an inherited parent method"
            correct: true
          - value: "Two used traits defining the same method cause a fatal error unless resolved with insteadof/as"
            correct: true
          - value: "A static property declared in a trait is a separate copy for each class that uses the trait"
            correct: true
          - value: "You can type-hint a parameter against a trait, just like against an interface"
            correct: false
          - value: "When a trait and the using class define the same method, the trait version wins"
            correct: false
        explanation: >-
          Precedence is class > trait > parent, unresolved same-name methods from two
          traits are fatal (fix with insteadof and/or as), and static trait state is
          bound to each using class independently. Traits are not types — you cannot
          type-hint or instanceof them — and a trait method never overrides the using
          class's own method.
        documentation: "https://www.php.net/manual/en/language.oop5.traits.php"
      - id: "PHP-MC-03"
        type: "multiple"
        difficulty: "hard"
        subchapter: "php-web-security/interfaces"
        concepts: ["covariance", "contravariance", "instanceof"]
        syllabus: "PHP → Interfaces"
        question: "Which of the following statements are true about PHP interfaces and type variance? (select all that apply)"
        answers:
          - value: "Return types are covariant: an override may narrow the return type (Animal → Cat)"
            correct: true
          - value: "Parameter types are contravariant: an override may widen a parameter type"
            correct: true
          - value: "instanceof used on a non-object value returns false instead of throwing"
            correct: true
          - value: "A class can extend two classes as long as both are abstract"
            correct: false
          - value: "Intersection types (A&B) may combine interfaces with scalar types like int"
            correct: false
        explanation: >-
          Variance follows Liskov substitution: overrides may narrow returns and widen
          parameters (reversing either is a fatal error), and instanceof safely yields
          false for non-objects. PHP has single class inheritance — only interfaces
          can be multiply inherited — and intersection types accept only
          class/interface names, never scalars.
        documentation: "https://www.php.net/manual/en/language.oop5.variance.php"
      - id: "PHP-MC-04"
        type: "multiple"
        difficulty: "medium"
        subchapter: "php-web-security/exceptions"
        concepts: ["throwable", "finally", "error-vs-exception"]
        syllabus: "PHP → Exception & error handling"
        question: "Which of the following statements are true about PHP error and exception handling? (select all that apply)"
        answers:
          - value: "catch (\\Exception $e) does not catch a TypeError; you need \\Throwable (or an Error type) to catch engine errors"
            correct: true
          - value: "finally always executes, and a return inside finally overrides a return or throw from the try block"
            correct: true
          - value: "set_error_handler() is the mechanism that handles uncaught exceptions"
            correct: false
          - value: "DivisionByZeroError extends Exception, so catch (\\Exception) catches intdiv(1, 0)"
            correct: false
        explanation: >-
          Error and Exception are separate branches under Throwable, so an Exception
          catch block misses TypeError and friends, and finally runs on every exit
          path — its return silently wins over the try block's outcome. Uncaught
          exceptions are handled by set_exception_handler() (set_error_handler()
          intercepts traditional warnings/notices), and DivisionByZeroError extends
          Error, not Exception.
        documentation: "https://www.php.net/manual/en/language.exceptions.php"
      - id: "PHP-MC-05"
        type: "multiple"
        difficulty: "hard"
        subchapter: "php-web-security/spl"
        concepts: ["generators", "iterator", "spl-object-storage"]
        syllabus: "PHP → SPL"
        question: "Which of the following statements are true about the SPL and generators? (select all that apply)"
        answers:
          - value: "A generator is a lazy, single-use Iterator: once fully consumed it cannot be rewound"
            correct: true
          - value: "SplObjectStorage keys entries by object identity and can attach data to each object"
            correct: true
          - value: "Iterator requires five methods (current/key/next/rewind/valid), while IteratorAggregate only requires getIterator()"
            correct: true
          - value: "SplPriorityQueue guarantees stable FIFO ordering among items with equal priority"
            correct: false
          - value: "Implementing ArrayAccess is what makes count($obj) work"
            correct: false
        explanation: >-
          Generators produce values lazily and cannot be rewound after consumption,
          SplObjectStorage maps data by object identity (something plain arrays cannot
          do), and IteratorAggregate delegates iteration through a single
          getIterator() method versus Iterator's five. SplPriorityQueue ordering among
          equal priorities is not stable, and count($obj) requires Countable —
          ArrayAccess only enables the $obj[$k] bracket syntax.
        documentation: "https://www.php.net/manual/en/book.spl.php"
      - id: "PHP-MC-06"
        type: "multiple"
        difficulty: "hard"
        subchapter: "php-web-security/oop"
        concepts: ["late-static-binding", "clone", "magic-methods"]
        syllabus: "PHP → Object-Oriented Programming"
        question: "Which of the following statements are true about the PHP object model? (select all that apply)"
        answers:
          - value: "static:: resolves to the called class at runtime (late static binding), while self:: is fixed at compile time to the declaring class"
            correct: true
          - value: "clone performs a shallow copy: object-typed properties still reference the same objects unless __clone() deep-copies them"
            correct: true
          - value: "__get() is invoked on every property read, even for accessible public properties"
            correct: false
          - value: "A constructor parameter typed callable can be promoted to a property like any other type"
            correct: false
        explanation: >-
          Late static binding makes new static() subclass-safe where new self() would
          pin the parent class, and clone copies references shallowly until __clone()
          duplicates them. __get() fires only for inaccessible or undefined properties
          (accessible ones are read directly), and callable is not a valid property
          type, so it cannot be used in constructor promotion.
        documentation: "https://www.php.net/manual/en/language.oop5.late-static-bindings.php"
      - id: "PHP-MC-07"
        type: "multiple"
        difficulty: "medium"
        subchapter: "php-web-security/web-security"
        concepts: ["session-fixation", "cookie-flags", "password-hash"]
        syllabus: "Web Security → Fundamentals"
        question: "Which of the following statements are true about web security fundamentals? (select all that apply)"
        answers:
          - value: "The HttpOnly cookie flag prevents JavaScript from reading the session cookie, mitigating cookie theft via XSS"
            correct: true
          - value: "Regenerating the session id on login is the primary defence against session fixation"
            correct: true
          - value: "password_hash() embeds the generated salt in its output, so you must not prepend your own"
            correct: true
          - value: "HTML-escaping a value is sufficient protection when it is printed inside a <script> block or a URL"
            correct: false
          - value: "A valid CSRF token proves the user is authenticated"
            correct: false
        explanation: >-
          HttpOnly blocks script access to cookies, a fresh session id at
          authentication invalidates any attacker-planted id, and password_hash()
          stores the salt inside the returned hash. Escaping must match the output
          context — HTML entities do not neutralise script or URL contexts — and a
          CSRF token only proves the request originated from your own form/session,
          not who the user is.
        documentation: "https://symfony.com/doc/8.0/security.html"
      - id: "PHP-ATTR-01"
        type: "trap"
        difficulty: "medium"
        subchapter: "php-web-security/attributes"
        concepts: ["Attribute", "getAttributes", "newInstance"]
        syllabus: "PHP → Attributes"
        question: "You put #[LogCall] on a method but nothing in your code ever calls getAttributes() on it. Does LogCall's constructor run?"
        answers:
          - value: "No — nothing instantiates it, so the constructor never runs"
            correct: true
          - value: "Yes, immediately when the file is parsed"
            correct: false
          - value: "Yes, the first time the method is invoked"
            correct: false
          - value: "It depends on the attribute's target flags"
            correct: false
        explanation: >-
          An attribute is inert metadata. getAttributes() only returns data
          (name, arguments, target); newInstance() is the one call that
          constructs the object and autoloads its class. With nothing reading
          the attribute at all, LogCall's constructor never executes.
        documentation: "https://www.php.net/manual/en/language.attributes.php"
      - id: "PHP-ATTR-02"
        type: "scenario"
        difficulty: "hard"
        subchapter: "php-web-security/attributes"
        concepts: ["IS_REPEATABLE", "TARGET_METHOD", "Route"]
        syllabus: "PHP → Attributes"
        question: "A team member declares #[\\Attribute(\\Attribute::TARGET_METHOD)] on a custom Endpoint attribute, then applies it twice to the same method to register two names. What happens?"
        answers:
          - value: "PHP raises a fatal error — the attribute is not marked IS_REPEATABLE"
            correct: true
          - value: "Both applications silently merge into one instance"
            correct: false
          - value: "Only the second application is kept"
            correct: false
          - value: "PHP allows it because TARGET_METHOD permits multiple uses by default"
            correct: false
        explanation: >-
          A target flag alone does not allow repetition. Applying the same
          non-repeatable attribute class more than once to the same target is
          rejected outright; \Attribute::IS_REPEATABLE must be added to the
          flags (as Symfony's own #[Route] does) for that to be legal.
        documentation: "https://www.php.net/manual/en/language.attributes.reflection.php"
      - id: "PHP-ENUM-01"
        type: "trap"
        difficulty: "medium"
        subchapter: "php-web-security/enums"
        concepts: ["from", "tryFrom", "ValueError"]
        syllabus: "PHP → Enums"
        question: "Status::from('unknown') is called where 'unknown' matches no case. What happens?"
        answers:
          - value: "\\ValueError is thrown"
            correct: true
          - value: "null is returned"
            correct: false
          - value: "false is returned"
            correct: false
          - value: "A new anonymous case is created"
            correct: false
        explanation: >-
          from() is strict: an unmatched backing value throws \ValueError.
          Only tryFrom() returns null on a miss — the two are not
          interchangeable, and this exact distinction is a frequent exam trap.
        documentation: "https://www.php.net/manual/en/language.enumerations.backed.php"
      - id: "PHP-ENUM-02"
        type: "scenario"
        difficulty: "hard"
        subchapter: "php-web-security/enums"
        concepts: ["BackedEnumValueResolver", "routing", "404"]
        syllabus: "PHP → Enums"
        question: "A controller action is typed public function show(Status $status). A request arrives for a {status} route value that matches no Status case. What does the client receive?"
        answers:
          - value: "A 404 Not Found — the resolver catches the ValueError and raises NotFoundHttpException"
            correct: true
          - value: "A 500 Internal Server Error from an uncaught ValueError"
            correct: false
          - value: "A 200 response with $status resolved to null"
            correct: false
          - value: "A 200 response with $status resolved to the first declared case"
            correct: false
        explanation: >-
          BackedEnumValueResolver calls Status::from($value) internally and
          catches the resulting ValueError/TypeError itself, converting it
          into a NotFoundHttpException — an invalid enum value in a route is a
          404, never an unhandled exception reaching the client as a 500.
        documentation: "https://symfony.com/doc/8.0/controller/value_resolver.html"
