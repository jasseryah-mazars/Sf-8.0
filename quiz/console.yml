categories:
  - name: "Console — Built-in commands & the Application"
    questions:
      - id: "CON-BUILTIN-01"
        type: "single"
        difficulty: "easy"
        subchapter: "console/built-in-commands"
        concepts: ["application", "default-command", "list"]
        syllabus: "Console → Built-in commands"
        question: "Which command runs when you execute `php bin/console` with no arguments?"
        answers:
          - value: "list"
            correct: true
          - value: "help"
            correct: false
          - value: "about"
            correct: false
          - value: "debug:container"
            correct: false
        explanation: >-
          The Application's default command is `list`, which prints all available
          commands grouped by namespace. `help` shows usage for a single command and
          must be given a name; `about` prints an environment summary; `debug:container`
          is a FrameworkBundle command. The classic trap is to assume `help` is the
          default — it is not.
        documentation: "https://symfony.com/doc/8.0/console.html"

      - id: "CON-BUILTIN-02"
        type: "trap"
        difficulty: "easy"
        subchapter: "console/built-in-commands"
        concepts: ["maker-bundle", "core-vs-bundle", "make"]
        syllabus: "Console → Built-in commands"
        question: "Which command is provided by an optional bundle (MakerBundle), not by Symfony core?"
        answers:
          - value: "make:command"
            correct: true
          - value: "cache:clear"
            correct: false
          - value: "debug:router"
            correct: false
          - value: "about"
            correct: false
        explanation: >-
          `make:*` generators ship with the optional symfony/maker-bundle dev
          dependency. `cache:clear` and `debug:router` come from FrameworkBundle, and
          `about` is a core Console command. Expecting `make:*` to be part of the core
          framework is a classic certification trick.
        documentation: "https://symfony.com/doc/8.0/bundles.html"

      - id: "CON-BUILTIN-03"
        type: "internals"
        difficulty: "medium"
        subchapter: "console/built-in-commands"
        concepts: ["runtime", "bootstrap", "closure"]
        syllabus: "Console → Built-in commands"
        question: "How does `bin/console` obtain the console Application in Symfony 8?"
        answers:
          - value: "It returns a closure that the Runtime component executes to build the kernel and Application"
            correct: true
          - value: "It calls Application::create() statically"
            correct: false
          - value: "The web front controller instantiates it"
            correct: false
          - value: "It parses services.yaml directly"
            correct: false
        explanation: >-
          bin/console requires vendor/autoload_runtime.php and returns a closure; the
          Runtime component reads $context (APP_ENV/APP_DEBUG), runs the closure to build
          the Kernel and FrameworkBundle Application, then calls Application::run().
          There is no Application::create() factory, and the web front controller boots
          the HTTP kernel, not the console one.
        documentation: "https://symfony.com/doc/8.0/components/runtime.html"

      - id: "CON-BUILTIN-04"
        type: "single"
        difficulty: "medium"
        subchapter: "console/built-in-commands"
        concepts: ["find", "abbreviation", "command-loader"]
        syllabus: "Console → Built-in commands"
        question: "What does `php bin/console ca:cl` do when the abbreviation is unambiguous?"
        answers:
          - value: "Runs cache:clear via command-name abbreviation"
            correct: true
          - value: "Fails — abbreviations are not supported"
            correct: false
          - value: "Lists commands starting with 'ca'"
            correct: false
          - value: "Clears only the 'cl' namespace"
            correct: false
        explanation: >-
          Application::find() resolves unambiguous abbreviations (per namespace segment)
          to the full command name, so `ca:cl` maps to `cache:clear`. If more than one
          command matched, it would raise an ambiguity error instead — abbreviations only
          work when the prefix resolves to exactly one command.
        documentation: "https://symfony.com/doc/8.0/console.html"

      - id: "CON-BUILTIN-05"
        type: "trap"
        difficulty: "medium"
        subchapter: "console/built-in-commands"
        concepts: ["about", "core-vs-bundle", "completion"]
        syllabus: "Console → Built-in commands"
        question: "Which commands exist in *every* Console application, independent of FrameworkBundle? (choose 2)"
        answers:
          - value: "list"
            correct: true
          - value: "completion"
            correct: true
          - value: "cache:clear"
            correct: false
          - value: "debug:container"
            correct: false
        explanation: >-
          `list`, `help`, `about` and `completion` are core Console commands present in
          any Application, even a standalone one. `cache:clear` and `debug:container` are
          added by FrameworkBundle and only exist in a full-stack Symfony app. A frequent
          trap is believing `about` is a FrameworkBundle command — it is core Console.
        documentation: "https://symfony.com/doc/8.0/console.html"

      - id: "CON-BUILTIN-06"
        type: "single"
        difficulty: "medium"
        subchapter: "console/built-in-commands"
        concepts: ["debug", "cache", "inspection"]
        syllabus: "Console → Built-in commands"
        question: "You want to inspect which service is registered for an autowired interface without rebuilding the cache. Which command fits?"
        answers:
          - value: "debug:autowiring"
            correct: true
          - value: "cache:clear"
            correct: false
          - value: "cache:warmup"
            correct: false
          - value: "make:command"
            correct: false
        explanation: >-
          `debug:autowiring` lists the types you can type-hint for autowiring and the
          service each resolves to — pure inspection, no cache rebuild. `cache:clear`
          rebuilds the container (a mutation, not inspection), `cache:warmup` fills caches
          without clearing, and `make:command` is a MakerBundle generator. Confusing the
          inspecting `debug:*` family with the rebuilding `cache:*` family is a common
          error.
        documentation: "https://symfony.com/doc/8.0/console.html"

      - id: "CON-BUILTIN-07"
        type: "code"
        difficulty: "hard"
        subchapter: "console/built-in-commands"
        concepts: ["runtime", "bin-console", "kernel"]
        syllabus: "Console → Built-in commands"
        question: >-
          In Symfony 8 `bin/console` ends with `return static function (array $context):
          Application { ... };`. What consumes this returned closure?
        answers:
          - value: "The Runtime component (loaded via vendor/autoload_runtime.php), which invokes it with $context and calls run()"
            correct: true
          - value: "PHP itself auto-executes any returned closure at end of file"
            correct: false
          - value: "The Kernel's boot() method executes it"
            correct: false
          - value: "Composer's autoloader executes it during class discovery"
            correct: false
        explanation: >-
          `require vendor/autoload_runtime.php` installs the SymfonyRuntime, which captures
          the closure the file returns, builds a runner, injects $context (from $_SERVER /
          env), invokes the closure to get the Application, and calls its run() method. PHP
          does not auto-run returned closures, the Kernel does not, and Composer's
          autoloader only maps classes to files. This inversion is what lets the same
          Runtime handle web and console entry points.
        documentation: "https://symfony.com/doc/8.0/components/runtime.html"

  - name: "Console — Custom commands"
    questions:
      - id: "CON-CUSTOM-01"
        type: "single"
        difficulty: "easy"
        subchapter: "console/custom-commands"
        concepts: ["exit-code", "constants", "invalid"]
        syllabus: "Console → Custom commands"
        question: "What integer value does `Command::INVALID` represent?"
        answers:
          - value: "2"
            correct: true
          - value: "0"
            correct: false
          - value: "1"
            correct: false
          - value: "255"
            correct: false
        explanation: >-
          The return constants are SUCCESS=0, FAILURE=1, INVALID=2. INVALID signals bad
          input/usage as opposed to a runtime failure (FAILURE=1). 255 is a shell
          convention for a general error but is not a Command constant.
        documentation: "https://symfony.com/doc/8.0/console.html"

      - id: "CON-CUSTOM-02"
        type: "single"
        difficulty: "medium"
        subchapter: "console/custom-commands"
        concepts: ["invokable", "as-command", "__invoke"]
        syllabus: "Console → Custom commands"
        question: "In Symfony 8, what does an invokable command class require?"
        answers:
          - value: "The #[AsCommand] attribute and an __invoke() method returning int"
            correct: true
          - value: "It must extend Command"
            correct: false
          - value: "It must implement CommandInterface"
            correct: false
          - value: "It must be registered manually in services.yaml"
            correct: false
        explanation: >-
          Invokable commands only need #[AsCommand] plus an __invoke() method returning
          int; they do not extend Command, yet still use its SUCCESS/FAILURE/INVALID
          constants for return codes. Autoconfiguration registers them, so no manual
          services.yaml tag is needed.
        documentation: "https://symfony.com/doc/8.0/console.html"

      - id: "CON-CUSTOM-03"
        type: "internals"
        difficulty: "medium"
        subchapter: "console/custom-commands"
        concepts: ["autoconfiguration", "compiler-pass", "lazy-loading"]
        syllabus: "Console → Custom commands"
        question: "How is a command normally registered in the service container?"
        answers:
          - value: "Autoconfiguration tags #[AsCommand]/Command subclasses with 'console.command'"
            correct: true
          - value: "You always add the 'console.command' tag manually"
            correct: false
          - value: "You call Application::add() inside bin/console"
            correct: false
          - value: "It is discovered purely by filename"
            correct: false
        explanation: >-
          Autoconfiguration applies the console.command tag to any service carrying
          #[AsCommand] or extending Command; AddConsoleCommandPass then builds a
          ContainerCommandLoader mapping name→service id for lazy loading. Manual tagging
          is redundant, filename plays no role, and you do not call Application::add()
          yourself in a framework app.
        documentation: "https://symfony.com/doc/8.0/console/commands_as_services.html"

      - id: "CON-CUSTOM-04"
        type: "single"
        difficulty: "easy"
        subchapter: "console/custom-commands"
        concepts: ["exit-code", "return-type", "execute"]
        syllabus: "Console → Custom commands"
        question: "What must a command's execute()/__invoke() return in Symfony 8?"
        answers:
          - value: "An int exit code"
            correct: true
          - value: "void"
            correct: false
          - value: "A Response object"
            correct: false
          - value: "A bool"
            correct: false
        explanation: >-
          The returned int becomes the process exit code; returning void/null triggers a
          type error in Symfony 8. A Response belongs to HTTP controllers, and a bool is
          not accepted — use Command::SUCCESS/FAILURE/INVALID.
        documentation: "https://symfony.com/doc/8.0/console.html"

      - id: "CON-CUSTOM-05"
        type: "code"
        difficulty: "medium"
        subchapter: "console/custom-commands"
        concepts: ["invokable", "attribute", "option", "argument"]
        syllabus: "Console → Custom commands"
        question: >-
          Given an invokable command `public function __invoke(SymfonyStyle $io,
          #[Argument] string $name, #[Option] bool $force = false): int`, how are `$name`
          and `$force` mapped to the input definition?
        answers:
          - value: "$name becomes a REQUIRED argument; $force becomes a VALUE_NONE (boolean flag) option"
            correct: true
          - value: "Both become options; $name is VALUE_REQUIRED"
            correct: false
          - value: "$name becomes an OPTIONAL argument; $force becomes VALUE_OPTIONAL"
            correct: false
          - value: "$force becomes a REQUIRED argument because it has no shortcut"
            correct: false
        explanation: >-
          The invokable adapter derives modes from the parameter: a #[Argument] with no
          default is REQUIRED; a #[Option] typed bool becomes a VALUE_NONE flag (present =
          true, absent = its default false). $name is not optional because it lacks a
          default, and $force is an option (declared with #[Option]), never an argument.
        documentation: "https://symfony.com/doc/8.0/console.html"

      - id: "CON-CUSTOM-06"
        type: "trap"
        difficulty: "medium"
        subchapter: "console/custom-commands"
        concepts: ["invokable", "extends-command", "constants"]
        syllabus: "Console → Custom commands"
        question: "Which statement about a modern invokable command is TRUE?"
        answers:
          - value: "It does not extend Command, yet still uses Command::SUCCESS for the return value"
            correct: true
          - value: "It must extend Command to access SUCCESS/FAILURE"
            correct: false
          - value: "It cannot use SymfonyStyle because it has no HelperSet"
            correct: false
          - value: "It must implement __invoke() as static"
            correct: false
        explanation: >-
          An invokable command is a plain class; it does not extend Command, but the
          SUCCESS/FAILURE/INVALID constants are public class constants you can reference
          from anywhere. SymfonyStyle is injected by type-hint into __invoke(), and
          __invoke() is a normal (non-static) method. Assuming you must extend Command to
          reach the constants is the trap.
        documentation: "https://symfony.com/doc/8.0/console.html"

      - id: "CON-CUSTOM-07"
        type: "debug"
        difficulty: "medium"
        subchapter: "console/custom-commands"
        concepts: ["return-type", "exit-code", "type-error"]
        syllabus: "Console → Custom commands"
        question: >-
          A command's execute() ends with `$io->success('done');` and no return
          statement. What happens when it runs?
        answers:
          - value: "A TypeError — execute() is declared `: int` but returns null"
            correct: true
          - value: "It silently exits 0 because success() returns 0"
            correct: false
          - value: "It exits 2 (INVALID) automatically"
            correct: false
          - value: "It loops until a return is added"
            correct: false
        explanation: >-
          execute() is typed `: int`, so falling off the end (returning null) is a fatal
          TypeError. SymfonyStyle::success() returns void, so it cannot supply the exit
          code. There is no implicit SUCCESS/INVALID default — you must explicitly
          `return Command::SUCCESS;`. Forgetting the return is a very common mistake.
        documentation: "https://symfony.com/doc/8.0/console.html"

      - id: "CON-CUSTOM-08"
        type: "internals"
        difficulty: "hard"
        subchapter: "console/custom-commands"
        concepts: ["AddConsoleCommandPass", "ContainerCommandLoader", "lazy-loading"]
        syllabus: "Console → Custom commands"
        question: "Which class collects the `console.command` tags and builds the lazy command loader?"
        answers:
          - value: "AddConsoleCommandPass, which builds a ContainerCommandLoader (name → service id)"
            correct: true
          - value: "ContainerBuilder::compile() instantiates each command eagerly"
            correct: false
          - value: "The Kernel's registerCommands() method scans the filesystem"
            correct: false
          - value: "CommandCompilerPass, building an ArrayCommandLoader"
            correct: false
        explanation: >-
          Symfony\\Component\\Console\\DependencyInjection\\AddConsoleCommandPass gathers
          every service tagged console.command and constructs a ContainerCommandLoader
          mapping each command name to its service id, so a command is instantiated only
          when its name is invoked. There is no CommandCompilerPass, commands are not
          instantiated eagerly at compile time, and Symfony 8 does not scan the filesystem
          for commands.
        documentation: "https://symfony.com/doc/8.0/console/commands_as_services.html"

      - id: "CON-CUSTOM-09"
        type: "code"
        difficulty: "medium"
        subchapter: "console/custom-commands"
        concepts: ["CommandTester", "testing", "assertions"]
        syllabus: "Console → Custom commands"
        question: >-
          When unit-testing a command with `CommandTester`, which call executes it and
          how do you assert the exit code?
        answers:
          - value: "$tester->execute([...]); then $tester->assertCommandIsSuccessful() or check $tester->getStatusCode()"
            correct: true
          - value: "$tester->run() returns a Response you inspect"
            correct: false
          - value: "$tester->handle() and read $tester->getExitCode()"
            correct: false
          - value: "You must boot the full HTTP kernel and issue a request"
            correct: false
        explanation: >-
          CommandTester::execute(array $input) runs the command in-memory; getStatusCode()
          returns the int exit code and getDisplay() returns the captured output.
          assertCommandIsSuccessful() is the convenience assertion. There is no run()
          returning a Response (that is HTTP) nor a handle()/getExitCode() pair, and
          testing a command does not require the HTTP kernel.
        documentation: "https://symfony.com/doc/8.0/console.html#testing-commands"

  - name: "Console — Configuration & lifecycle"
    questions:
      - id: "CON-CONFIG-01"
        type: "internals"
        difficulty: "medium"
        subchapter: "console/configuration"
        concepts: ["lifecycle", "configure", "initialize", "interact", "execute"]
        syllabus: "Console → Configuration"
        question: "What is the correct command lifecycle order?"
        answers:
          - value: "configure → initialize → interact → execute"
            correct: true
          - value: "initialize → configure → execute → interact"
            correct: false
          - value: "configure → interact → initialize → execute"
            correct: false
          - value: "execute → configure → initialize → interact"
            correct: false
        explanation: >-
          configure() runs in the constructor; then run() binds input and calls
          initialize(), interact() (only if interactive), input validation, and finally
          execute(). initialize() always precedes interact() so shared state is ready
          before prompting.
        documentation: "https://symfony.com/doc/8.0/console.html"

      - id: "CON-CONFIG-02"
        type: "single"
        difficulty: "medium"
        subchapter: "console/configuration"
        concepts: ["interact", "interactive", "no-interaction"]
        syllabus: "Console → Configuration"
        question: "When is interact() called?"
        answers:
          - value: "Only when the input is interactive"
            correct: true
          - value: "Always, before initialize()"
            correct: false
          - value: "Only when --no-interaction is passed"
            correct: false
          - value: "After execute()"
            correct: false
        explanation: >-
          interact() is skipped for non-interactive input (e.g. -n / --no-interaction), so
          it is the wrong place for mandatory logic. It runs after initialize(), never
          before it, and always before execute() — never after.
        documentation: "https://symfony.com/doc/8.0/console.html"

      - id: "CON-CONFIG-03"
        type: "internals"
        difficulty: "medium"
        subchapter: "console/configuration"
        concepts: ["as-command", "lazy-loading", "command-loader"]
        syllabus: "Console → Configuration"
        question: "Why declare the command name in #[AsCommand] rather than only in configure()?"
        answers:
          - value: "It lets the command loader know the name without instantiating the class (lazy loading)"
            correct: true
          - value: "configure() cannot set a name at all"
            correct: false
          - value: "Attributes execute faster at runtime"
            correct: false
          - value: "It is required for execute() to run"
            correct: false
        explanation: >-
          The attribute exposes name/aliases at compile time so ContainerCommandLoader
          maps name→id and instantiates the command only when invoked. Putting the name
          only in configure() (via setName()) would force the Application to construct
          every command just to learn its name, defeating lazy loading.
        documentation: "https://symfony.com/doc/8.0/console/commands_as_services.html"

      - id: "CON-CONFIG-04"
        type: "single"
        difficulty: "easy"
        subchapter: "console/configuration"
        concepts: ["hidden", "list", "metadata"]
        syllabus: "Console → Configuration"
        question: "A command declared with hidden: true …"
        answers:
          - value: "Does not appear in `list` but can still be executed"
            correct: true
          - value: "Cannot be executed at all"
            correct: false
          - value: "Is removed from the container"
            correct: false
          - value: "Only runs in the dev environment"
            correct: false
        explanation: >-
          The hidden flag only affects listing; the command stays registered and fully
          runnable by name or alias. It is not removed from the container and is not
          environment-scoped.
        documentation: "https://symfony.com/doc/8.0/console.html"

      - id: "CON-CONFIG-05"
        type: "trap"
        difficulty: "hard"
        subchapter: "console/configuration"
        concepts: ["configure", "constructor", "input"]
        syllabus: "Console → Configuration"
        question: "Why can't you read an argument value inside configure()?"
        answers:
          - value: "configure() runs in the constructor, before any input is bound"
            correct: true
          - value: "configure() runs after execute(), so input is already consumed"
            correct: false
          - value: "Arguments are only available to interact()"
            correct: false
          - value: "You can — getArgument() works in configure()"
            correct: false
        explanation: >-
          configure() is invoked from the Command constructor, long before run() binds the
          ArgvInput to the definition, so no argument values exist yet — configure() may
          only declare structure (name, arguments, options, help). Reading input there is
          a classic mistake; to act on values use initialize()/interact()/execute().
        documentation: "https://symfony.com/doc/8.0/console.html"

      - id: "CON-CONFIG-06"
        type: "code"
        difficulty: "medium"
        subchapter: "console/configuration"
        concepts: ["initialize", "interact", "prompting"]
        syllabus: "Console → Configuration"
        question: >-
          A command sets `$this->io = new SymfonyStyle(...)` in initialize() and, in
          interact(), prompts for a missing `name` argument. Under `--no-interaction`
          with no `name` given, what happens?
        answers:
          - value: "interact() is skipped, so name stays null and validation fails for the required argument"
            correct: true
          - value: "interact() still runs and blocks waiting for input"
            correct: false
          - value: "initialize() is also skipped, causing a null $this->io"
            correct: false
          - value: "The command silently exits SUCCESS"
            correct: false
        explanation: >-
          With --no-interaction, interact() is not called, so the prompt never fills the
          missing value; input->validate() then throws for the missing REQUIRED argument.
          initialize() always runs regardless of interactivity, so $this->io is set. This
          is why prompts belong in interact() but must not be the only way to satisfy
          required input.
        documentation: "https://symfony.com/doc/8.0/console.html"

      - id: "CON-CONFIG-07"
        type: "config"
        difficulty: "easy"
        subchapter: "console/configuration"
        concepts: ["as-command", "aliases", "metadata"]
        syllabus: "Console → Configuration"
        question: >-
          What does `#[AsCommand(name: 'app:report:generate', aliases: ['app:report'],
          hidden: false)]` configure?
        answers:
          - value: "The primary name, an alternative name (alias), and that it appears in `list`"
            correct: true
          - value: "Two independent commands sharing one class"
            correct: false
          - value: "A required argument named app:report"
            correct: false
          - value: "A namespace restriction so it only runs under app:report"
            correct: false
        explanation: >-
          #[AsCommand] declares metadata: the canonical name, aliases (extra names that
          invoke the same command), and hidden (false = shown in list). It defines one
          command reachable by several names, not multiple commands, and aliases are names
          — not arguments or namespace filters.
        documentation: "https://symfony.com/doc/8.0/console.html"

      - id: "CON-CONFIG-08"
        type: "debug"
        difficulty: "medium"
        subchapter: "console/configuration"
        concepts: ["lazy-loading", "setName", "performance"]
        syllabus: "Console → Configuration"
        question: >-
          After moving the command name from #[AsCommand] into `setName()` in configure(),
          `bin/console list` becomes noticeably slower on a large app. Why?
        answers:
          - value: "The Application must now instantiate every command to learn its name, defeating lazy loading"
            correct: true
          - value: "configure() is called twice per command"
            correct: false
          - value: "setName() disables the container cache"
            correct: false
          - value: "list rebuilds the cache when names are dynamic"
            correct: false
        explanation: >-
          When the name lives only in configure(), the ContainerCommandLoader can no longer
          map name→id at compile time, so the Application constructs each command just to
          read its name — eager instantiation. Keeping the name in #[AsCommand] preserves
          lazy loading. configure() is not called twice, and setName() does not touch the
          container cache.
        documentation: "https://symfony.com/doc/8.0/console/commands_as_services.html"

  - name: "Console — Arguments & options"
    questions:
      - id: "CON-OPTARG-01"
        type: "single"
        difficulty: "easy"
        subchapter: "console/options-arguments"
        concepts: ["input-option", "value-none", "flag"]
        syllabus: "Console → Arguments & Options"
        question: "Which mode declares a valueless boolean flag option?"
        answers:
          - value: "InputOption::VALUE_NONE"
            correct: true
          - value: "InputOption::VALUE_OPTIONAL"
            correct: false
          - value: "InputOption::VALUE_REQUIRED"
            correct: false
          - value: "InputArgument::OPTIONAL"
            correct: false
        explanation: >-
          VALUE_NONE takes no value; the option is false unless present, then true. It
          cannot carry a default. VALUE_OPTIONAL/REQUIRED expect a value, and
          InputArgument::OPTIONAL is an argument mode, not an option mode.
        documentation: "https://symfony.com/doc/8.0/console/input.html"

      - id: "CON-OPTARG-02"
        type: "single"
        difficulty: "medium"
        subchapter: "console/options-arguments"
        concepts: ["input-option", "modes", "bitmask"]
        syllabus: "Console → Arguments & Options"
        question: "What is the integer value of InputOption::VALUE_IS_ARRAY?"
        answers:
          - value: "8"
            correct: true
          - value: "2"
            correct: false
          - value: "4"
            correct: false
          - value: "16"
            correct: false
        explanation: >-
          Option modes are VALUE_NONE=1, VALUE_REQUIRED=2, VALUE_OPTIONAL=4,
          VALUE_IS_ARRAY=8, VALUE_NEGATABLE=16. They are powers of two so they can be
          combined with a bitmask (e.g. VALUE_REQUIRED | VALUE_IS_ARRAY = 10).
        documentation: "https://symfony.com/doc/8.0/console/input.html"

      - id: "CON-OPTARG-03"
        type: "trap"
        difficulty: "medium"
        subchapter: "console/options-arguments"
        concepts: ["input-argument", "is-array", "ordering"]
        syllabus: "Console → Arguments & Options"
        question: "Which statement about an IS_ARRAY argument is correct?"
        answers:
          - value: "There can be only one and it must be declared last"
            correct: true
          - value: "It must be declared first"
            correct: false
          - value: "You may declare several per command"
            correct: false
          - value: "It cannot be combined with REQUIRED"
            correct: false
        explanation: >-
          An array argument greedily consumes all remaining tokens, so only one is allowed
          and it must come last. It may be combined as IS_ARRAY | REQUIRED or IS_ARRAY |
          OPTIONAL. Declaring it first or having several would make positional parsing
          ambiguous.
        documentation: "https://symfony.com/doc/8.0/console/input.html"

      - id: "CON-OPTARG-04"
        type: "single"
        difficulty: "medium"
        subchapter: "console/options-arguments"
        concepts: ["input-option", "negatable"]
        syllabus: "Console → Arguments & Options"
        question: "Which option mode adds a `--no-foo` counterpart to `--foo`?"
        answers:
          - value: "InputOption::VALUE_NEGATABLE"
            correct: true
          - value: "InputOption::VALUE_NONE"
            correct: false
          - value: "InputOption::VALUE_OPTIONAL"
            correct: false
          - value: "InputOption::VALUE_IS_ARRAY"
            correct: false
        explanation: >-
          VALUE_NEGATABLE (16) generates the --no- twin: the value is true with --foo,
          false with --no-foo, and its default otherwise. VALUE_NONE is a plain flag with
          no negation, and the array/optional modes are unrelated.
        documentation: "https://symfony.com/doc/8.0/console/input.html"

      - id: "CON-OPTARG-05"
        type: "single"
        difficulty: "easy"
        subchapter: "console/options-arguments"
        concepts: ["input-argument", "modes", "optional"]
        syllabus: "Console → Arguments & Options"
        question: "Which InputArgument mode value is OPTIONAL?"
        answers:
          - value: "2"
            correct: true
          - value: "1"
            correct: false
          - value: "4"
            correct: false
          - value: "8"
            correct: false
        explanation: >-
          Argument modes are REQUIRED=1, OPTIONAL=2, IS_ARRAY=4. Note these differ from
          option modes (where 2 is VALUE_REQUIRED) — mixing the two integer scales is a
          common exam trap.
        documentation: "https://symfony.com/doc/8.0/console/input.html"

      - id: "CON-OPTARG-06"
        type: "debug"
        difficulty: "medium"
        subchapter: "console/options-arguments"
        concepts: ["value-none", "default", "logic-exception"]
        syllabus: "Console → Arguments & Options"
        question: >-
          `$this->addOption('force', 'f', InputOption::VALUE_NONE, 'Force it', true);`
          throws when the command is built. Why?
        answers:
          - value: "A VALUE_NONE option cannot have a default value"
            correct: true
          - value: "The shortcut 'f' collides with a reserved global shortcut"
            correct: false
          - value: "VALUE_NONE options require an array default"
            correct: false
          - value: "Options may not have both a shortcut and a description"
            correct: false
        explanation: >-
          A VALUE_NONE option is always false unless present (then true), so providing a
          default is meaningless and InputOption's constructor throws a LogicException.
          Passing null (or omitting the default) is correct. Shortcuts and descriptions are
          perfectly allowed together.
        documentation: "https://symfony.com/doc/8.0/console/input.html"

      - id: "CON-OPTARG-07"
        type: "code"
        difficulty: "hard"
        subchapter: "console/options-arguments"
        concepts: ["invokable", "attribute", "array", "modes"]
        syllabus: "Console → Arguments & Options"
        question: >-
          In an invokable command, `#[Option] array $tags = []` on the __invoke()
          parameter produces which InputOption mode?
        answers:
          - value: "VALUE_IS_ARRAY (repeatable, e.g. --tags=a --tags=b), optional via the [] default"
            correct: true
          - value: "VALUE_NONE, because arrays are treated as flags"
            correct: false
          - value: "VALUE_REQUIRED with a single string value"
            correct: false
          - value: "It is rejected — arrays are only allowed for arguments"
            correct: false
        explanation: >-
          The invokable adapter maps an array-typed #[Option] to VALUE_IS_ARRAY, so the
          option is repeatable; the [] default makes it optional. A bool would map to
          VALUE_NONE, a scalar with no default to VALUE_REQUIRED. Arrays are valid for both
          options and (as the last) arguments.
        documentation: "https://symfony.com/doc/8.0/console/input.html"

      - id: "CON-OPTARG-08"
        type: "trap"
        difficulty: "easy"
        subchapter: "console/options-arguments"
        concepts: ["shortcut", "arguments", "options"]
        syllabus: "Console → Arguments & Options"
        question: "Which is true about shortcuts like `-f`?"
        answers:
          - value: "Shortcuts belong to options only; arguments have no shortcuts"
            correct: true
          - value: "Every argument automatically gets a one-letter shortcut"
            correct: false
          - value: "Shortcuts are only for VALUE_NONE options"
            correct: false
          - value: "Shortcuts must be exactly two characters"
            correct: false
        explanation: >-
          Only options accept a shortcut (the 2nd argument of addOption); arguments are
          positional and have no shortcut. Shortcuts work for any option mode, not just
          VALUE_NONE, and are typically a single character (e.g. -f).
        documentation: "https://symfony.com/doc/8.0/console/input.html"

      - id: "CON-OPTARG-09"
        type: "internals"
        difficulty: "hard"
        subchapter: "console/options-arguments"
        concepts: ["input-definition", "bind", "validate"]
        syllabus: "Console → Arguments & Options"
        question: "What role does InputDefinition play during a command run?"
        answers:
          - value: "$input->bind(definition) maps raw ArgvInput tokens to args/options; $input->validate() then throws if a REQUIRED value is missing"
            correct: true
          - value: "It renders help text only and has no effect on parsing"
            correct: false
          - value: "It executes the command after parsing"
            correct: false
          - value: "It stores the exit code after execution"
            correct: false
        explanation: >-
          InputDefinition is the ordered set of InputArguments plus the map of
          InputOptions. run() calls $input->bind($definition) to match raw tokens, then
          $input->validate() throws a Console RuntimeException if a REQUIRED argument or
          VALUE_REQUIRED option value is absent. It does not execute the command or hold
          exit codes; help rendering is a separate use of the same definition.
        documentation: "https://symfony.com/doc/8.0/console/input.html"

      - id: "CON-OPTARG-10"
        type: "single"
        difficulty: "medium"
        subchapter: "console/options-arguments"
        concepts: ["input-argument", "ordering", "validation"]
        syllabus: "Console → Arguments & Options"
        question: "Which argument declaration order is INVALID?"
        answers:
          - value: "A REQUIRED argument declared after an OPTIONAL one"
            correct: true
          - value: "A REQUIRED argument followed by an OPTIONAL one"
            correct: false
          - value: "A single OPTIONAL argument"
            correct: false
          - value: "A REQUIRED argument followed by an IS_ARRAY argument"
            correct: false
        explanation: >-
          Because arguments are positional, a REQUIRED argument may not follow an OPTIONAL
          one — the parser could not tell which token filled which slot. Required-then-
          optional is fine, a lone optional is fine, and an array argument (last) may
          follow a required scalar.
        documentation: "https://symfony.com/doc/8.0/console/input.html"

  - name: "Console — Input & output"
    questions:
      - id: "CON-IO-01"
        type: "trap"
        difficulty: "medium"
        subchapter: "console/input-output"
        concepts: ["stderr", "console-output-interface", "streams"]
        syllabus: "Console → Input & Output"
        question: "Which method returns the STDERR stream in a CLI command?"
        answers:
          - value: "ConsoleOutputInterface::getErrorOutput()"
            correct: true
          - value: "OutputInterface::getErrorOutput()"
            correct: false
          - value: "SymfonyStyle::stderr()"
            correct: false
          - value: "InputInterface::getError()"
            correct: false
        explanation: >-
          getErrorOutput() lives on ConsoleOutputInterface, not the base OutputInterface —
          so guard with `instanceof ConsoleOutputInterface` before calling it, or you risk
          a fatal type error. SymfonyStyle exposes getErrorStyle() (not stderr()), and
          input has nothing to do with error streams.
        documentation: "https://symfony.com/doc/8.0/console/verbosity.html"

      - id: "CON-IO-02"
        type: "single"
        difficulty: "easy"
        subchapter: "console/input-output"
        concepts: ["symfony-style", "constructor"]
        syllabus: "Console → Input & Output"
        question: "Which two arguments does SymfonyStyle require?"
        answers:
          - value: "An InputInterface and an OutputInterface"
            correct: true
          - value: "An Application and a Command"
            correct: false
          - value: "A QuestionHelper and an OutputInterface"
            correct: false
          - value: "Only an OutputInterface"
            correct: false
        explanation: >-
          SymfonyStyle wraps both input (for prompts like ask/confirm) and output (for
          styled writing), so its constructor is (InputInterface, OutputInterface). It
          creates its own QuestionHelper internally and needs neither an Application nor a
          Command.
        documentation: "https://symfony.com/doc/8.0/console/style.html"

      - id: "CON-IO-03"
        type: "single"
        difficulty: "medium"
        subchapter: "console/input-output"
        concepts: ["sections", "console-section-output"]
        syllabus: "Console → Input & Output"
        question: "What does $output->section() return?"
        answers:
          - value: "A ConsoleSectionOutput that can be overwritten or cleared independently"
            correct: true
          - value: "A new Application"
            correct: false
          - value: "A SymfonyStyle instance"
            correct: false
          - value: "A boolean"
            correct: false
        explanation: >-
          Output sections are independently re-writable regions (ConsoleSectionOutput):
          you can overwrite() or clear() one without disturbing others — the basis for
          multiple live progress bars. section() is only available on
          ConsoleOutputInterface (real CLI output).
        documentation: "https://symfony.com/doc/8.0/console.html"

      - id: "CON-IO-04"
        type: "single"
        difficulty: "easy"
        subchapter: "console/input-output"
        concepts: ["write", "writeln", "output"]
        syllabus: "Console → Input & Output"
        question: "What is the difference between write() and writeln()?"
        answers:
          - value: "writeln() appends a newline; write() does not"
            correct: true
          - value: "write() sends to STDERR, writeln() to STDOUT"
            correct: false
          - value: "writeln() disables ANSI colours"
            correct: false
          - value: "They are identical aliases"
            correct: false
        explanation: >-
          writeln() is write() plus a trailing line break; neither changes the target
          stream (both go to STDOUT unless you fetch the error output) and neither toggles
          colours. Both accept an optional verbosity mask as a second argument.
        documentation: "https://symfony.com/doc/8.0/console.html"

      - id: "CON-IO-05"
        type: "trap"
        difficulty: "medium"
        subchapter: "console/input-output"
        concepts: ["symfony-style", "output-interface", "polymorphism"]
        syllabus: "Console → Input & Output"
        question: "Why can a SymfonyStyle instance be passed to a method type-hinted OutputInterface?"
        answers:
          - value: "SymfonyStyle implements OutputInterface (it decorates the underlying output)"
            correct: true
          - value: "The Console component casts it automatically"
            correct: false
          - value: "OutputInterface is a marker interface with no methods"
            correct: false
          - value: "It cannot — SymfonyStyle is unrelated to OutputInterface"
            correct: false
        explanation: >-
          SymfonyStyle implements both StyleInterface and OutputInterface, decorating the
          wrapped output, so it satisfies an OutputInterface type-hint directly — no cast
          needed. OutputInterface is a full contract (write/writeln/verbosity), not a
          marker.
        documentation: "https://symfony.com/doc/8.0/console/style.html"

      - id: "CON-IO-06"
        type: "scenario"
        difficulty: "medium"
        subchapter: "console/input-output"
        concepts: ["stdout", "stderr", "piping"]
        syllabus: "Console → Input & Output"
        question: >-
          A command exports CSV to STDOUT so users can run `bin/console app:export >
          data.csv`, yet you still want a live progress message on screen. Where should
          the progress message go?
        answers:
          - value: "To STDERR via getErrorOutput(), keeping STDOUT clean for the piped CSV"
            correct: true
          - value: "To STDOUT interleaved with the CSV rows"
            correct: false
          - value: "To a log file only; the terminal cannot show it"
            correct: false
          - value: "Nowhere — progress bars break redirection entirely"
            correct: false
        explanation: >-
          Data belongs on STDOUT (what the redirection captures); status/progress belongs
          on STDERR, which still displays on the terminal when STDOUT is piped to a file.
          Writing progress to STDOUT would corrupt the CSV. This split-stream design is why
          getErrorOutput() exists.
        documentation: "https://symfony.com/doc/8.0/console/verbosity.html"

      - id: "CON-IO-07"
        type: "debug"
        difficulty: "medium"
        subchapter: "console/input-output"
        concepts: ["stderr", "type-error", "console-output-interface"]
        syllabus: "Console → Input & Output"
        question: >-
          `execute(InputInterface $input, OutputInterface $output)` calls
          `$output->getErrorOutput()`. It works locally but fatals in a test. Likely cause?
        answers:
          - value: "The test passes a plain OutputInterface (e.g. BufferedOutput) that has no getErrorOutput(); guard with instanceof ConsoleOutputInterface"
            correct: true
          - value: "getErrorOutput() was removed in Symfony 8"
            correct: false
          - value: "STDERR is unavailable during PHPUnit runs"
            correct: false
          - value: "You must call setErrorOutput() first"
            correct: false
        explanation: >-
          getErrorOutput() is declared on ConsoleOutputInterface, not the base
          OutputInterface. Real CLI runs inject a ConsoleOutput (which implements it), but
          tests often inject a BufferedOutput, so the call fatals. Guarding with `if
          ($output instanceof ConsoleOutputInterface)` fixes it. The method still exists in
          Symfony 8 and needs no setter.
        documentation: "https://symfony.com/doc/8.0/console/verbosity.html"

      - id: "CON-IO-08"
        type: "single"
        difficulty: "easy"
        subchapter: "console/input-output"
        concepts: ["input-interface", "interactive"]
        syllabus: "Console → Input & Output"
        question: "Which InputInterface method reports whether the command may prompt the user?"
        answers:
          - value: "isInteractive()"
            correct: true
          - value: "isVerbose()"
            correct: false
          - value: "hasArgument('interactive')"
            correct: false
          - value: "getOption('interaction')"
            correct: false
        explanation: >-
          InputInterface::isInteractive() returns false under -n/--no-interaction, and the
          runner uses it to decide whether interact() runs; guard prompts with it.
          isVerbose() is an output verbosity check, not interactivity, and there is no
          built-in 'interactive' argument/option to read.
        documentation: "https://symfony.com/doc/8.0/console.html"

  - name: "Console — Helpers"
    questions:
      - id: "CON-HELPERS-01"
        type: "single"
        difficulty: "medium"
        subchapter: "console/helpers"
        concepts: ["question-helper", "helper-set", "get-helper"]
        syllabus: "Console → Helpers"
        question: "How does a classic command obtain the QuestionHelper?"
        answers:
          - value: "$this->getHelper('question')"
            correct: true
          - value: "new QuestionHelper($input)"
            correct: false
          - value: "$this->getApplication()->question()"
            correct: false
          - value: "SymfonyStyle::helper()"
            correct: false
        explanation: >-
          Helpers are fetched by their string name from the command's HelperSet, so
          getHelper('question') returns the QuestionHelper. QuestionHelper's constructor
          takes no input, there is no Application::question(), and SymfonyStyle exposes
          ask()/confirm() rather than a helper() accessor.
        documentation: "https://symfony.com/doc/8.0/components/console/helpers/questionhelper.html"

      - id: "CON-HELPERS-02"
        type: "single"
        difficulty: "easy"
        subchapter: "console/helpers"
        concepts: ["choice-question", "prompts"]
        syllabus: "Console → Helpers"
        question: "Which question class offers a fixed list of selectable answers?"
        answers:
          - value: "ChoiceQuestion"
            correct: true
          - value: "Question"
            correct: false
          - value: "ConfirmationQuestion"
            correct: false
          - value: "HiddenQuestion"
            correct: false
        explanation: >-
          ChoiceQuestion presents a list of options and supports single or multi-select.
          Question is free text, ConfirmationQuestion is yes/no, and there is no
          HiddenQuestion class — hidden input is Question::setHidden(true).
        documentation: "https://symfony.com/doc/8.0/components/console/helpers/questionhelper.html"

      - id: "CON-HELPERS-03"
        type: "single"
        difficulty: "medium"
        subchapter: "console/helpers"
        concepts: ["progress-bar", "redraw-frequency", "performance"]
        syllabus: "Console → Helpers"
        question: "What does ProgressBar::setRedrawFrequency(100) do?"
        answers:
          - value: "Redraws the bar only every 100 steps to reduce terminal I/O"
            correct: true
          - value: "Sets the total number of steps to 100"
            correct: false
          - value: "Caps the bar width at 100 characters"
            correct: false
          - value: "Sleeps 100 ms between steps"
            correct: false
        explanation: >-
          Redraw throttling avoids expensive terminal writes on every micro-step — a
          performance knob, not cosmetic. The total is set via the constructor/ start($max),
          width is a separate format setting, and it never sleeps.
        documentation: "https://symfony.com/doc/8.0/components/console/helpers/progressbar.html"

      - id: "CON-HELPERS-04"
        type: "single"
        difficulty: "easy"
        subchapter: "console/helpers"
        concepts: ["cursor", "ansi", "terminal"]
        syllabus: "Console → Helpers"
        question: "Which class moves or hides the terminal cursor?"
        answers:
          - value: "Symfony\\Component\\Console\\Cursor"
            correct: true
          - value: "FormatterHelper"
            correct: false
          - value: "Table"
            correct: false
          - value: "ProgressBar"
            correct: false
        explanation: >-
          Cursor issues ANSI escape sequences to move/hide/show the cursor and clear
          lines. FormatterHelper formats text blocks, Table renders data, and ProgressBar
          shows progress — none of them is the cursor primitive.
        documentation: "https://symfony.com/doc/8.0/components/console/helpers/index.html"

      - id: "CON-HELPERS-05"
        type: "trap"
        difficulty: "hard"
        subchapter: "console/helpers"
        concepts: ["invokable", "get-helper", "helper-set"]
        syllabus: "Console → Helpers"
        question: "Why can't an invokable command call `$this->getHelper('question')`?"
        answers:
          - value: "It does not extend Command, so it has no HelperSet accessor — inject services or use SymfonyStyle instead"
            correct: true
          - value: "getHelper() was removed in Symfony 8"
            correct: false
          - value: "Helpers only exist for progress bars"
            correct: false
          - value: "Invokable commands run without an Application"
            correct: false
        explanation: >-
          getHelper() is a protected method on the Command base class; an invokable
          command extends nothing, so it has no HelperSet accessor. The idiomatic solution
          is to type-hint SymfonyStyle in __invoke() (which wraps QuestionHelper) or inject
          the collaborators you need. getHelper() still exists for classic commands.
        documentation: "https://symfony.com/doc/8.0/components/console/helpers/questionhelper.html"

      - id: "CON-HELPERS-06"
        type: "code"
        difficulty: "medium"
        subchapter: "console/helpers"
        concepts: ["choice-question", "multiselect"]
        syllabus: "Console → Helpers"
        question: >-
          You need the user to pick several roles at once from a list. How do you configure
          a ChoiceQuestion?
        answers:
          - value: "Create the ChoiceQuestion and call setMultiselect(true) so it returns an array of selections"
            correct: true
          - value: "Use ConfirmationQuestion in a loop"
            correct: false
          - value: "Pass an array as the default; multiselect is automatic"
            correct: false
          - value: "Multiselect requires a separate MultiChoiceQuestion class"
            correct: false
        explanation: >-
          ChoiceQuestion::setMultiselect(true) lets the user choose comma-separated values
          and returns them as an array. Without it, only one selection is returned. There
          is no MultiChoiceQuestion class, and passing an array default does not enable
          multiselect on its own.
        documentation: "https://symfony.com/doc/8.0/components/console/helpers/questionhelper.html"

      - id: "CON-HELPERS-07"
        type: "internals"
        difficulty: "medium"
        subchapter: "console/helpers"
        concepts: ["helper-set", "keys", "application"]
        syllabus: "Console → Helpers"
        question: "How is the HelperSet organised and populated for a classic command?"
        answers:
          - value: "The Application populates it with default helpers keyed by name (question, formatter, process, debug_formatter)"
            correct: true
          - value: "Each command builds its own empty HelperSet in configure()"
            correct: false
          - value: "Helpers are keyed by their FQCN, not a short name"
            correct: false
          - value: "The container autowires helpers into command properties"
            correct: false
        explanation: >-
          The Application seeds each command's HelperSet with default helpers, addressable
          by short string keys (question, formatter, process, debug_formatter), which is
          why getHelper('question') works. They are keyed by name, not FQCN, and are not
          autowired container services.
        documentation: "https://symfony.com/doc/8.0/components/console/helpers/index.html"

  - name: "Console — Events"
    questions:
      - id: "CON-EVENTS-01"
        type: "internals"
        difficulty: "medium"
        subchapter: "console/events"
        concepts: ["console-events", "order", "terminate"]
        syllabus: "Console → Events"
        question: "What is the dispatch order for a successful framework command?"
        answers:
          - value: "COMMAND then TERMINATE"
            correct: true
          - value: "TERMINATE then COMMAND"
            correct: false
          - value: "ERROR then COMMAND"
            correct: false
          - value: "COMMAND then ERROR"
            correct: false
        explanation: >-
          COMMAND fires before execution and TERMINATE always fires last. ERROR fires only
          when a Throwable is raised, so a successful run dispatches just COMMAND →
          TERMINATE (no ERROR).
        documentation: "https://symfony.com/doc/8.0/components/console/events.html"

      - id: "CON-EVENTS-02"
        type: "single"
        difficulty: "medium"
        subchapter: "console/events"
        concepts: ["terminate", "exit-code", "set-exit-code"]
        syllabus: "Console → Events"
        question: "Which event lets you change the exit code regardless of outcome?"
        answers:
          - value: "ConsoleEvents::TERMINATE"
            correct: true
          - value: "ConsoleEvents::COMMAND"
            correct: false
          - value: "ConsoleEvents::SIGNAL"
            correct: false
          - value: "It cannot be changed after execution"
            correct: false
        explanation: >-
          ConsoleTerminateEvent::setExitCode() runs on every command (success or failure)
          and is the last chance to alter the process exit code. COMMAND runs before
          execution, and SIGNAL only fires when a subscribed OS signal arrives.
        documentation: "https://symfony.com/doc/8.0/components/console/events.html"

      - id: "CON-EVENTS-03"
        type: "single"
        difficulty: "hard"
        subchapter: "console/events"
        concepts: ["command-event", "disable-command", "exit-code"]
        syllabus: "Console → Events"
        question: "What exit code results from ConsoleCommandEvent::disableCommand()?"
        answers:
          - value: "113"
            correct: true
          - value: "0"
            correct: false
          - value: "1"
            correct: false
          - value: "255"
            correct: false
        explanation: >-
          Disabling the command in the COMMAND event skips execution and returns
          ConsoleCommandEvent::RETURN_CODE_DISABLED, which is 113 — neither SUCCESS (0),
          FAILURE (1), nor 255.
        documentation: "https://symfony.com/doc/8.0/components/console/events.html"

      - id: "CON-EVENTS-04"
        type: "single"
        difficulty: "medium"
        subchapter: "console/events"
        concepts: ["signals", "signalable-command-interface", "pcntl"]
        syllabus: "Console → Events"
        question: "Which interface lets a command react to OS signals such as SIGTERM?"
        answers:
          - value: "SignalableCommandInterface"
            correct: true
          - value: "SignalHandlerInterface"
            correct: false
          - value: "TerminableInterface"
            correct: false
          - value: "EventSubscriberInterface"
            correct: false
        explanation: >-
          Implement SignalableCommandInterface's getSubscribedSignals() and handleSignal();
          it requires the pcntl extension. SignalHandlerInterface and TerminableInterface do
          not exist for this, and EventSubscriberInterface is generic event wiring, not
          signal handling.
        documentation: "https://symfony.com/doc/8.0/components/console/events.html"

      - id: "CON-EVENTS-05"
        type: "internals"
        difficulty: "hard"
        subchapter: "console/events"
        concepts: ["console-events", "error", "order"]
        syllabus: "Console → Events"
        question: "A command's execute() throws a RuntimeException. What is the event sequence?"
        answers:
          - value: "COMMAND → ERROR → TERMINATE (TERMINATE still runs after ERROR)"
            correct: true
          - value: "COMMAND → TERMINATE only (ERROR is skipped for RuntimeException)"
            correct: false
          - value: "ERROR → COMMAND → TERMINATE"
            correct: false
          - value: "ERROR only; the process aborts before TERMINATE"
            correct: false
        explanation: >-
          COMMAND fires before execution; the thrown Throwable triggers ERROR
          (ConsoleErrorEvent, where a listener can change the exit code or swap the
          exception); TERMINATE always fires last, even after an error. ERROR never runs
          before COMMAND, and it does not suppress TERMINATE.
        documentation: "https://symfony.com/doc/8.0/components/console/events.html"

      - id: "CON-EVENTS-06"
        type: "code"
        difficulty: "hard"
        subchapter: "console/events"
        concepts: ["signalable-command-interface", "handle-signal", "signature"]
        syllabus: "Console → Events"
        question: >-
          What is the correct signature of handleSignal() in Symfony 8's
          SignalableCommandInterface?
        answers:
          - value: "handleSignal(int $signal, int|false $previousExitCode = 0): int|false"
            correct: true
          - value: "handleSignal(Signal $signal): void"
            correct: false
          - value: "handleSignal(int $signal): bool"
            correct: false
          - value: "onSignal(int $signal, OutputInterface $output): int"
            correct: false
        explanation: >-
          handleSignal receives the signal number and the previous exit code, returning an
          int to set the exit code or false to let the process continue running. The method
          is named handleSignal (not onSignal), takes an int signal (not a Signal object),
          and returns int|false rather than a plain bool/void.
        documentation: "https://symfony.com/doc/8.0/components/console/events.html"

      - id: "CON-EVENTS-07"
        type: "trap"
        difficulty: "medium"
        subchapter: "console/events"
        concepts: ["dispatcher", "standalone", "framework"]
        syllabus: "Console → Events"
        question: "When are ConsoleEvents actually dispatched?"
        answers:
          - value: "Only when the Application has an EventDispatcher (as in the framework); a bare Console app fires none"
            correct: true
          - value: "Always, even in a standalone Console component with no dispatcher"
            correct: false
          - value: "Only in the prod environment"
            correct: false
          - value: "Only for commands that implement EventSubscriberInterface"
            correct: false
        explanation: >-
          ConsoleEvents require an EventDispatcher wired into the Application via
          setDispatcher(). The full-stack framework does this automatically, but a bare
          Console app without a dispatcher fires no COMMAND/ERROR/TERMINATE events. It is
          not environment-scoped, and command interfaces do not gate dispatching.
        documentation: "https://symfony.com/doc/8.0/components/console/events.html"

      - id: "CON-EVENTS-08"
        type: "scenario"
        difficulty: "hard"
        subchapter: "console/events"
        concepts: ["exit-code", "clamping", "signals"]
        syllabus: "Console → Events"
        question: "A command returns 300 as its exit code. What does the process actually exit with?"
        answers:
          - value: "44 — exit codes are clamped to 0–255 via % 256 (300 % 256 = 44)"
            correct: true
          - value: "300 — Symfony passes it through unchanged"
            correct: false
          - value: "255 — anything above 255 becomes 255"
            correct: false
          - value: "1 — out-of-range codes fall back to FAILURE"
            correct: false
        explanation: >-
          POSIX exit codes are a single byte (0–255), so Symfony normalises out-of-range
          values with % 256; 300 % 256 = 44. It is not passed through, not capped at 255,
          and not coerced to FAILURE. By convention a signal-terminated process exits with
          128 + signalNumber.
        documentation: "https://symfony.com/doc/8.0/components/console/events.html"

      - id: "CON-EVENTS-09"
        type: "config"
        difficulty: "medium"
        subchapter: "console/events"
        concepts: ["as-event-listener", "terminate", "listener"]
        syllabus: "Console → Events"
        question: >-
          What does `#[AsEventListener(event: ConsoleEvents::TERMINATE)]` on an
          `__invoke(ConsoleTerminateEvent $event)` class achieve?
        answers:
          - value: "Registers the class as a listener that runs after every command, able to read/set the exit code"
            correct: true
          - value: "Registers a new console command named terminate"
            correct: false
          - value: "Subscribes the class to HTTP kernel.terminate instead"
            correct: false
          - value: "Runs the listener only when a command fails"
            correct: false
        explanation: >-
          #[AsEventListener] autoconfigures the class as an event listener for
          ConsoleEvents::TERMINATE, so __invoke() runs after every command with a
          ConsoleTerminateEvent exposing getExitCode()/setExitCode(). It is a console event,
          distinct from kernel.terminate, runs on success and failure alike, and does not
          define a command.
        documentation: "https://symfony.com/doc/8.0/components/console/events.html"

  - name: "Console — Verbosity"
    questions:
      - id: "CON-VERBOSITY-01"
        type: "single"
        difficulty: "easy"
        subchapter: "console/verbosity"
        concepts: ["verbosity", "flags", "very-verbose"]
        syllabus: "Console → Verbosity"
        question: "Which flag maps to VERBOSITY_VERY_VERBOSE?"
        answers:
          - value: "-vv"
            correct: true
          - value: "-v"
            correct: false
          - value: "-vvv"
            correct: false
          - value: "-q"
            correct: false
        explanation: >-
          -v is VERBOSE (64), -vv is VERY_VERBOSE (128), -vvv is DEBUG (256), and -q is
          QUIET (16). The number of v's maps directly to the level.
        documentation: "https://symfony.com/doc/8.0/console/verbosity.html"

      - id: "CON-VERBOSITY-02"
        type: "single"
        difficulty: "easy"
        subchapter: "console/verbosity"
        concepts: ["verbosity", "constants", "normal"]
        syllabus: "Console → Verbosity"
        question: "What is the integer value of VERBOSITY_NORMAL?"
        answers:
          - value: "32"
            correct: true
          - value: "0"
            correct: false
          - value: "16"
            correct: false
          - value: "64"
            correct: false
        explanation: >-
          The constants are QUIET=16, NORMAL=32, VERBOSE=64, VERY_VERBOSE=128, DEBUG=256.
          NORMAL is 32, not 0 (0 is not used) — memorising this 16/32/64/128/256 ladder is
          exam-critical.
        documentation: "https://symfony.com/doc/8.0/console/verbosity.html"

      - id: "CON-VERBOSITY-03"
        type: "trap"
        difficulty: "medium"
        subchapter: "console/verbosity"
        concepts: ["verbosity", "output", "set-verbosity"]
        syllabus: "Console → Verbosity"
        question: "Where is the current verbosity level stored?"
        answers:
          - value: "On the OutputInterface, set by the Application from the flags"
            correct: true
          - value: "On the InputInterface"
            correct: false
          - value: "On the Command instance"
            correct: false
          - value: "In an environment variable only"
            correct: false
        explanation: >-
          The Application parses -v/-vv/-vvv/-q before dispatching and calls
          $output->setVerbosity(); verbosity is a property of the output, queried via
          isVerbose()/isDebug(). Reading it from the input is a classic mistake — the input
          carries the raw flags, but the resolved level lives on the output.
        documentation: "https://symfony.com/doc/8.0/console/verbosity.html"

      - id: "CON-VERBOSITY-04"
        type: "single"
        difficulty: "medium"
        subchapter: "console/verbosity"
        concepts: ["verbosity", "message-level", "comparison"]
        syllabus: "Console → Verbosity"
        question: "A message written with VERBOSITY_VERBOSE is displayed at which levels?"
        answers:
          - value: "-v, -vv and -vvv"
            correct: true
          - value: "only -v"
            correct: false
          - value: "normal and above"
            correct: false
          - value: "-q and above"
            correct: false
        explanation: >-
          A message prints when the current level is >= the message's level. VERBOSE is 64,
          so it shows at -v (64), -vv (128) and -vvv (256), but not at normal (32) or quiet
          (16).
        documentation: "https://symfony.com/doc/8.0/console/verbosity.html"

      - id: "CON-VERBOSITY-05"
        type: "multiple"
        difficulty: "medium"
        subchapter: "console/verbosity"
        concepts: ["verbosity", "constants", "values"]
        syllabus: "Console → Verbosity"
        question: "Which of these VERBOSITY constant/value pairs are correct? (choose 2)"
        answers:
          - value: "VERBOSITY_QUIET = 16"
            correct: true
          - value: "VERBOSITY_DEBUG = 256"
            correct: true
          - value: "VERBOSITY_NORMAL = 0"
            correct: false
          - value: "VERBOSITY_VERBOSE = 100"
            correct: false
        explanation: >-
          The ladder is QUIET=16, NORMAL=32, VERBOSE=64, VERY_VERBOSE=128, DEBUG=256, so
          QUIET=16 and DEBUG=256 are correct. NORMAL is 32 (not 0) and VERBOSE is 64 (not
          100). The values are powers of two starting at 16.
        documentation: "https://symfony.com/doc/8.0/console/verbosity.html"

      - id: "CON-VERBOSITY-06"
        type: "code"
        difficulty: "medium"
        subchapter: "console/verbosity"
        concepts: ["verbosity", "message-mask", "writeln"]
        syllabus: "Console → Verbosity"
        question: >-
          `$output->writeln('trace', OutputInterface::VERBOSITY_DEBUG);` — when is 'trace'
          printed?
        answers:
          - value: "Only at -vvv (DEBUG), because the line prints only when the current level >= DEBUG"
            correct: true
          - value: "At every level, since a mask only affects colour"
            correct: false
          - value: "At -v and above"
            correct: false
          - value: "Never, because writeln ignores the second argument"
            correct: false
        explanation: >-
          The second argument is a verbosity mask; the line prints only if the output's
          current level is >= the message level. DEBUG (256) is the highest, so 'trace'
          appears only under -vvv. writeln does honour the mask, and the mask governs
          visibility, not colour.
        documentation: "https://symfony.com/doc/8.0/console/verbosity.html"

      - id: "CON-VERBOSITY-07"
        type: "trap"
        difficulty: "medium"
        subchapter: "console/verbosity"
        concepts: ["quiet", "execution", "output"]
        syllabus: "Console → Verbosity"
        question: "What does passing -q (VERBOSITY_QUIET) actually do?"
        answers:
          - value: "It silences normal output but the command still runs and returns its exit code"
            correct: true
          - value: "It skips execution entirely"
            correct: false
          - value: "It forces the command into non-interactive mode"
            correct: false
          - value: "It suppresses the exit code so the shell always sees 0"
            correct: false
        explanation: >-
          -q sets QUIET (16), which suppresses normal output; the command executes fully
          and returns its real exit code (scripts can still branch on it). It does not skip
          execution, does not change interactivity (that is -n), and does not alter the exit
          code. Assuming -q skips work is a common trap.
        documentation: "https://symfony.com/doc/8.0/console/verbosity.html"

      - id: "CON-VERBOSITY-08"
        type: "single"
        difficulty: "easy"
        subchapter: "console/verbosity"
        concepts: ["verbosity", "guards", "is-debug"]
        syllabus: "Console → Verbosity"
        question: "Which guard should wrap a full payload dump so it only shows at -vvv?"
        answers:
          - value: "if ($output->isDebug()) { ... }"
            correct: true
          - value: "if ($output->isVerbose()) { ... }"
            correct: false
          - value: "if ($input->isInteractive()) { ... }"
            correct: false
          - value: "if ($output->isQuiet()) { ... }"
            correct: false
        explanation: >-
          isDebug() is true only at -vvv (DEBUG=256), the right guard for the most verbose
          diagnostics. isVerbose() is true from -v upward (too broad here), isInteractive()
          is about prompting not verbosity, and isQuiet() is the opposite end of the scale.
        documentation: "https://symfony.com/doc/8.0/console/verbosity.html"
  - name: "Console — Multiple Choice Drills"
    questions:
      - id: "CONS-MC-01"
        type: "multiple"
        difficulty: "hard"
        subchapter: "console/options-arguments"
        concepts: ["arguments", "options", "VALUE_NONE", "NEGATABLE"]
        syllabus: "Console → Arguments & Options"
        question: "Which statements about console arguments and options are correct? (select all that apply)"
        answers:
          - value: "Arguments are positional, while options are named and may define a one-letter shortcut"
            correct: true
          - value: "An option defined with InputOption::VALUE_NONE acts as a flag: it accepts no value and has no default"
            correct: true
          - value: "InputOption::VALUE_NEGATABLE makes the option also accept a --no-* variant"
            correct: true
          - value: "Options are positional and must be passed in the order they were defined"
            correct: false
          - value: "An InputArgument::IS_ARRAY argument can be followed by additional arguments in the definition"
            correct: false
        explanation: >-
          Arguments are bound by position while options are named (with optional -x
          shortcuts) and can appear anywhere on the command line, so options are never
          positional. VALUE_NONE options are pure presence flags with no value or
          default, and VALUE_NEGATABLE (16) adds the negated --no-* form. An IS_ARRAY
          argument swallows all remaining input, so it must be the last argument
          defined.
        documentation: "https://symfony.com/doc/8.0/console/input.html"
      - id: "CONS-MC-02"
        type: "multiple"
        difficulty: "medium"
        subchapter: "console/verbosity"
        concepts: ["verbosity", "quiet", "isDebug", "output"]
        syllabus: "Console → Verbosity"
        question: "Which statements about console verbosity are true? (select all that apply)"
        answers:
          - value: "-q suppresses normal output, but the command still executes fully and returns its real exit code"
            correct: true
          - value: "$output->isDebug() returns true only at the -vvv (DEBUG) level"
            correct: true
          - value: "Verbosity is a property of the input object, read via $input->getVerbosity()"
            correct: false
          - value: "-q also forces the command into non-interactive mode, exactly like -n"
            correct: false
          - value: "-v, -vv and -vvv only change the logger's log level, not what the console prints"
            correct: false
        explanation: >-
          Quiet mode silences output only — execution and the exit code are untouched
          — and isDebug() is the guard that matches exactly the -vvv/DEBUG level.
          Verbosity is a property of the output (OutputInterface constants 16 to 256),
          not of the input; non-interactivity is controlled separately by -n; and the
          verbosity flags directly govern what the console output prints.
        documentation: "https://symfony.com/doc/8.0/console/verbosity.html"
      - id: "CONS-MC-03"
        type: "multiple"
        difficulty: "hard"
        subchapter: "console/events"
        concepts: ["console-events", "disableCommand", "exit-codes", "terminate"]
        syllabus: "Console → Events"
        question: "Which statements about console events and exit codes are correct? (select all that apply)"
        answers:
          - value: "The TERMINATE event is dispatched whether the command succeeds or throws"
            correct: true
          - value: "Calling disableCommand() in a COMMAND event listener skips execution and yields exit code 113"
            correct: true
          - value: "A ConsoleErrorEvent listener can replace the throwable or set a custom exit code"
            correct: true
          - value: "The ERROR event is dispatched on every command run, right before TERMINATE"
            correct: false
          - value: "Exit codes returned by commands can be any integer and are passed to the shell unchanged"
            correct: false
        explanation: >-
          ConsoleTerminateEvent always runs, after success and after errors alike, and
          ConsoleErrorEvent listeners may swap the throwable or call setExitCode().
          disableCommand() short-circuits execution with
          ConsoleCommandEvent::RETURN_CODE_DISABLED (113). The ERROR event fires only
          when a Throwable is thrown, and exit codes are clamped to the 0-255 range
          before reaching the shell.
        documentation: "https://symfony.com/doc/8.0/components/console/events.html"
      - id: "CONS-MC-04"
        type: "multiple"
        difficulty: "medium"
        subchapter: "console/configuration"
        concepts: ["lifecycle", "configure", "AsCommand", "lazy-loading"]
        syllabus: "Console → Configuration"
        question: "Which statements about command configuration and the command lifecycle are true? (select all that apply)"
        answers:
          - value: "configure() is called from the command's constructor, before any input is available"
            correct: true
          - value: "Putting the command name in the #[AsCommand] attribute keeps command loading lazy"
            correct: true
          - value: "interact() runs after execute() so it can ask follow-up questions about the result"
            correct: false
          - value: "initialize() is only invoked when the command runs in interactive mode"
            correct: false
        explanation: >-
          configure() runs in the constructor, which is why it cannot read input, and
          declaring the name in #[AsCommand] lets the application know the command
          without instantiating it, enabling lazy loading. The lifecycle order is
          configure, then initialize, then interact, then execute — interact() runs
          before execute(), and initialize() runs on every execution regardless of
          interactivity.
        documentation: "https://symfony.com/doc/8.0/console.html"
      - id: "CONS-MC-05"
        type: "multiple"
        difficulty: "medium"
        subchapter: "console/custom-commands"
        concepts: ["invokable-commands", "exit-codes", "autoconfiguration", "console.command"]
        syllabus: "Console → Custom commands"
        question: "Which statements about writing custom commands in Symfony 8 are correct? (select all that apply)"
        answers:
          - value: "Invokable commands using __invoke() are the modern default; extending Command still works"
            correct: true
          - value: "Commands should return Command::SUCCESS (0), Command::FAILURE (1) or Command::INVALID (2)"
            correct: true
          - value: "With autoconfiguration, command classes are automatically tagged console.command"
            correct: true
          - value: "Commands must extend ContainerAwareCommand to access services"
            correct: false
          - value: "execute() may return null and the framework converts it to a success exit code"
            correct: false
        explanation: >-
          Symfony 8 favors invokable commands built around __invoke() while the
          classic extends-Command style remains valid, exit statuses use the
          SUCCESS/FAILURE/INVALID constants (0, 1, 2), and autoconfiguration applies
          the console.command tag so commands are registered and loaded lazily.
          ContainerAwareCommand no longer exists — services are injected through the
          constructor — and execute() must return an int, not null.
        documentation: "https://symfony.com/doc/8.0/console.html"
      - id: "CONS-MC-06"
        type: "multiple"
        difficulty: "medium"
        subchapter: "console/built-in-commands"
        concepts: ["list", "maker-bundle", "framework-bundle", "cache-commands"]
        syllabus: "Console → Built-in commands"
        question: "Which statements about the commands available in bin/console are true? (select all that apply)"
        answers:
          - value: "Running bin/console with no command name executes the default list command"
            correct: true
          - value: "The make:* commands come from MakerBundle, not from Symfony core"
            correct: true
          - value: "cache:clear and the debug:* commands are added by FrameworkBundle, not by the standalone Console component"
            correct: true
          - value: "The completion command must be installed through a separate Composer package"
            correct: false
          - value: "help can only display documentation for built-in commands, not custom ones"
            correct: false
        explanation: >-
          list is the default command (so a bare bin/console prints the command list),
          make:* generators ship with MakerBundle rather than core, and cache:clear,
          cache:warmup and debug:* come from FrameworkBundle on top of the component.
          completion is one of the commands present in every Console application
          without extra packages, and help works with any registered command,
          including custom ones.
        documentation: "https://symfony.com/doc/8.0/console.html"
      - id: "CONS-MC-07"
        type: "multiple"
        difficulty: "medium"
        subchapter: "console/input-output"
        concepts: ["SymfonyStyle", "stderr", "sections"]
        syllabus: "Console → Input & Output"
        question: "Which statements about console input and output handling are correct? (select all that apply)"
        answers:
          - value: "SymfonyStyle wraps the input and output and provides styled helpers such as title(), table() and ask()"
            correct: true
          - value: "STDERR is reached through ConsoleOutputInterface::getErrorOutput(), keeping pipeable data clean on STDOUT"
            correct: true
          - value: "Output sections allow parts of the output to be updated independently while the command runs"
            correct: true
          - value: "$output->writeln() writes to STDERR by default so it never pollutes piped output"
            correct: false
          - value: "Console sections require re-running the command to refresh their content"
            correct: false
        explanation: >-
          SymfonyStyle is constructed from the input and output and is the go-to
          styled UI layer; error/diagnostic text belongs on the dedicated error output
          obtained via ConsoleOutputInterface::getErrorOutput(); and output sections
          can be overwritten live and independently during a single run. writeln()
          targets the normal STDOUT stream, which is exactly why diagnostics should be
          sent to the error output instead.
        documentation: "https://symfony.com/doc/8.0/console/style.html"
